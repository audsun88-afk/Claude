{
  id: "slavery",
  cat: "morality",
  title: "Biblical Slavery Was Benign Indentured Servitude",
  who: "Paul Copan, Is God a Moral Monster? (2011); popular apologetics",
  claim: `Slavery in ancient Israel was not like American chattel slavery. It was mostly voluntary debt servitude, limited to six years, with protections for servants (Exodus 21; Deuteronomy 15). Kidnapping was punishable by death (Exodus 21:16). The Bible planted the seeds of abolition with the equality of all in Christ (Galatians 3:28), and Christians led the abolition movement.`,
  short: `The Torah distinguishes between Hebrew debt servants and foreign slaves. Foreigners could be bought as permanent, inheritable property (Leviticus 25:44–46). A master who beats a slave so severely that the slave dies after a day or two goes unpunished, "for the slave is his property" (Exodus 21:20–21). The New Testament tells slaves to obey their masters, never condemns the institution, and was the main textual support for American pro-slavery theology. Christians were prominent among abolitionists, but they were opposed by Christians with the stronger textual arguments, as the historian Mark Noll has documented.`,
  points: [
    { h: "Foreign slaves were permanent property", t: `"As for the male and female slaves whom you may have, it is from the nations around you that you may acquire male and female slaves... and they may be your property. You may keep them as a possession for your children after you, for them to inherit as property. These you may treat as slaves for life; but as for your fellow Israelites, no one shall rule over the other with harshness" (Leviticus 25:44–46). This is chattel slavery: lifelong, inheritable, and based on ethnicity.` },
    { h: "Beating slaves", t: `"When a slave-owner strikes a male or female slave with a rod and the slave dies immediately, the owner shall be punished. But if the slave survives a day or two, there is no punishment; for the slave is the owner's property" (Exodus 21:20–21). A slave who loses an eye or a tooth from a beating goes free (21:26–27), which presupposes that such beatings happen.` },
    { h: "Hebrew servants could become slaves for life", t: `A Hebrew servant went free after six years, but if his master had given him a wife and they had children, "the wife and her children shall be her master's and he shall go out alone" (Exodus 21:4). If he wanted to stay with his family, his ear was pierced with an awl and he became a slave for life (21:5–6). A daughter sold by her father as a slave "shall not go out as the male slaves do" (21:7).` },
    { h: "The New Testament", t: `"Slaves, obey your earthly masters with fear and trembling, in singleness of heart, as you obey Christ" (Ephesians 6:5; also Colossians 3:22; Titus 2:9). "Slaves, accept the authority of your masters with all deference, not only those who are kind and gentle but also those who are harsh" (1 Peter 2:18). Paul sends the runaway slave Onesimus back to his master, Philemon. Galatians 3:28 ("there is neither slave nor free") refers to status in Christ, and the early church accepted slaveholding members for centuries.` },
    { h: "The American debate", t: `In the antebellum United States, pro-slavery ministers cited Leviticus 25, the Pauline household codes, and Philemon, while abolitionists appealed to the general spirit of the Bible. The historian Mark Noll (*The Civil War as a Theological Crisis*, 2006) concludes that on a plain reading of the texts, the pro-slavery side often had the stronger argument. The Southern Baptist Convention was founded in 1845 in a split over slavery and formally apologized in 1995. Enlightenment ideas of natural rights, Quaker dissent, and slave resistance all shaped abolition.` }
  ],
  replies: [
    { q: "Biblical slavery was voluntary debt servitude, not like American slavery.", a: `That's true of the rules for Hebrew servants, but Leviticus 25:44–46 describes a different category: foreigners bought as permanent property and passed down to children. Exodus 21:20–21 says a master who beats a slave to death goes unpunished if the slave lingers a day or two, "for the slave is his property." That's not employment.`, k: "voluntary debt servitude indentured not like american slavery servants" },
    { q: "Christians ended slavery. Wilberforce was driven by his faith.", a: `Many abolitionists were devout Christians, and their faith motivated them. But their opponents were also Christians, who quoted the Bible and had the plainer texts on their side. For 1,800 years, the church largely accepted slavery. Abolition drew on Enlightenment ideas of natural rights and on the resistance of enslaved people, not only on scripture.`, k: "christians ended slavery wilberforce abolition faith" },
    { q: "Kidnapping slaves was punishable by death (Exodus 21:16), so the Bible condemned slave trading.", a: `Exodus 21:16 forbids kidnapping a person (the parallel in Deuteronomy 24:7 specifies a fellow Israelite) and selling them. Buying foreigners from the surrounding nations, or acquiring them as war captives (Deuteronomy 20:14; Numbers 31:18), was explicitly permitted. The law protected Israelites from being kidnapped, not foreigners from being enslaved.`, k: "kidnapping punishable by death exodus 21:16 slave trading condemned" }
  ],
  sources: [
    "Noll, M. (2006). The Civil War as a Theological Crisis. University of North Carolina Press.",
    "Avalos, H. (2011). Slavery, Abolitionism, and the Ethics of Biblical Scholarship. Sheffield Phoenix.",
    "Glancy, J. (2002). Slavery in Early Christianity. Oxford University Press.",
    "Copan, P. (2011). Is God a Moral Monster? Baker.",
    "Harrill, J. A. (2006). Slaves in the New Testament. Fortress.",
    "Southern Baptist Convention (1995). Resolution on Racial Reconciliation."
  ],
  keys: "slavery bible slaves leviticus 25 exodus 21 property beat slaves obey your masters indentured servitude abolition christians ended slavery onesimus philemon",
  rel: ["moral-argument", "christian-civilization", "jesus-moral-teaching"]
},
{
  id: "genocide",
  cat: "morality",
  title: "God's Commands to Destroy the Canaanites Were Just",
  who: "Paul Copan & Matthew Flannagan, Did God Really Command Genocide? (2014); William Lane Craig; Clay Jones",
  claim: `The Canaanites were exceptionally wicked, practicing child sacrifice and sexual depravity; God waited 400 years before judging them (Genesis 15:16). As the giver and taker of life, God has the right to end lives. The language of total destruction is ancient Near Eastern hyperbole, like a sports team saying it "annihilated" its opponent; the texts don't describe literal genocide. And the children who died went to heaven.`,
  short: `The texts are explicit about killing everyone, including children and infants: "kill both man and woman, child and infant, ox and sheep" (1 Samuel 15:3). Numbers 31 has Moses order the killing of every boy and every non-virgin woman and give the virgin girls to the soldiers. The hyperbole defense fails for these passages, and the "it was hyperbole" view still has God commanding the sort of total war he would condemn elsewhere. The *herem* (ban) was standard ancient Near Eastern war ideology: the Moabite king Mesha boasts of doing the same to an Israelite town at the command of his god Chemosh. Craig's argument that killing children benefited them because they went to heaven would justify killing any child.`,
  points: [
    { h: "What the texts command", t: `"In the towns of these peoples that the Lord your God is giving you as an inheritance, you must not let anything that breathes remain alive. You shall annihilate them" (Deuteronomy 20:16–17). "Now go and attack Amalek, and utterly destroy all that they have; do not spare them, but kill both man and woman, child and infant, ox and sheep, camel and donkey" (1 Samuel 15:3). Saul is condemned and loses his kingdom for sparing the king and the best animals (15:9–23).` },
    { h: "Numbers 31", t: `After the war against Midian, Moses is angry that the soldiers spared the women: "Now kill every male among the little ones, and kill every woman who has known a man by sleeping with him. But all the young girls who have not known a man by sleeping with him, keep alive for yourselves" (Numbers 31:17–18). The spoil included 32,000 virgin girls (31:35). No hyperbole reading makes this better.` },
    { h: "The hyperbole defense", t: `Copan and Flannagan argue that ancient war reports used exaggeration, and that later texts show the Canaanites still around. Some exaggeration is real. But the commands, not just the reports, specify women, children, and infants, and the narratives condemn incomplete obedience. Wes Morriston (*Philosophia Christi*, 2009) argues that the inerrantist can't escape the problem: either God commanded the killing of children, or the Bible is wrong about what God commanded. Even if the conquest didn't happen (see [[conquest]]), the texts present God as commanding it, which is a problem for inerrancy.` },
    { h: "Standard ancient war ideology", t: `The Mesha Stele (c. 840 BCE): "Chemosh said to me, 'Go, take Nebo from Israel.' I went by night and fought against it from daybreak until noon, taking it and killing everyone: seven thousand men, boys, women, girls, and female slaves, for I had devoted it (*hḥrmth*) to Ashtar-Chemosh." The same word and practice as the biblical *herem*. The biblical commands look like Israel's version of a common ancient ideology, in which the national god demands total war.` },
    { h: "'They went to heaven'", t: `Craig has argued that the Canaanite children, dying before the age of accountability, were saved, so their deaths were not a wrong to them. That argument would justify killing any child under any circumstances, and it's the reasoning of a crusader, not a moral theory. It also contradicts the claim that God is the God of the fatherless (Psalm 68:5).` }
  ],
  replies: [
    { q: "The Canaanites practiced child sacrifice. God was judging their wickedness.", a: `Killing the children to punish their parents' child sacrifice kills the very children who were the victims. And the same Bible records Israelites practicing child sacrifice (2 Kings 16:3; 21:6; Jeremiah 7:31; Ezekiel 20:25–26), without Israel being exterminated. Collective punishment of infants for the deeds of adults is what the Bible itself elsewhere forbids (Deuteronomy 24:16).`, k: "canaanites wicked child sacrifice judgment deserved 400 years" },
    { q: "God is the author of life. He has the right to take it whenever he wants.", a: `If being a creator gives unlimited rights over one's creatures, then "God is good" means nothing more than "God is powerful." We don't think parents have the right to kill their children because they brought them into existence. And the commands were given to human soldiers, who had to kill infants with swords. If a voice told you today to kill children, you'd rightly conclude it wasn't God.`, k: "god author of life right to take life sovereign creator" },
    { q: "It was hyperbole. They didn't literally kill everyone.", a: `Some war reports exaggerate, but the commands specify infants and nursing children and punish incomplete obedience. Numbers 31:17–18 isn't a report of victory but a specific order to kill boys and non-virgin women and keep virgin girls. The hyperbole reading doesn't work for these texts.`, k: "hyperbole exaggeration didn't literally kill everyone ancient war rhetoric" }
  ],
  sources: [
    "Copan, P. & Flannagan, M. (2014). Did God Really Command Genocide? Baker.",
    "Morriston, W. (2009). 'Did God Command Genocide? A Challenge to the Biblical Inerrantist.' Philosophia Christi 11(1): 7–26.",
    "Seibert, E. (2012). The Violence of Scripture. Fortress.",
    "Collins, J. J. (2004). Does the Bible Justify Violence? Fortress.",
    "Stern, P. (1991). The Biblical Herem: A Window on Israel's Religious Experience. Scholars Press.",
    "Craig, W. L. (2007). 'Slaughter of the Canaanites.' Reasonable Faith Q&A #16.",
    "Bergmann, M., Murray, M. & Rea, M. (eds.) (2011). Divine Evil? The Moral Character of the God of Abraham. Oxford University Press."
  ],
  keys: "genocide canaanites amalekites kill everyone men women children infants 1 samuel 15 numbers 31 herem conquest god commanded killing hyperbole joshua",
  rel: ["conquest", "moral-argument", "human-sacrifice", "women"]
},
{
  id: "women",
  cat: "morality",
  title: "The Bible Elevated the Status of Women",
  who: "Popular apologetics; Rodney Stark, The Rise of Christianity (1996), ch. 5; Galatians 3:28",
  claim: `Compared with surrounding cultures, the Bible elevated women. Jesus treated women with dignity, had female disciples, and appeared first to women after his resurrection. Paul said there is "neither male nor female" in Christ (Galatians 3:28). Women had a higher status in early Christian communities than in pagan society.`,
  short: `Some early Christian communities did give women unusual roles, and Jesus' interactions with women are notable. But the Bible's laws and teachings about women include treating them as property, forcing a raped woman to marry her rapist, requiring virginity tests with death for failure, a trial by ordeal for suspected adultery, taking virgin girls as war captives, and commanding women to be silent and submissive. These texts were used for centuries to deny women education, property, and leadership.`,
  points: [
    { h: "Women as property", t: `The Tenth Commandment lists a neighbor's wife alongside his house, slaves, ox, and donkey as things not to covet (Exodus 20:17). A father could sell his daughter as a slave (Exodus 21:7). A man's vow binds him, but a woman's vow can be annulled by her father or husband (Numbers 30:3–8).` },
    { h: "Rape and marriage", t: `"If a man meets a virgin who is not engaged, and seizes her and lies with her, and they are caught in the act, the man who lay with her shall give fifty shekels of silver to the young woman's father, and she shall become his wife. Because he violated her he shall not be permitted to divorce her as long as he lives" (Deuteronomy 22:28–29). The Hebrew verb *tapas* means to seize or take hold of. The compensation goes to the father.` },
    { h: "Virginity and death", t: `If a husband claims his bride wasn't a virgin and her parents can't produce evidence of her virginity, "they shall bring the young woman out to the entrance of her father's house and the men of her town shall stone her to death" (Deuteronomy 22:20–21). A woman suspected of adultery could be made to drink "the water of bitterness"; if guilty, "her womb shall discharge, her uterus drop" (Numbers 5:11–31).` },
    { h: "The New Testament", t: `"Women should be silent in the churches. For they are not permitted to speak, but should be subordinate, as the law also says. If there is anything they desire to know, let them ask their husbands at home" (1 Corinthians 14:34–35; possibly a later interpolation). "I permit no woman to teach or to have authority over a man; she is to keep silent. For Adam was formed first, then Eve; and Adam was not deceived, but the woman was deceived... Yet she will be saved through childbearing" (1 Timothy 2:12–15). "Wives, be subject to your husbands as you are to the Lord" (Ephesians 5:22).` },
    { h: "The history", t: `These texts were used to bar women from ordination, education, property ownership, and voting for many centuries. Opponents of women's suffrage cited them. Many denominations, including the Catholic Church, the Orthodox churches, and the Southern Baptist Convention, still restrict leadership roles to men on biblical grounds. Improvements in women's status in Christian-majority countries came largely through secular legal reforms, often against religious opposition.` }
  ],
  replies: [
    { q: "Jesus appeared first to women and had female followers. That was revolutionary.", a: `Jesus' respect for women is a real and admirable part of the Gospel portraits, and women did play significant roles in early communities (Romans 16). But the same New Testament silences women in church and grounds their subordination in Genesis. And the Hebrew Bible's laws on rape, virginity, and property are what the "inspired" text says. A selective reading of the best passages doesn't remove the rest.`, k: "jesus appeared first to women female disciples revolutionary respect" }

{
  id: "harsh-laws",
  cat: "morality",
  title: "The Old Testament Laws Were for Their Time",
  who: "Common apologetic response; covenant theology; 'the ceremonial, civil, and moral law' distinction (Aquinas; Westminster Confession 19)",
  claim: `The harsh laws of the Old Testament were given to a particular nation at a particular time and were an improvement on surrounding cultures. Christians aren't under the Mosaic law; Christ fulfilled it. Theologians distinguish ceremonial laws (abolished), civil laws (for Israel), and moral laws (permanent).`,
  short: `If the laws were good only "for their time," then God's commands reflected the morals of the Iron Age rather than timeless goodness, which is what we'd expect if they were human laws. The three-way division of the law is a later theological construct; the Torah doesn't make it. Jesus said not a letter of the law would pass away until heaven and earth pass away (Matthew 5:18). And some of these laws are not improvements on their neighbors' at all: the death penalty for working on the Sabbath, for cursing parents, or for apostasy.`,
  points: [
    { h: "The laws themselves", t: `Death for gathering sticks on the Sabbath (Numbers 15:32–36). Death for cursing father or mother (Exodus 21:17; Leviticus 20:9). A stubborn and rebellious son to be stoned by the men of the town (Deuteronomy 21:18–21). Death for a man who lies with a man (Leviticus 20:13). Death for anyone, including a family member, who suggests worshipping other gods (Deuteronomy 13:6–10). "You shall not permit a female sorcerer to live" (Exodus 22:18), cited in European witch trials that killed tens of thousands.` },
    { h: "'For their time' gives the game away", t: `A morally perfect, unchanging God who wanted to improve on the surrounding cultures could have prohibited slavery, sexual violence, and the killing of apostates. If the laws were adjusted to the moral level of the time, they're just what an Iron Age society would produce. That's the skeptic's thesis.` },
    { h: "The three-fold division isn't in the text", t: `The Torah presents its laws as one covenant, mixing what we'd call moral, ritual, and civil rules in the same chapters (Leviticus 19 has "love your neighbor as yourself" next to prohibitions on mixing fabrics and on tattoos). The ceremonial/civil/moral division was systematized much later (Aquinas, *Summa Theologiae* I-II q. 99; the Westminster Confession, 1646). Deciding which laws are "moral" requires an independent moral standard.` },
    { h: "Jesus affirmed the law", t: `"Do not think that I have come to abolish the law or the prophets... until heaven and earth pass away, not one letter, not one stroke of a letter, will pass from the law until all is accomplished. Therefore, whoever breaks one of the least of these commandments, and teaches others to do the same, will be called least in the kingdom of heaven" (Matthew 5:17–19). In Mark 7:10 he cites the death penalty for cursing parents as God's command, against the Pharisees.` }
  ],
  replies: [
    { q: "These laws were an improvement over the surrounding cultures, like Hammurabi's code.", a: `Some were, in some respects. Others weren't: Hammurabi doesn't execute people for working on a particular day. The deeper problem is that "better than Hammurabi" is a low bar for a perfect God. A standard of comparison set by neighboring Iron Age kingdoms is exactly what we'd expect of a human legal code from the same region.`, k: "improvement surrounding cultures hammurabi better than neighbors progressive" },
    { q: "Christians aren't under the Old Testament law anymore.", a: `That's a reason Christians don't follow these laws today. It doesn't explain why a perfectly good God commanded them in the first place. A command to stone a disobedient son was either good when it was given, which is hard to accept, or it wasn't, in which case it didn't come from a perfectly good God.`, k: "christians not under law old covenant new covenant fulfilled" }

{

  cat: "morality",
  title: "The God of the Bible Opposed Human Sacrifice",
  who: "Traditional reading of Genesis 22 (the binding of Isaac); Deuteronomy 12:31; Jeremiah 7:31",
  claim: `Unlike the gods of the Canaanites, Yahweh condemned child sacrifice. The binding of Isaac (Genesis 22) teaches that God doesn't want human sacrifice: he provides a ram instead. The prophets condemned child sacrifice as an abomination that never entered God's mind (Jeremiah 7:31).`,
  short: `The Hebrew Bible contains traces of an earlier Israelite acceptance of child sacrifice, and its condemnation was a development. God commands Abraham to sacrifice Isaac, and Abraham is praised for his willingness. Jephthah sacrifices his daughter after a vow, and the text doesn't condemn it. Ezekiel 20:25–26 says God gave Israel "statutes that were not good," making them offer their firstborn. Exodus 22:29 says "the firstborn of your sons you shall give to me." And Christianity is built on the idea that God required the death of his son.`,
  points: [
    { h: "Abraham and Isaac", t: `"Take your son, your only son Isaac, whom you love... and offer him there as a burnt offering" (Genesis 22:2). Abraham is commended because he didn't withhold his son (22:12, 16). The story assumes that God might demand this and that obeying would be righteous. Some scholars (Levenson, *The Death and Resurrection of the Beloved Son*, 1993) argue it reflects a world in which the sacrifice of the firstborn was a recognized ideal.` },
    { h: "Jephthah's daughter", t: `Jephthah vows to sacrifice "whoever comes out of the doors of my house to meet me" if God gives him victory. God gives the victory. His daughter comes out, and "he did with her according to the vow he had made" (Judges 11:30–39). The text doesn't condemn him, and Hebrews 11:32 lists Jephthah among the heroes of faith.` },
    { h: "'Statutes that were not good'", t: `"Moreover I gave them statutes that were not good and ordinances by which they could not live. I defiled them through their very gifts, in their offering up all their firstborn, in order that I might horrify them" (Ezekiel 20:25–26). Ezekiel attributes the practice to God's own (punitive) command. "The firstborn of your sons you shall give to me" (Exodus 22:29), unlike Exodus 34:20, has no redemption clause.` },
    { h: "Chemosh's sacrifice works", t: `In 2 Kings 3:27, the king of Moab, losing a battle, sacrifices his firstborn son on the city wall: "And great wrath came upon Israel, so they withdrew from him and returned to their own land." The text presents the sacrifice as effective, implying the power of the Moabite god.` },
    { h: "The cross", t: `Christian theology holds that God required the death of his innocent son as the means of salvation (see [[atonement]]). If human sacrifice is an abomination, it's hard to see why the central act of Christianity is a human sacrifice that God planned and accepted.` }
  ],
  replies: [
    { q: "The point of the Isaac story is that God stopped it and provided a ram.", a: `God stopped it at the last moment, after commanding it, and Abraham is praised for being willing to kill his son because God said so. The lesson isn't "don't sacrifice children"; it's "obey even if commanded to." That's the same reasoning that leads people today to harm their children because they believe God told them to.`, k: "isaac god stopped it provided ram test of faith abraham" }

{

  cat: "morality",
  title: "Christianity Built Western Civilization",
  who: "Tom Holland, Dominion (2019); Rodney Stark, The Victory of Reason (2005); Glen Scrivener; Vishal Mangalwadi",
  claim: `Our modern values, such as human rights, the dignity of the individual, care for the weak, equality, hospitals, universities, and science, come from Christianity. Even secular humanism is a Christian heresy, living on borrowed moral capital (Holland). A civilization that abandons its Christian roots will lose these values.`,
  short: `Christianity shaped Western culture profoundly. That's a historical fact, but it says nothing about whether Christian doctrines are true; Islam shaped the Islamic world and Confucianism shaped China. Many modern values were opposed by the churches when they arose: religious liberty, democracy, free inquiry, the abolition of slavery, and women's rights were advanced largely against Christian authorities, drawing on classical and Enlightenment sources. Holland himself says *Dominion* argues for Christianity's influence, not its truth.`,
  points: [
    { h: "Influence is not truth", t: `The argument from cultural consequences is an argument about influence, not truth (see [[consequences]]). Ancient Rome's culture shaped Europe deeply, and no one concludes that Jupiter exists. Tom Holland, whose book *Dominion* is the most influential recent statement of this argument, has said in interviews that he is unsure whether he believes in God; the book is history, not apologetics.` },
    { h: "Many values were won against the church", t: `Religious toleration was opposed by both Catholic and Protestant authorities for centuries; the Catholic Church condemned freedom of conscience in the *Syllabus of Errors* (1864). Democracy, free speech, and a free press were advanced by Enlightenment thinkers, often against established churches. The *Index of Forbidden Books* operated from 1559 to 1966. Inquisitions, witch trials, and wars of religion were driven by Christian conviction.` },
    { h: "Other sources", t: `Human dignity and natural rights draw on Greek and Roman thought (Stoic universalism; Cicero's natural law) as well as on Christianity. Universities emerged from cathedral schools but also drew on Islamic and classical scholarship. Hospitals and charities existed in Buddhist India (Ashoka's edicts, 3rd century BCE) and in the Islamic world (bimaristans). Science has roots in Greek, Indian, Chinese, and Islamic scholarship (see [[science-founders]]).` },
    { h: "The secular societies are doing fine", t: `The least religious societies in the world today, such as the Scandinavian countries, the Netherlands, Japan, and the Czech Republic, rank among the highest on measures of human rights, health, education, low crime, and happiness (Zuckerman, *Society without God*, 2008). Their values haven't collapsed with church attendance.` }
  ],
  replies: [
    { q: "Atheists are living on borrowed Christian capital. Without Christianity, human rights will collapse.", a: `Human rights rest on reasons anyone can understand: suffering is bad, people have interests and dignity, and cooperation benefits everyone. These don't depend on Christian doctrine. Some of the most secular societies on earth have some of the strongest human rights protections. And historically, many of those rights were won against religious authorities.`, k: "borrowed christian capital human rights collapse without christianity holland dominion" }

{

  title: "Atheism Led to the Worst Atrocities in History",
  who: "Dinesh D'Souza, What's So Great About Christianity (2007); popular apologetics (Stalin, Mao, Pol Pot, Hitler)",
  claim: `The 20th century's atheist regimes, Stalin's USSR, Mao's China, and Pol Pot's Cambodia, killed tens of millions, more than all religious wars combined. Without God, there's nothing to restrain human evil. Atheism leads to tyranny.`,
  short: `Those regimes were totalitarian ideologies (Marxism-Leninism, Maoism) that functioned like political religions, with infallible leaders, sacred texts, and persecution of heretics. They killed because of their doctrines and their unchecked power, not because of a lack of belief in God. Hitler wasn't an atheist regime: Nazi Germany was overwhelmingly Christian, and Hitler spoke of Providence and "positive Christianity." Atheism isn't a doctrine and prescribes nothing, while the most atheist societies today are among the most peaceful. And even if atheism had bad consequences, that wouldn't make God exist.`,
  points: [
    { h: "The cause was totalitarian ideology", t: `Stalin, Mao, and Pol Pot killed in the name of revolutionary utopias: forced collectivization, class war, and the elimination of "enemies of the people." Their regimes had cults of personality, official scriptures, and doctrinal orthodoxy enforced by terror, much like a theocracy. The relevant variable is unaccountable power plus a dogmatic ideology, which religious regimes have also had (the Inquisition; the Crusades; the Thirty Years' War, which killed perhaps a third of the population of the German lands).` },
    { h: "Hitler", t: `Hitler said in *Mein Kampf* (1925): "by defending myself against the Jew, I am fighting for the work of the Lord." The Nazi party program endorsed "positive Christianity" (Point 24, 1920). Wehrmacht belt buckles read *Gott mit uns*. Hitler's private views were idiosyncratic and hostile to the churches, but he wasn't an atheist, and the German population that carried out the Holocaust was about 95% Catholic or Protestant. Centuries of Christian anti-Judaism prepared the ground (Luther's *On the Jews and Their Lies*, 1543).` },
    { h: "Atheism prescribes nothing", t: `Atheism is the absence of belief in gods. It has no commandments and no texts. Marxism is atheistic, but so are the secular democracies of Scandinavia and Japan, which are among the least violent societies in history. You can't derive "kill the kulaks" from "there is no God." You can derive "kill the Amalekites" from "God commands it" (1 Samuel 15:3).` },
    { h: "Consequences don't settle truth", t: `Even if a belief in God made people behave better, that would show belief is useful, not that it's true. See [[consequences]].` }
  ],
  replies: [
    { q: "Stalin, Mao, and Pol Pot killed 100 million people in the name of atheism.", a: `They killed in the name of communism, a totalitarian ideology with its own dogmas and infallible leaders. The atheism of the Soviet state was part of that ideology, which also persecuted secular dissenters, scientists (Lysenkoism), and artists. Secular democracies with large non-religious populations, such as Sweden, Japan, and the Netherlands, have very low rates of violence. The common factor in mass murder is unaccountable power plus dogma, not unbelief.`, k: "stalin mao pol pot killed 100 million atheism atheist regimes communism" },
    { q: "Hitler was an atheist and an evolutionist.", a: `Hitler repeatedly invoked God and Providence in public and private, and the Nazi program endorsed "positive Christianity." His beliefs were his own blend, hostile to the churches' independence, but not atheist. Nazi race theory drew on pseudo-science and long-standing Christian antisemitism. Darwinism doesn't say we should kill the weak any more than physics says we should push people off buildings.`, k: "hitler atheist evolutionist darwin nazi" }

  title: "The Argument from Religious Experience",
  who: "Richard Swinburne, The Existence of God (2004), ch. 13 ('Principle of Credulity'); William Alston, Perceiving God (1991); Caroline Franks Davis (1989)",
  claim: `Millions of people across history report experiencing God's presence directly. Swinburne's Principle of Credulity: if it seems to you that something is present, then probably it is, unless you have special reasons for doubt. We trust our sense perception on that basis, and we should treat religious experience the same way. Alston argues that Christian mystical practice is a socially established "doxastic practice" just as reliable as sense perception.`,
  short: `Religious experiences across traditions report incompatible things: the Christian Trinity, Allah who has no son, Krishna, the impersonal Brahman, the Buddhist emptiness in which there's no God at all. They can't all be veridical, and their content tracks the experiencer's culture. They can also be produced reliably by drugs, brain stimulation, fasting, sleep deprivation, chanting, and training. These are exactly the "special reasons for doubt" the Principle of Credulity allows for. Alston himself conceded that religious diversity was the most serious problem for his view.`,
  points: [
    { h: "Conflicting experiences", t: `A Catholic in Lourdes sees the Virgin Mary; a Hindu experiences Krishna; a Muslim Sufi experiences union with Allah, who has no son; a Buddhist meditator experiences the absence of any self or creator; an Oglala Sioux in a vision quest meets Wakan Tanka. If religious experience is reliable, these contents conflict. If it's not reliable in general, a Christian's experience gets no special weight. Alston acknowledged this in *Perceiving God* (ch. 7) as the most difficult problem for his position.` },
    { h: "Culture shapes content", t: `People almost always experience the divine figures of their own tradition. Marian apparitions happen to Catholics, not Protestants or Muslims. Anthropologist Tanya Luhrmann (*When God Talks Back*, 2012; *How God Becomes Real*, 2020) showed that evangelicals learn, through practices such as prayer exercises, to experience God's voice and presence. People with the trait of "absorption" (the tendency to become immersed in imagination) are more likely to have such experiences. The experiences are real; they're learned interpretations of inner states.` },
    { h: "We can produce them", t: `In a controlled study at Johns Hopkins (Griffiths et al., *Psychopharmacology*, 2006), about a third of participants given psilocybin rated the experience as the single most spiritually significant of their lives, and about two-thirds ranked it among their top five, with lasting changes in attitudes. Temporal lobe epilepsy can produce intense religious experiences. Meditation, fasting, chanting, sensory deprivation, and sleep deprivation are used across religions to induce them. If an experience can be reliably produced by changing brain chemistry, that's a reason to doubt it's a perception of something external.` },
    { h: "Unlike sense perception, it can't be checked", t: `When I see a tree, others can see it, I can touch it, photograph it, and predict what will happen if I walk into it. Perception is part of a web of cross-checks. Religious experience has no comparable checks: there's no way to test a report of God's presence against an independent observation. That's why Swinburne's analogy is weak.` }

    { q: "I've personally experienced God's presence. You can't argue me out of my own experience.", a: `I'm not denying you had the experience. The question is what caused it. Muslims, Hindus, and Mormons report experiences just as real and life-changing that confirm their own faiths, and they can't all be right. If your experience confirms Christianity, theirs confirm contradictory beliefs. The most consistent explanation is that people have real experiences that they interpret through the beliefs they already hold.`, k: "personally experienced god presence felt god my experience can't argue holy spirit felt" },

{
  id: "miracles-hume",
  cat: "experience",
  title: "Miracles Are Possible, and Hume Was Wrong",
  who: "C. S. Lewis, Miracles (1947); John Earman, Hume's Abject Failure (2000); Craig Keener, Miracles (2011); David Johnson",
  claim: `If God exists, miracles are possible. Hume's argument that no testimony can establish a miracle is circular: it assumes uniform experience against miracles, when the miracle reports are themselves part of human experience. Earman, a philosopher of science, called Hume's argument an "abject failure." Ruling miracles out in advance is naturalistic bias.`,
  short: `Hume's main point survives Earman's critique: belief should be proportioned to evidence, and testimony to an event as improbable as a miracle must be stronger than the probability that the witnesses are mistaken or deceived. Earman's own Bayesian framework gives the same practical verdict for ancient religious testimony. Nobody needs to rule miracles out in advance. What's ruled out is accepting them on weak evidence, a standard Christians themselves apply to the miracles of other religions.`,
  points: [
    { h: "Hume's actual argument", t: `Hume (*Enquiry*, §X, 1748): "no testimony is sufficient to establish a miracle, unless the testimony be of such a kind, that its falsehood would be more miraculous than the fact which it endeavours to establish." That's a principle of comparing probabilities: is it more likely that the witnesses are wrong, or that a law of nature was suspended? Part 2 adds empirical reasons for doubt: miracle reports flourish among people predisposed to believe them, people love to spread wonders, and the miracles of rival religions cancel each other out.` },
    { h: "Earman's critique cuts both ways", t: `Earman argued that Hume's "in principle" argument fails: in Bayesian terms, enough independent and reliable testimony could, in principle, establish an improbable event. But he also stressed that this requires witnesses who are independent and whose reliability is very high. Ancient, anonymous, interdependent, partisan testimony about religious wonders doesn't meet that bar. Earman's critique is about Hume's formulation, not a defense of any particular miracle.` },
    { h: "Not circular", t: `Hume doesn't assume that miracles never happen. He assumes that we know, from overwhelming experience, how people come to report wonders, and how rarely (if ever) such reports turn out true when they can be checked. The background rate of false miracle reports is enormous and documented. The background rate of verified miracles is zero. That's evidence, not a presupposition.` },
    { h: "The consistency test", t: `Christians reject the miracles of Islam (Muhammad splitting the moon), Hinduism (Ganesha drinking milk in 1995), Mormonism, Catholic apparitions (for Protestants), and Sathya Sai Baba, using Hume's reasoning. The skeptic applies the same reasoning to Christian miracles.` },
    { h: "Extraordinary claims need extraordinary evidence", t: `This principle (Laplace; popularized by Carl Sagan) follows directly from probability theory: the lower the prior probability of a hypothesis, the stronger the evidence needed to make it probable. It's not an arbitrary rule against miracles.` }
  ],
  replies: [
    { q: "Hume's argument is circular. He assumes uniform experience against miracles.", a: `Hume relies on the documented pattern of human testimony: how often people report wonders that turn out to be false, and how rarely checks confirm them. That's evidence. The question is always comparative: which is more probable, that the witnesses erred, or that a miracle happened? For the miracles you reject in other religions, you reason exactly like this.`, k: "hume circular uniform experience against miracles assumes conclusion" },
    { q: "If God exists, miracles are possible. You're just assuming naturalism.", a: `I'm not ruling out miracles if God exists. I'm saying a specific miracle claim needs evidence that outweighs the many ordinary explanations, as it would for any claim. If God exists, that doesn't tell us which of the many conflicting miracle reports are true. You'd still need evidence for each.`, k: "god exists miracles possible assuming naturalism anti supernatural bias" }
  ],

  claim: `Craig Keener's two-volume study documents hundreds of credible, eyewitness-attested modern miracles: healings of blindness, deafness, cancer, and even resurrections of the dead, many medically documented. Surveys show hundreds of millions of people worldwide say they have witnessed divine healing. Candy Gunther Brown's study in Mozambique measured improved hearing and vision after prayer.`,

  points: [
    { h: "Reports are not evidence of miracles", t: `Keener gathers testimonies from many sources, often second- or third-hand, with limited medical documentation and no independent investigation. The number of reports is impressive but expected: with billions of people praying for healing and conditions that naturally fluctuate or remit, many remarkable recoveries will follow prayer by chance. A thousand anecdotes without controls equal a thousand anecdotes.` },
    { h: "The Mozambique study", t: `Brown and colleagues (*Southern Medical Journal*, 2010) tested 24 subjects with hearing or vision impairments before and after "proximal" prayer by Pentecostal ministers. There was no control group, testing was done in uncontrolled field conditions by investigators who were not blind to the intervention, and the measured improvements are consistent with suggestion and response bias in subjective tests.` },
    { h: "Doctors who checked", t: `Surgeon William Nolen (*Healing: A Doctor in Search of a Miracle*, 1974) followed up people who reported being healed at Kathryn Kuhlman's meetings and found no cures of organic disease. In 1986, James Randi exposed televangelist Peter Popoff, who claimed God revealed sick people's names and illnesses, as receiving the information from his wife through an earpiece. Investigations of Benny Hinn's crusades found no verified cures, and some cases where people deteriorated after stopping treatment.` },
    { h: "Why won't God heal amputees?", t: `Every claimed healing involves a condition that can improve naturally, be misdiagnosed, or be influenced by psychology: pain, hearing, vision, tumors (spontaneous remission is rare but documented), or symptoms of functional disorders. No case of a regrown amputated limb has ever been documented, despite many devout amputees and many prayers. That's exactly the pattern expected if no supernatural healing occurs.` },
    { h: "Every religion has them", t: `Hindu holy men, Muslim saints' shrines, Buddhist relics, shamanic healers, and practitioners of alternative medicine all have testimonies of healings. If modern healing reports count as evidence for Christianity, the others count for their traditions.` }
  ],
  replies: [
    { q: "I know someone who was healed of cancer after prayer, and the doctors couldn't explain it.", a: `I'm glad they recovered. "Doctors couldn't explain it" usually means the recovery was unusual, not inexplicable in principle: some cancers regress spontaneously, diagnoses are sometimes wrong, and treatments sometimes work better than expected. Meanwhile, many people of strong faith die of cancer despite prayer. Without controlled comparisons, we can't attribute any single recovery to prayer.`, k: "healed of cancer after prayer doctors couldn't explain friend healed testimony" },
    { q: "Keener documented hundreds of miracles, including resurrections.", a: `Keener documented hundreds of *reports*. He didn't conduct medical investigations, and few cases include verifiable records. Reports of resurrections in particular often involve people who were thought to be dead but weren't, which happens in places without medical monitoring. The volume of reports tells us how common such beliefs are.`, k: "keener documented hundreds miracles resurrections modern" }

{
  id: "lourdes",
  cat: "experience",
  title: "The Miracles of Lourdes",
  who: "The Lourdes Medical Bureau and the International Medical Committee of Lourdes (CMIL); Catholic apologetics",
  claim: `Since the Virgin Mary appeared to Bernadette Soubirous in 1858, thousands of cures have been reported at Lourdes, and 72 have been officially recognized as miracles after rigorous medical investigation by an international committee of doctors, including skeptics. These cures are medically inexplicable.`,
  short: `About 200 million or more pilgrims have visited Lourdes since 1858, most hoping for healing. Over more than 160 years, the Church has recognized 72 cures, most from the era before modern diagnostic medicine. That's far below the expected rate of spontaneous remission and misdiagnosis in such a large, sick population. The recognition criterion is "medically unexplained," which is an admission of ignorance, not evidence of a miracle. No recognized cure involves something that couldn't happen naturally, such as a regrown limb.`,
  points: [
    { h: "The base rate", t: `Lourdes receives millions of visitors a year, many of them seriously ill. Some cancers and other conditions remit spontaneously at low but real rates. Diagnoses, especially in the 19th and early 20th centuries, were often uncertain. In a population of hundreds of millions of hopeful sick people over 160 years, one would expect *many* unexplained recoveries by chance alone. 72 recognized cases is unremarkable, and arguably lower than expected.` },
    { h: "Recognitions decline as medicine improves", t: `Most recognized cures occurred in the late 19th and early 20th centuries, many of tuberculosis and other conditions that were poorly understood and hard to diagnose at the time. As diagnostic tools improved, recognitions became rare. That's the reverse of what we'd expect if real miracles were happening at a constant rate, and exactly what we'd expect if gaps in medical knowledge were being labeled miracles.` },
    { h: "'Unexplained' is not 'supernatural'", t: `The committee judges whether a cure is "unexplained in the current state of scientific knowledge." The Church then declares it a miracle. Moving from "we can't explain it" to "God did it" is an argument from ignorance. Many conditions once unexplained are now understood.` },
    { h: "What has never happened", t: `No recognized Lourdes miracle involves the regrowth of an amputated limb, an eye restored after removal, or anything else that would be unambiguous. Émile Zola, who visited in 1892, made this point; it still holds.` }
  ],
  replies: [
    { q: "The Lourdes medical committee includes skeptical doctors and uses rigorous criteria.", a: `The criteria are careful, but they test whether a recovery is medically unexplained, not whether it's supernatural. The real issue is base rates: with hundreds of millions of sick pilgrims, rare unexplained recoveries are inevitable. 72 in over 160 years is what chance and diagnostic uncertainty predict.`, k: "lourdes medical committee skeptical doctors rigorous criteria inexplicable" }

  who: "Catholic apologetics; eyewitness accounts including the journalist Avelino de Almeida (O Século, 1917)",
  claim: `On October 13, 1917, after the Virgin Mary had appeared to three shepherd children and predicted a miracle, a crowd of 30,000 to 70,000 people at Fatima, Portugal, including skeptics and journalists, saw the sun dance, spin, change color, and plunge toward the earth. The event had been predicted months in advance. Mass hallucination can't explain it.`,
  short: `No observatory, astronomer, or person anywhere else in the world recorded any change in the sun, which would have been visible across half the planet. Witnesses' reports varied widely, and many saw nothing. Staring at the sun, which the crowd did after expectation had been built up for months, produces exactly the reported effects: afterimages, color changes, and apparent spinning and movement. Similar "sun miracles" have been reported at other Marian sites, sometimes accompanied by eye damage.`,
  points: [
    { h: "The sun didn't move", t: `If the sun had actually moved, the effects would have been felt by everyone on the daylit side of the earth, and gravitational consequences would have been catastrophic. No one outside Fatima noticed anything. Whatever happened, happened in the observers, not in the sky.` },
    { h: "Expectation and sun-gazing", t: `The crowd had gathered because a miracle had been predicted. After rain, the clouds parted and people looked at the sun. Belgian physicist Auguste Meessen (2003) explained the reported effects (spinning, color changes, zigzag motion, the sun seeming to approach) as physiological responses of the retina to prolonged sun-gazing: afterimages, fatigue of photoreceptors, and small eye movements. He noted that he had experienced similar effects himself.` },
    { h: "Varied reports", t: `Accounts differ: some saw the sun spin, others saw colors, others saw it fall, and some saw nothing unusual. That's what we'd expect from individual perceptual effects interpreted under shared expectation, not from an objective event.` },
    { h: "It happens elsewhere, with damage", t: `"Dancing sun" reports have occurred at many Marian apparition sites, including Medjugorje. Ophthalmologists have documented cases of solar retinopathy, retinal damage from staring at the sun, among pilgrims at such sites.` },
    { h: "Fatima's other claims", t: `The "secrets" of Fatima were published long after the events they supposedly predicted, and the third secret, revealed in 2000, was vague. The children's visions included a vision of hell with demons and souls like transparent embers, shaped by the religious instruction of rural Portugal at the time.` }
  ],
  replies: [
    { q: "70,000 people, including atheist journalists, can't all have hallucinated.", a: `They didn't need to hallucinate: they looked at the sun after months of expectation, and staring at the sun produces color changes, afterimages, and the illusion of spinning and movement. Not everyone saw the same thing, and some saw nothing. And the sun was observed elsewhere that day by people who saw nothing unusual. A crowd's shared experience of an ordinary physical phenomenon, interpreted through strong expectation, is far more probable than the sun moving for one valley.`, k: "70000 people atheist journalists can't all hallucinate fatima witnesses" }

  sources: [

{
  id: "nde",
  cat: "experience",
  title: "Near-Death Experiences Prove an Afterlife",
  who: "Raymond Moody, Life After Life (1975); Pim van Lommel (Lancet, 2001); Eben Alexander, Proof of Heaven (2012); Gary Habermas & J. P. Moreland",
  claim: `People who come close to death report leaving their bodies, seeing their own resuscitation from above, passing through a tunnel toward a light, meeting deceased relatives, and returning. Some report accurate details they couldn't have known. These "veridical" NDEs show that consciousness continues when the brain is not functioning.`,
  short: `The best prospective tests of veridical NDEs, the AWARE studies, placed hidden images visible only from near the ceiling in resuscitation areas. In the second study (AWARE II, *Resuscitation*, 2023), no survivor identified the images or the auditory stimuli. The content of NDEs varies with culture. NDE-like experiences can be produced by drugs such as ketamine, by hypoxia, and by REM intrusion, and brain recordings show surges of organized activity in dying brains. The "verified" anecdotes collected after the fact can't be checked for contamination.`,
  points: [
    { h: "The AWARE studies", t: `AWARE I (Parnia et al., *Resuscitation*, 2014) studied about 2,000 cardiac arrests at 15 hospitals, with hidden images placed on high shelves. Of the survivors interviewed, about 9% reported NDEs and 2% reported awareness of events; none of the cardiac arrests with visual awareness occurred in rooms with shelves, so no image test was possible. AWARE II (2023), with 567 in-hospital cardiac arrests, used images on a tablet above the patient and audio cues. Among 28 surviving interviewees, 11 reported memories or perceptions, but none identified the images or the audio stimuli.` },
    { h: "Culture shapes content", t: `NDE reports reflect the experiencer's culture. Christians tend to meet Jesus or angels; Hindu Indians have reported being taken by messengers of Yama, the god of death, and sent back because of a clerical error. Some cultures report few tunnels or lights. Allan Kellehear's cross-cultural work shows that much of the content varies.` },
    { h: "The dying brain is active", t: `Borjigin et al. (*PNAS*, 2013) found a surge of highly coherent gamma oscillations in rat brains after cardiac arrest. Xu, Borjigin et al. (*PNAS*, 2023) found similar surges in two of four dying human patients, in regions linked to conscious experience. Ketamine reliably produces experiences very similar to NDEs (Martial et al., *Consciousness and Cognition*, 2019). Hypoxia, high carbon dioxide, and REM-state intrusion (Nelson et al., *Neurology*, 2006) are also associated with NDE-like features.` },
    { h: "Anecdotes can't be checked", t: `Famous "veridical" cases, such as the dentures case from van Lommel's study and the Pam Reynolds case, were reported and reconstructed after the fact, and skeptical analysts (e.g., Woerlee) have pointed out ordinary sources of information (hearing, residual awareness, details learned later). Prospective tests were designed to rule this out, and so far they've found nothing.` },
    { h: "Even if real, which afterlife?", t: `If NDEs showed survival, they would support a culturally varied afterlife in which people of all faiths and none have positive experiences. That's not the Christian picture of judgment and exclusive salvation. Eben Alexander's *Proof of Heaven* includes a woman on a butterfly's wing, not Jesus.` }
  ],
  replies: [
    { q: "People have accurately described their resuscitation while clinically dead.", a: `In retrospective anecdotes, yes. When researchers set up controlled tests with hidden targets, as in AWARE I and II, no one identified them. Retrospective accounts can include details gathered from hearing during partial awareness, prior knowledge of medical procedures, or information heard afterward. The controlled evidence is what counts.`, k: "accurately described resuscitation clinically dead veridical out of body saw from ceiling" },
    { q: "There was no brain activity when the NDE happened.", a: `We usually don't know *when* the experience happened. It may form during the brief periods before, during, or after cardiac arrest when the brain is partly active, and memory of time is unreliable in such states. Recordings show that dying brains can produce surges of organized activity. "Flat EEG" also measures surface activity, not all brain activity.`, k: "no brain activity flatline flat eeg brain dead consciousness" }
  ],
  sources: [
    "Parnia, S. et al. (2014). 'AWARE—AWAreness during REsuscitation—A prospective study.' Resuscitation 85(12): 1799–1805.",
    "Parnia, S. et al. (2023). 'AWAreness during REsuscitation – II: A multi-center study of consciousness and awareness in cardiac arrest.' Resuscitation 191: 109903.",
    "Borjigin, J. et al. (2013). 'Surge of neurophysiological coherence and connectivity in the dying brain.' PNAS 110(35): 14432–14437.",
    "Xu, G. et al. (2023). 'Surge of neurophysiological coupling and connectivity of gamma oscillations in the dying human brain.' PNAS 120(19): e2216268120.",
    "Martial, C. et al. (2019). 'Neurochemical models of near-death experiences: A large-scale study based on the semantic similarity of written reports.' Consciousness and Cognition 69: 52–69.",

    "Kellehear, A. (1996). Experiences Near Death: Beyond Medicine and Religion. Oxford University Press.",
    "Woerlee, G. M. (2011). 'Could Pam Reynolds Hear?' Journal of Near-Death Studies 30(1)."
  ],
  keys: "near death experience nde afterlife out of body experience tunnel light clinically dead saw heaven veridical nde proof of heaven aware study",
  rel: ["soul", "consciousness", "disembodied-mind", "religious-experience"]

{
  id: "prayer-studies",
  cat: "experience",
  title: "Scientific Studies Show Prayer Works",
  who: "Randolph Byrd (Southern Medical Journal, 1988); William Harris (Archives of Internal Medicine, 1999); popular apologetics",
  claim: `Studies have shown that patients who are prayed for recover better. Byrd's 1988 study of coronary care patients found that those who received intercessory prayer had fewer complications. Harris's 1999 study replicated the benefit. Science is confirming the power of prayer.`,
  short: `The early positive studies had serious methodological problems. The largest, best-designed trial, the STEP study (2006), with 1,802 patients and funding from the pro-religious Templeton Foundation, found no benefit from intercessory prayer, and patients who knew they were being prayed for had slightly more complications. The MANTRA II trial also found no effect. Cochrane reviews find no clear evidence. When prayer is tested properly, it does nothing measurable.`,
  points: [
    { h: "The STEP trial", t: `Benson et al. (*American Heart Journal*, 2006) randomized 1,802 coronary bypass patients at six hospitals into three groups: prayed for without being told; not prayed for without being told; and prayed for and told. Prayer had no effect on complication rates. Patients who were *certain* they were being prayed for had more complications: 59% versus 52%. The study was funded by the John Templeton Foundation, which supports research on religion.` },
    { h: "Other large trials", t: `MANTRA II (Krucoff et al., *Lancet*, 2005), with 748 patients at nine centers, found no effect of distant prayer on cardiac outcomes. The Cochrane systematic review of intercessory prayer (Roberts et al., 2009) concluded that the evidence doesn't support recommending it and that further trials aren't a research priority.` },
    { h: "Problems with the positive studies", t: `Byrd (1988) and Harris (1999) used composite outcome scores, measured many outcomes (which raises the risk of false positives), and found effects on some measures but not on others such as mortality or length of stay. In 2001, Leonard Leibovici published a randomized study in the *BMJ* showing that "retroactive prayer," performed years after the patients had already recovered or died, appeared to shorten hospital stays. It was intended to show how such methods produce spurious results.` },
    { h: "Unfalsifiable if it fails", t: `When studies find no effect, some believers say God won't be tested (Deuteronomy 6:16). But the same people cite positive results when they appear. If positive results count for prayer and negative results don't count against it, prayer becomes untestable, and no evidence could ever count either way.` }
  ],
  replies: [
    { q: "You can't test God with experiments. God won't perform on demand.", a: `The studies didn't test God on demand. They tested whether the prayers Christians already pray for sick people, on the basis of promises like James 5:15, make a difference to recovery. If prayer does nothing measurable for the sick in aggregate, that's important to know. And if God refuses to act whenever anyone is checking, his actions can't be distinguished from his absence.`, k: "can't test god experiments god won't perform on demand deuteronomy 6:16" }
  ],
  sources: [

    "Krucoff, M. et al. (2005). 'Music, imagery, touch, and prayer as adjuncts to interventional cardiac care: the MANTRA II randomised study.' Lancet 366: 211–217.",
    "Roberts, L. et al. (2009). 'Intercessory prayer for the alleviation of ill health.' Cochrane Database of Systematic Reviews.",
    "Byrd, R. (1988). 'Positive therapeutic effects of intercessory prayer in a coronary care unit population.' Southern Medical Journal 81(7): 826–829.",
    "Harris, W. et al. (1999). 'A randomized, controlled trial of the effects of remote, intercessory prayer.' Archives of Internal Medicine 159: 2273–2278.",
    "Leibovici, L. (2001). 'Effects of remote, retroactive intercessory prayer on outcomes in patients with bloodstream infection.' BMJ 323: 1450–1451."

{
  id: "shroud",
  cat: "experience",
  title: "The Shroud of Turin",
  who: "Shroud of Turin Research Project (STURP, 1978); Raymond Rogers (2005); Giulio Fanti; Tristan Casabianca; Liberato De Caro (2022)",
  claim: `The Shroud of Turin bears the faint image of a crucified man, with wounds matching the Gospel accounts. Scientists can't explain how the image was made: it's a photographic negative, superficial, and contains 3D information. The 1988 carbon dating that placed it in the medieval period was flawed, because the sample came from a repaired corner. New tests (De Caro, 2022) date the linen to the 1st century. It's the burial cloth of Jesus, and the image may have been formed by the burst of energy of the resurrection.`,
  short: `Three independent laboratories radiocarbon-dated the shroud to 1260–1390 CE (*Nature*, 1989). That matches its first documented appearance, in Lirey, France, around 1354, and a bishop's report in 1389 that an artist had confessed to making it. The "repaired corner" hypothesis has not been confirmed; statistical reanalyses find heterogeneity in the data but still no 1st-century date. The 2022 X-ray dating is a single unreplicated method on one thread. Forensic bloodstain analysis finds the blood flows inconsistent with a real body, and a 2025 digital study found the image fits a low-relief carving better than a 3D body. Even an ancient date wouldn't show a resurrection.`,
  points: [
    { h: "The radiocarbon dating", t: `In 1988, samples were dated independently by laboratories at Oxford, Arizona, and Zurich, under the supervision of the British Museum. The result, published in *Nature* (Damon et al., 1989), was 1260–1390 CE with 95% confidence. The Catholic Church, which owns the shroud, has never claimed it is authentic, calling it an "icon."` },
    { h: "The documentary history", t: `The shroud's first secure appearance is around 1354 in Lirey, France. In 1389, Bishop Pierre d'Arcis wrote to the Avignon pope Clement VII that his predecessor had investigated and found that the cloth was "cunningly painted, the truth being attested by the artist who had painted it." Clement allowed it to be displayed only as a representation, not as the true shroud.` },
    { h: "The 'repair' and the reanalyses", t: `Raymond Rogers (2005) argued the sampled area contained medieval repair threads. Textile experts who examined the shroud during its 2002 restoration didn't find evidence of invisible reweaving in the sampled area. Casabianca et al. (*Archaeometry*, 2019) obtained the raw data and found statistical heterogeneity, which suggests the samples weren't perfectly uniform, but nothing that points to a 1st-century date.` },
    { h: "Recent studies", t: `De Caro et al. (*Heritage*, 2022) used wide-angle X-ray scattering on one thread and argued it was consistent with an ancient date; the method depends on assumptions about storage conditions and hasn't been independently validated or replicated. Borrini and Garlaschelli (*Journal of Forensic Sciences*, 2019) used bloodstain pattern analysis and found that the blood flows on the forearms and back aren't consistent with a single realistic body position. In 2025, Cicero Moraes (*Archaeometry*) compared digital models and found the image fits contact with a low-relief sculpture better than a 3D body; shroud researchers published a rebuttal in 2026, and the debate continues.` },
    { h: "Even if it were ancient", t: `A 1st-century date would show that a crucified man was wrapped in this cloth. It wouldn't show that he was Jesus, or that he rose. And John's Gospel describes "linen wrappings" with a separate cloth for the head (John 20:5–7), not a single long sheet.` }
  ],
  replies: [
    { q: "Scientists still can't explain how the image was formed.", a: `Several methods produce similar images, including bas-relief rubbing and scorching techniques, and the 2025 digital study supports a low-relief model. Not fully reproducing every feature of a 700-year-old object is not evidence of a miracle. The dating, documentary history, and forensic problems with the bloodstains all point the same way: a medieval artifact.`, k: "scientists can't explain image formation 3d negative superficial" },
    { q: "The carbon dating sample came from a repaired section.", a: `That hypothesis was examined during the 2002 restoration, and textile experts didn't find the invisible reweaving it requires. Statistical reanalyses of the raw data show some heterogeneity, but even taken at face value they don't push the date anywhere near the 1st century. The medieval date also matches the shroud's first appearance and a contemporary bishop's report that an artist made it.`, k: "carbon dating repaired corner sample reweave contaminated 1988 wrong" }
  ],
  sources: [
    "Damon, P. E. et al. (1989). 'Radiocarbon dating of the Shroud of Turin.' Nature 337: 611–615.",
    "Nickell, J. (1998). Inquest on the Shroud of Turin, updated ed. Prometheus.",
    "Casabianca, T. et al. (2019). 'Radiocarbon Dating of the Turin Shroud: New Evidence from Raw Data.' Archaeometry 61(5): 1223–1231.",
    "Borrini, M. & Garlaschelli, L. (2019). 'A BPA Approach to the Shroud of Turin.' Journal of Forensic Sciences 64(1): 137–143.",
    "De Caro, L. et al. (2022). 'X-ray Dating of a Turin Shroud's Linen Sample.' Heritage 5(2): 860–870.",
    "Moraes, C. (2025). 'Image Formation on the Holy Shroud—A Digital 3D Approach.' Archaeometry.",
    "Rogers, R. (2005). 'Studies on the radiocarbon sample from the shroud of Turin.' Thermochimica Acta 425: 189–194."

  rel: ["modern-miracles", "empty-tomb", "archaeology"]

{
  id: "possession",
  cat: "experience",
  title: "Demonic Possession and Exorcism Are Real",
  who: "Gabriele Amorth, An Exorcist Tells His Story (1990); Richard Gallagher, Demonic Foes (2020); the Catholic Rite of Exorcism",
  claim: `Jesus cast out demons, and exorcists today see the same phenomena: superhuman strength, speaking languages the person never learned, knowledge of hidden things, aversion to sacred objects, and levitation. Psychiatrist Richard Gallagher says he has seen cases that can't be explained medically. Possession is evidence for the spiritual realm.`,
  short: `Possession states are well studied in anthropology and psychiatry as culturally shaped dissociative states. They take the form the local religion predicts: demons for Christians, jinn for Muslims, ancestral spirits elsewhere. The claimed paranormal signs, such as unlearned languages and levitation, have never been demonstrated under controlled conditions. Belief in possession has caused real harm: people with epilepsy, psychosis, and other treatable conditions have been abused or died during exorcisms.`,
  points: [
    { h: "A recognized dissociative state", t: `The DSM-5 includes possession-form presentations under dissociative identity disorder, and ICD-11 recognizes "possession trance disorder." Anthropologists have documented possession in hundreds of societies, with symptoms that follow cultural scripts (Bourguignon, 1973). Possession is much more common where it's expected, and its features change with the culture's beliefs.` },
    { h: "The Gospel cases are medical", t: `The boy in Mark 9:17–27 foams at the mouth, grinds his teeth, becomes rigid, and falls into fire and water, a classic description of epilepsy; Matthew 17:15 calls him "moonstruck" (*selēniazetai*). Other "demons" cause muteness, blindness, and what we'd call mental illness. In the ancient world, these conditions were widely attributed to spirits.` },
    { h: "Paranormal claims don't survive testing", t: `No case of someone speaking a language they never learned (xenoglossy) has been verified under controlled conditions. Claims of levitation and superhuman strength come from excited witnesses, not instruments. Strength during agitated states (and during adrenaline-driven episodes) is a known physiological effect. Knowledge of "hidden things" fits cold reading and information gathered beforehand. Gallagher's cases are anecdotes reported without independent verification.` },
    { h: "The harm", t: `Anneliese Michel, a German student with epilepsy and psychiatric illness, died in 1976 of malnutrition and dehydration after 67 exorcism sessions over ten months; her parents and two priests were convicted of negligent homicide. Children in parts of Africa and elsewhere accused of witchcraft or possession have been abused and killed. Treating mental and neurological illness as demonic can delay effective treatment.` }
  ],
  replies: [
    { q: "Exorcists report people speaking languages they never learned and knowing secrets.", a: `These claims have never been verified under controlled conditions, where recordings could be checked by linguists and the information could be shown to be unavailable to the person. When glossolalia has been recorded and analyzed, it hasn't been a real language (see [[tongues]]). Anecdotes from people who already believe in demons aren't enough.`, k: "exorcists languages never learned secrets knowledge levitation superhuman strength" }
  ],
  sources: [

  short: `Transformation stories are real and moving, but every religion and many secular programs produce them. Muslims, Buddhists, Mormons, Scientologists, Alcoholics Anonymous members (including secular variants), and people in therapy report changed lives. The mechanisms (a new community, a new identity, hope, structure, accountability, and a narrative of redemption) are well studied in psychology. A belief can change your life and be false.`,

  claim: `On Pentecost, the apostles spoke in foreign languages they had never learned (Acts 2). Today, millions of Pentecostal and charismatic Christians speak in tongues as a gift of the Holy Spirit, either in human languages or the "tongues of angels" (1 Corinthians 13:1). Its spread is evidence of the Spirit's work.`,
  short: `Linguists who have recorded and analyzed glossolalia find that it isn't a language: it lacks grammar and meaning and uses sounds from the speaker's own language. It's a learned behavior that people acquire in supportive settings. Glossolalia occurs in non-Christian religions too. The early Pentecostal missionaries who went abroad believing they could preach in foreign languages through tongues discovered they couldn't.`,
  points: [

    { h: "The missionaries' test", t: `After the Azusa Street Revival in 1906, some Pentecostals believed tongues would allow them to preach in foreign languages without study. Missionaries traveled to India, China, and Africa expecting this, and found they couldn't communicate. The movement then reinterpreted tongues as a private prayer language (Anderson, *Vision of the Disinherited*, 1979).` },

  claim: `I've had prayers answered in ways that can't be coincidence: I prayed for a specific need and it was met the same day; I prayed for someone's healing and they recovered; I asked for a sign and received it. My experience of a God who answers prayer is real.`,
  short: `These experiences are real and meaningful, but they're what we'd expect from human psychology even if no one were answering. We remember hits and forget misses; we count many outcomes as "answers"; and with many prayers, striking coincidences are inevitable. Believers in every religion, and people who use horoscopes, report the same kind of experiences. When tested systematically, prayer has no measurable effect (see [[prayer-studies]]).`,

    { h: "Coincidences are expected", t: `Mathematician J. E. Littlewood's "law of miracles": if you count a one-in-a-million event as a miracle, and you experience events at about one per second, you'll experience about one "miracle" a month. With billions of people praying daily, extraordinary coincidences happen to someone every day.` },

    { h: "Transitional fossils, some predicted", t: `In 2004, Neil Shubin's team searched Devonian rocks of the right age (about 375 million years old) in the Canadian Arctic, specifically to find a fish-tetrapod intermediate, and found *Tiktaalik*, a fish with a neck, wrist bones, and lungs. The whale series (*Pakicetus*, *Ambulocetus*, *Rodhocetus*, *Basilosaurus*, which still had small hind legs) traces whales from land mammals. *Archaeopteryx* and the many feathered dinosaurs from China show the dinosaur-bird transition. The hominin record includes *Australopithecus*, *Homo habilis*, *H. erectus*, and others.` },

    { q: "Evolution is just a theory.", a: `In science, a theory is a well-substantiated explanation of a body of facts, like the germ theory of disease or the theory of gravity. Evolution is a theory in that sense. The fact that species share common ancestry is as well established as anything in biology.`, k: "evolution just a theory not proven only a theory" },

    { q: "If we evolved from monkeys, why are there still monkeys?", a: `We didn't evolve from modern monkeys. Humans and modern apes share common ancestors. Populations split, and branches evolve separately, just as Americans descended from European immigrants while Europeans still exist.`, k: "evolved from monkeys why still monkeys apes" }

  claim: `Adding up the genealogies in Genesis, creation was about 6,000 years ago. Radiometric dating relies on assumptions about initial conditions and constant decay rates. The flood explains the rock layers. Many natural indicators, such as the Earth's magnetic field decay and the amount of salt in the oceans, point to a young earth.`,
  short: `Many independent methods agree that the Earth is about 4.54 billion years old and the universe about 13.8 billion. These include several radiometric methods based on different physics, annual layers in ice and lake sediments, tree rings, coral growth, seafloor spreading, and the light from distant stars. Creationists' own research project, RATE, conceded that the evidence shows hundreds of millions of years' worth of radioactive decay. They could fit it into thousands of years only by proposing accelerated decay, which would have released enough heat to melt the Earth's crust, a problem they acknowledged they couldn't solve.`,

    { h: "Independent methods agree", t: `Uranium-lead dating of zircons gives ages back to 4.4 billion years (Jack Hills, Australia). Meteorites date to 4.567 billion years. Different isotope systems, based on different elements and decay modes, agree with each other when applied to the same rocks. Non-radiometric methods give independent results: Greenland and Antarctic ice cores with counted annual layers (over 100,000 years), lake varves (Lake Suigetsu, over 50,000 years), continuous tree-ring chronologies (over 12,000 years), and coral reefs too thick to have grown in 6,000 years.` },

  title: "Christianity Gave Birth to Modern Science",
  who: "Rodney Stark, For the Glory of God (2003); James Hannam, God's Philosophers (2009); Stanley Jaki; John Lennox",
  claim: `Modern science arose in Christian Europe, not elsewhere, because Christians believed in a rational Creator whose orderly creation could be understood. The founders of modern science (Copernicus, Kepler, Galileo, Newton, Boyle, Pascal) were Christians who saw science as "thinking God's thoughts after him." The idea of a conflict between science and religion is a 19th-century myth.`,
  short: `Historians have corrected some exaggerated claims of "warfare" between science and religion, and skeptics should acknowledge that. But the conclusion doesn't follow. Early modern scientists were Christians because almost everyone in Europe was. Science has deep roots in Greek, Islamic, Indian, and Chinese learning. Christian Europe had a thousand years of dominance before the Scientific Revolution, with limited scientific progress. And science advanced by explaining nature without supernatural causes, which is a method that has steadily removed God from explanations.`,
  points: [
    { h: "Everyone was Christian", t: `In 17th-century Europe, dissent from Christianity was dangerous and often illegal. That scientists were Christians tells us about their society, not about Christianity causing science. The same scientists also believed in alchemy (Newton), astrology (Kepler), and witchcraft. By the same reasoning, astrology "gave birth" to astronomy.` },
    { h: "Many roots", t: `Greek natural philosophy (Aristotle, Euclid, Archimedes, Ptolemy, Galen) provided the foundations. Scholars in the Islamic world developed algebra (al-Khwarizmi), optics and experimental method (Ibn al-Haytham), and medicine (Ibn Sina), and preserved Greek texts that later reached Europe. Indian mathematicians developed the decimal place-value system and zero. Chinese inventions (printing, the compass, gunpowder) were essential to European modernity.` },
    { h: "A mixed record", t: `Galileo was tried by the Inquisition in 1633 and spent the rest of his life under house arrest; the Church kept Copernicus's work on the Index from 1616 until 1835. Giordano Bruno was burned in 1600, mostly for theological heresies but including his views on the plurality of worlds. Michael Servetus, who described pulmonary circulation, was burned by Calvin's Geneva in 1553 for heresy. Ronald Numbers' *Galileo Goes to Jail* (2009) rightly corrects myths on both sides, but the record isn't one of harmonious support.` },
    { h: "Science works by leaving God out", t: `Newton believed God intervened to keep planetary orbits stable. Laplace later showed the stability followed from the laws themselves, and is said to have told Napoleon he "had no need of that hypothesis." The success of science comes from methodological naturalism: explaining phenomena through natural causes that can be tested. Supernatural explanations have never produced a successful scientific prediction.` },

{

  cat: "science",
  title: "Science Requires Faith Too",
  who: "Popular apologetics; John Lennox, God's Undertaker (2009); presuppositional apologists",
  claim: `Science rests on unprovable assumptions: that the universe is orderly, that our senses and reasoning are reliable, that the future will resemble the past. Scientists take these on faith. So atheists who trust science also live by faith. "Scientism," the view that only science gives knowledge, is self-refuting, since it can't be proven scientifically.`,

    { h: "Assumptions everyone shares", t: `Every person, including every believer, assumes that the sun will rise tomorrow, that their senses are generally reliable, and that logic holds. These assumptions don't distinguish science from religion. The question is what you add to them. Science adds claims tested against observation. Religious faith adds claims that aren't tested, or that persist despite failed tests.` },
    { h: "Calibrated trust versus faith", t: `Trust in science is based on a track record: predictions confirmed, technologies that work, errors corrected. It's proportional to evidence and can be withdrawn. When evidence showed that stomach ulcers were caused by bacteria (*H. pylori*), medicine changed its view. Hebrews 11:1 defines faith as "the assurance of things hoped for, the conviction of things not seen," and many believers treat holding firm against doubt as a virtue. See [[faith]].` },
    { h: "Scientism is a straw man", t: `The case against religion doesn't claim that only science produces knowledge. It uses historical method (on the Bible and the resurrection), philosophy (on the arguments for God and the problem of evil), logic (on the coherence of doctrines), and the evidence of science. The claim is that religious claims fail by the standards of reasoning that people use in every other area of life.` }
