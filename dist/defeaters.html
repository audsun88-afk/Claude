{
  id: "prophecy-odds",
  cat: "prophecy",
  title: "The Odds of Fulfilled Prophecy Are Astronomical",
  who: "Peter Stoner, Science Speaks (1958); Josh McDowell, Evidence That Demands a Verdict; Lee Strobel",
  claim: `Peter Stoner calculated that the probability of one man fulfilling just eight messianic prophecies by chance is 1 in 10^17, which is like covering Texas two feet deep in silver dollars and picking the marked one blindfolded on the first try. For 48 prophecies, the odds are 1 in 10^157. Jesus fulfilled far more.`,
  short: `The numbers are guesses dressed as calculations. They assume each "prophecy" was a genuine prediction, that each fulfillment is independently documented, and that the events are independent. None of these holds. The fulfillments are reported by the same believers who chose the texts and told the stories, often decades later. You can produce equally impressive odds for any well-known figure whose biography was written to match expectations.`,
  points: [
    { h: "The inputs are made up", t: `Stoner assigned a probability to each event (for example, 1 in 10^5 for being betrayed for 30 pieces of silver) with no data behind it. Multiplying unsupported guesses produces an unsupported product, however large.` },
    { h: "Reported fulfillment is not observed fulfillment", t: `The probability calculation should be: how likely is it that *texts written by believers* would *report* that Jesus fulfilled these prophecies? Very likely. The Gospel writers knew the scriptures and were explicitly writing to show fulfillment ("this took place to fulfill..."). Some events were simply narrated to match (see [[psalm-22]]).` },
    { h: "The prophecies aren't independent", t: `"Born in Bethlehem," "of David's line," and "a ruler from Judah" are linked: if you believe someone is the Davidic messiah, you'll expect all of them. The betrayal for silver and the purchase of the potter's field come from one passage. Multiplying the probabilities of linked events vastly overstates the improbability.` },
    { h: "Many aren't predictions at all", t: `Hosea 11:1, Jeremiah 31:15, and Psalm 22 are not predictions (see [[messianic-prophecy]]). Treating any verse that a Gospel writer connected to Jesus as a "prophecy" and then counting it as fulfilled is circular.` },
    { h: "Failures don't get counted", t: `The calculation ignores the prophecies that failed: the messianic kingdom, the rebuilt temple, world peace, the return within a generation (see [[failed-return]]), and Tyre (see [[tyre]]). Counting hits and ignoring misses is how fortune-tellers seem accurate.` }
  ],
  replies: [
    { q: "Even if you remove the weak ones, the remaining prophecies are still statistically impossible.", a: `The problem isn't only weak prophecies. Any event reported by biased sources who knew the prediction and wrote decades later can't be treated as a random draw. To get a meaningful probability, you need independent verification that the events happened *and* that the prophecies were predictions. We don't have that for any of them.`, k: "remove weak prophecies still statistically impossible remaining" }
  ],
  sources: [
    "Stoner, P. (1958). Science Speaks. Moody Press.",
    "McDowell, J. & McDowell, S. (2017). Evidence That Demands a Verdict, updated ed. Thomas Nelson.",
    "Carrier, R. (2012). Proving History: Bayes's Theorem and the Quest for the Historical Jesus. Prometheus, ch. on probabilistic reasoning.",
    "Hájek, A. 'Interpretations of Probability.' Stanford Encyclopedia of Philosophy."
  ],
  keys: "prophecy odds probability stoner science speaks 10^17 silver dollars texas statistically impossible chance fulfilled prophecy math",
  rel: ["messianic-prophecy", "failed-return", "tyre"]
},
{
  id: "tyre",
  cat: "prophecy",
  title: "The Prophecy Against Tyre Was Fulfilled",
  who: "Josh McDowell, Evidence That Demands a Verdict; Ezekiel 26",
  claim: `Ezekiel 26 predicted that many nations would come against Tyre, that its walls would be destroyed, that its rubble would be thrown into the sea, that it would become a bare rock for drying fishing nets, and that it would never be rebuilt. Nebuchadnezzar destroyed the mainland city, and Alexander the Great later used its rubble to build a causeway to the island city in 332 BCE, exactly as foretold.`,
  short: `Ezekiel specifically says *Nebuchadnezzar* will break down Tyre's walls, plunder it, and destroy it (26:7–12). Nebuchadnezzar besieged Tyre for 13 years and failed to take it. Ezekiel himself admits this later: Ezekiel 29:17–20 says Nebuchadnezzar and his army "got nothing" for their labor against Tyre, so God would give him Egypt instead. Tyre was rebuilt after Alexander and has been inhabited ever since. Paul visited it (Acts 21:3–7), and today it is a city of tens of thousands.`,
  points: [
    { h: "Ezekiel names Nebuchadnezzar", t: `"I will bring against Tyre from the north Nebuchadnezzar king of Babylon... He will kill your daughters on the mainland... He will set his battering rams against your walls... With the hoofs of his horses he will trample all your streets... *They* will plunder your riches" (26:7–12). The change from "he" to "they" in verse 12 doesn't change the subject of the oracle. Apologists who attribute the destruction to Alexander, 250 years later, have to separate verses the text keeps together.` },
    { h: "Ezekiel admits the failure", t: `In an oracle dated 571 BCE: "Nebuchadnezzar king of Babylon made his army labor hard against Tyre. Every head was made bald, and every shoulder was rubbed bare, yet neither he nor his army got anything from Tyre to pay for the labor... Therefore I will give the land of Egypt to Nebuchadnezzar" (29:18–19). The Bible itself records that the prophecy didn't come true as stated.` },
    { h: "'You shall never be rebuilt'", t: `"You shall never be rebuilt" (26:14); "you shall be no more; though you are sought for, you will never be found again" (26:21). Tyre recovered after Nebuchadnezzar, was rebuilt after Alexander, flourished under the Romans, appears in the New Testament (Mark 7:24; Acts 21:3–7), and is now a city in southern Lebanon.` },
    { h: "The Egypt prophecy failed too", t: `Ezekiel 29:9–12 says Egypt would be made desolate and uninhabited for 40 years, with Egyptians scattered among the nations. That never happened. Nebuchadnezzar campaigned against Egypt around 568 BCE but didn't conquer or depopulate it. A prophet whose detailed predictions fail is the case described in Deuteronomy 18:22.` }
  ],
  replies: [
    { q: "The prophecy said 'many nations' would come. Nebuchadnezzar began it and Alexander finished it.", a: `Ezekiel 26:3 says "many nations," but verses 7–11 attribute the specific destruction to Nebuchadnezzar. And even if Alexander fulfilled part of it, the city was rebuilt and still exists, contrary to 26:14 and 26:21. Ezekiel himself says Nebuchadnezzar got nothing from Tyre (29:18).`, k: "many nations alexander finished nebuchadnezzar began waves" },
    { q: "The ancient mainland city was never rebuilt. Modern Tyre is in a different spot.", a: `Tyre's main city was always the island, which is where the modern city's old quarter stands, now connected to land by the silted-up causeway. The city was rebuilt and inhabited after Alexander. Shifting the prophecy's target to "the mainland suburb" is redefinition after the fact.`, k: "mainland city never rebuilt modern tyre different spot fishing nets" }
  ],
  sources: [
    "Ezekiel 26:1–21; 29:17–20.",
    "Zimmerli, W. (1983). Ezekiel 2. Hermeneia. Fortress.",
    "Katzenstein, H. J. (1973). The History of Tyre. Schocken Institute.",
    "Arrian. Anabasis of Alexander 2.15–24.",
    "Josephus. Against Apion 1.156 (on the 13-year siege by Nebuchadnezzar)."
  ],
  keys: "tyre prophecy ezekiel 26 nebuchadnezzar alexander the great fishing nets never rebuilt bare rock fulfilled prophecy",
  rel: ["prophecy-odds", "messianic-prophecy"]
},
{
  id: "israel-1948",
  cat: "prophecy",
  title: "Israel's Rebirth in 1948 Fulfilled Prophecy",
  who: "Dispensationalist apologetics; Hal Lindsey, The Late Great Planet Earth (1970); John Hagee",
  claim: `The Bible predicted that the scattered Jewish people would return to their land and Israel would be reborn as a nation: "Shall a land be born in one day? Shall a nation be brought forth in one moment?" (Isaiah 66:8; see also Ezekiel 37, the valley of dry bones). On May 14, 1948, it happened in a single day. No other ancient people has returned to its homeland after nearly 2,000 years.`,
  short: `The restoration prophecies in Isaiah, Jeremiah, and Ezekiel were about the return from the Babylonian exile, which happened in the 6th century BCE. They come packaged with a Davidic king, a rebuilt Temple, and universal peace, which didn't happen in 1948. Zionists who knew the Bible worked for decades to establish the state, so this "fulfillment" was partly self-fulfilling. And the prophecy industry around 1948 has a record of failed predictions, such as the end of the world by 1988.`,
  points: [
    { h: "Return from Babylon", t: `Ezekiel prophesied during the Babylonian exile (6th century BCE). His valley of dry bones (Ezekiel 37) is explained in the text itself: "these bones are the whole house of Israel... I will bring you home into the land of Israel" (37:11–12), followed by a reunited kingdom under "my servant David" (37:24) and a sanctuary in their midst forever (37:26–28). The exiles began returning under Cyrus in 538 BCE. Isaiah 66 concerns the same post-exilic hope.` },
    { h: "The package didn't arrive", t: `The restoration prophecies include a Davidic king ruling (Ezekiel 37:24), the Temple rebuilt with God present forever (37:26–28), the nations streaming to Jerusalem in peace (Isaiah 2:2–4), and the end of war. In 1948 there was a secular state, born in war, with no king and no temple. Claiming the part that happened and deferring the rest is selective.` },
    { h: "Self-fulfilling", t: `Zionism drew on biblical attachment to the land. Christian restorationists in Britain and America supported the return partly *because* they believed it was prophesied. The Balfour Declaration (1917) was influenced by such beliefs. When people who know a prophecy act to bring it about, its fulfillment isn't evidence of supernatural foresight.` },
    { h: "The prediction record", t: `Hal Lindsey's best-selling *The Late Great Planet Earth* (1970) suggested that the generation that saw Israel's rebirth would see the end, around 1988, since a biblical generation is about 40 years. Edgar Whisenant's *88 Reasons Why the Rapture Will Be in 1988* sold millions of copies. Similar predictions have been made and failed since the Millerites (1844). A method of interpretation that keeps making false predictions isn't reliable when it claims a hit.` }
  ],
  replies: [
    { q: "No other nation has been restored after 2,000 years of exile. It's unique.", a: `It's historically remarkable, but explicable: the Jewish community maintained a strong religious and cultural identity centered on the land, and a political movement deliberately worked toward a return. Jews also lived continuously in the land in smaller numbers throughout. Other peoples have revived languages and states (the revival of Hebrew has parallels in Irish and Estonian national revivals). A remarkable human achievement driven by a religious hope isn't evidence that the hope was divinely predicted.`, k: "no other nation restored 2000 years unique jews survived" }
  ],
  sources: [
    "Zimmerli, W. (1983). Ezekiel 2. Hermeneia. Fortress.",
    "Lindsey, H. (1970). The Late Great Planet Earth. Zondervan.",
    "Weber, T. (2004). On the Road to Armageddon: How Evangelicals Became Israel's Best Friend. Baker Academic.",
    "Lewis, D. (2010). The Origins of Christian Zionism. Cambridge University Press."
  ],
  keys: "israel 1948 rebirth nation born in a day isaiah 66:8 ezekiel 37 dry bones jews returned prophecy fulfilled end times",
  rel: ["failed-return", "prophecy-odds", "messianic-prophecy"]
},
{
  id: "failed-return",
  cat: "prophecy",
  title: "Jesus Will Return (and Never Promised a Date)",
  who: "Mainstream Christianity; preterists (N. T. Wright on the 'coming of the Son of Man'); 2 Peter 3:8–9",
  claim: `Jesus said no one knows the day or hour of his return (Mark 13:32). The early Christians lived in expectation but didn't set dates. Passages like "this generation will not pass away" refer to the destruction of Jerusalem in 70 CE (preterism) or to the "generation" that sees the final signs. "With the Lord one day is as a thousand years" (2 Peter 3:8). The delay shows God's patience.`,
  short: `The earliest Christian texts expect the end within their own lifetimes, and attribute that expectation to Jesus himself: "this generation will not pass away until all these things take place" (Mark 13:30), and "some standing here will not taste death until they see the kingdom of God come with power" (Mark 9:1). Paul expected to be alive at Jesus' return (1 Thessalonians 4:15–17). Most critical scholars, from Albert Schweitzer to Dale Allison (a Christian), conclude that Jesus was an apocalyptic prophet who expected the end imminently, and was wrong. C. S. Lewis called Mark 13:30 "the most embarrassing verse in the Bible."`,
  points: [
    { h: "Jesus' own words", t: `"Truly I tell you, there are some standing here who will not taste death until they see that the kingdom of God has come with power" (Mark 9:1). "Truly I tell you, this generation will not pass away until all these things have taken place" (Mark 13:30), right after describing the sun darkening, stars falling, and the Son of Man coming in clouds to gather the elect (13:24–27). "You will not have gone through all the towns of Israel before the Son of Man comes" (Matthew 10:23). To the high priest: "you will see the Son of Man seated at the right hand of the Power and coming with the clouds of heaven" (Mark 14:62).` },
    { h: "Paul expected to be alive", t: `"We who are alive, who are left until the coming of the Lord..." (1 Thessalonians 4:15, 17). "The appointed time has grown short; from now on, let even those who have wives be as though they had none... for the present form of this world is passing away" (1 Corinthians 7:29–31). Paul advised against marriage partly because the end was near. "We will not all die" (1 Corinthians 15:51). "Salvation is nearer to us now than when we became believers; the night is far gone, the day is near" (Romans 13:11–12).` },
    { h: "Every layer of the New Testament repeats it", t: `"The coming of the Lord is near" (James 5:8). "The end of all things is near" (1 Peter 4:7). "Children, it is the last hour" (1 John 2:18). "The time is near... Surely I am coming soon" (Revelation 1:3; 22:20). Then, in the latest NT book: "Where is the promise of his coming? For ever since our ancestors died, all things continue as they were" (2 Peter 3:4), answered with "with the Lord one day is like a thousand years" (3:8). That's a later author managing disappointment.` },
    { h: "The scholarly consensus", t: `Albert Schweitzer's *The Quest of the Historical Jesus* (1906) established the view of Jesus as an apocalyptic prophet expecting the imminent end. It remains the majority position (E. P. Sanders, 1985; Bart Ehrman, 1999; Paula Fredriksen, 1999; Dale Allison, 1998, 2010). Allison, a committed Christian, accepts that Jesus expected the end within his own generation and that the expectation was not fulfilled. C. S. Lewis wrote in "The World's Last Night" (1960) that Mark 13:30 "is certainly the most embarrassing verse in the Bible."` },
    { h: "Preterism doesn't work", t: `Preterists say Jesus' "coming" was fulfilled in the destruction of Jerusalem in 70 CE. But Mark 13:24–27 describes cosmic signs and the gathering of the elect from the ends of the earth, which didn't happen in 70 CE. Paul's expectation in 1 Thessalonians 4 is a bodily descent from heaven with the resurrection of the dead. Full preterism, which holds that the second coming has already happened, contradicts the creeds ("he will come again to judge the living and the dead"). Partial preterism keeps the creed but splits the same discourse into two events separated by millennia.` }
  ],
  replies: [
    { q: "'This generation' means the generation that sees the signs, or the Jewish race.", a: `In Mark, "this generation" (*he genea haute*) always means Jesus' contemporaries (8:12, 38; 9:19). And Mark 9:1 removes all ambiguity: "some standing *here* will not taste death." The redefinitions were invented because the plain reading failed.`, k: "this generation means race generation that sees signs genea" },
    { q: "A day is like a thousand years to the Lord (2 Peter 3:8).", a: `That's the excuse of a later author whose community was asking why Jesus hadn't returned (3:4). It shows the expectation was real and had failed. If "soon" can mean thousands of years, the word means nothing, and the early Christians, including Paul, who reorganized their lives around it, were misled.`, k: "day like thousand years 2 peter 3:8 god's time patience delay" },
    { q: "He meant the Transfiguration, which happened six days later.", a: `It would be odd to say "*some* of you will not die before" an event six days away. Mark 8:38–9:1 links the kingdom's coming with power to the Son of Man coming "in the glory of his Father with the holy angels," and Paul and the rest of the New Testament show the early church understood the promise as the return and the end.`, k: "transfiguration six days later some standing here" }
  ],
  sources: [
    "Schweitzer, A. (1906/2001). The Quest of the Historical Jesus. Fortress (first complete ed.).",
    "Allison, D. C. (1998). Jesus of Nazareth: Millenarian Prophet. Fortress.",
    "Allison, D. C. (2010). Constructing Jesus: Memory, Imagination, and History. Baker Academic.",
    "Ehrman, B. (1999). Jesus: Apocalyptic Prophet of the New Millennium. Oxford University Press.",
    "Sanders, E. P. (1985). Jesus and Judaism. Fortress.",
    "Lewis, C. S. (1960). 'The World's Last Night.' In The World's Last Night and Other Essays. Harcourt.",
    "Wright, N. T. (1996). Jesus and the Victory of God. Fortress (preterist-leaning reading)."
  ],
  keys: "second coming return of jesus this generation will not pass away some standing here will not taste death soon imminent end times apocalyptic prophet failed prophecy delay rapture",
  rel: ["historical-jesus", "daniel", "israel-1948", "prophecy-odds"]
}

<script>
DEF_ADD([
{
  id: "historical-jesus",
  cat: "jesus",
  title: "The Historical Jesus Supports Christianity",
  who: "N. T. Wright, Jesus and the Victory of God (1996); Craig Keener, The Historical Jesus of the Gospels (2009); Craig Evans",
  claim: `Virtually all historians agree that Jesus existed, was baptized by John, gathered disciples, claimed unique authority, and was crucified under Pontius Pilate. The historical evidence for Jesus is as good as for any figure of antiquity. Once you take the historical Jesus seriously, his radical claims and the events after his death point to the truth of Christianity.`,
  short: `The first part is right, and skeptics shouldn't deny it: Jesus almost certainly existed and was crucified. But the Jesus that historians can reconstruct with confidence is a 1st-century Jewish apocalyptic prophet who expected God to bring his kingdom soon, within his generation, and was executed by the Romans as a would-be "king of the Jews." That figure is very different from the pre-existent divine Son of the creeds, and his central prediction failed. The historical Jesus is evidence *against* Christianity's supernatural claims, not for them.`,
  points: [
    { h: "What historians can affirm", t: `Most critical scholars (Sanders, Fredriksen, Ehrman, Allison, Meier, Vermes) agree on a core: Jesus of Nazareth was a Galilean Jew, baptized by John the Baptist, who preached the coming kingdom of God, gathered followers including an inner group of twelve, was known as a healer and exorcist, came into conflict with authorities over the Temple around Passover, and was crucified by order of Pontius Pilate, probably around 30 CE. See Sanders, *The Historical Figure of Jesus* (1993).` },
    { h: "An apocalyptic prophet", t: `The earliest sources present Jesus proclaiming that the kingdom of God was about to arrive in power, with a judgment and a reversal of fortunes, within his hearers' lifetimes (see [[failed-return]]). His baptism by John (an apocalyptic preacher), the choice of twelve disciples (to rule the twelve tribes, Matthew 19:28), and the apocalyptic movement that followed him all fit this picture. The end didn't come.` },
    { h: "Divinity is a later development", t: `Jesus' explicit claims to divinity appear almost entirely in John, the latest Gospel. In Mark, the earliest, Jesus rebukes a man for calling him good ("No one is good but God alone," 10:18) and doesn't know the time of the end (13:32). The doctrines of the Incarnation and the Trinity developed over the following three centuries (see [[jesus-claimed-god]], [[trinity]]). Historians can't affirm the supernatural parts of the story using historical method, because that method works with probabilities, and miracles are by definition the least probable explanation (see [[miracles-hume]]).` },
    { h: "Existing is not the same as being divine", t: `Many founders of religions existed: Muhammad, Joseph Smith, Guru Nanak, the Buddha (probably), Baháʼu'lláh. Their existence doesn't make their followers' theological claims true. The real question is not whether Jesus lived but whether he rose from the dead and was God incarnate, and on those questions the historical evidence is weak (see [[minimal-facts]]).` }
  ],
  replies: [
    { q: "Even Bart Ehrman admits Jesus existed and was crucified.", a: `Yes, and I agree with Ehrman. He also argues, in the same body of work, that Jesus was an apocalyptic prophet who was wrong about the end, never claimed to be God in the earliest sources, and that the resurrection can't be established historically. Citing Ehrman for the first part and ignoring the rest is selective.`, k: "ehrman admits jesus existed crucified historians agree consensus" }
  ],
  sources: [
    "Sanders, E. P. (1993). The Historical Figure of Jesus. Penguin.",
    "Fredriksen, P. (1999). Jesus of Nazareth, King of the Jews. Knopf.",
    "Ehrman, B. (2012). Did Jesus Exist? HarperOne.",
    "Meier, J. P. (1991–2016). A Marginal Jew: Rethinking the Historical Jesus, 5 vols. Doubleday/Yale.",
    "Vermes, G. (1973). Jesus the Jew. Collins.",
    "Allison, D. C. (2010). Constructing Jesus. Baker Academic."
  ],
  keys: "historical jesus did jesus exist real person historians agree crucified pilate existed evidence for jesus apocalyptic prophet",
  rel: ["myth-jesus", "extrabiblical", "failed-return", "jesus-claimed-god"]
},
{
  id: "trilemma",
  cat: "jesus",
  title: "Liar, Lunatic, or Lord",
  who: "C. S. Lewis, Mere Christianity, Book II, ch. 3 (1952); Josh McDowell, More Than a Carpenter (1977)",
  claim: `Jesus claimed to be God. A man who said what Jesus said would be either a liar (knowingly deceiving people about the most important matter), a lunatic ("on the level with the man who says he is a poached egg"), or what he claimed: Lord. His moral teaching and character rule out liar and lunatic. "You must make your choice... but let us not come with any patronising nonsense about his being a great human teacher."`,
  short: `The trilemma is a false trichotomy. It leaves out the most likely options: that Jesus' claims were developed by his followers over decades (legend), and that he sincerely believed something mistaken about himself without being clinically insane. The premise that the historical Jesus claimed to be God is also contested, since those claims appear mainly in John, the latest Gospel. Lewis's argument is widely regarded by philosophers, including Christian ones, as one of his weakest.`,
  points: [
    { h: "The missing option: legend", t: `We don't have Jesus' own words. We have texts written 40 to 70 years later, in Greek, by anonymous authors who believed in him and whose accounts grew more exalted over time. In Mark, Jesus is reticent about his identity. In John, written latest, he says "before Abraham was, I am" (8:58) and "I and the Father are one" (10:30). The simplest explanation is that the high claims belong to John's community's theology, put on Jesus' lips. That's neither lying nor lunacy.` },
    { h: "Sincerely mistaken isn't insane", t: `People have sincerely believed themselves to be divinely chosen, messiahs, or prophets without being "poached egg" lunatics: Sabbatai Zevi (17th century), whom thousands followed as messiah; Baháʼu'lláh; Sun Myung Moon; and many others. An apocalyptic Jewish prophet who believed he would be enthroned as God's agent in the coming kingdom (Matthew 19:28) could be mistaken in a way consistent with his culture and with ethical wisdom.` },
    { h: "Did the historical Jesus claim to be God?", t: `In the Synoptic Gospels, Jesus preaches the kingdom of God, not himself as God. "Son of God" was a title for Israel's king (Psalm 2:7) and for righteous people. "Son of Man" draws on Daniel 7, where the figure represents the people of God. Many scholars think the earliest Christians understood Jesus as a human being exalted by God at his resurrection (Romans 1:4; Acts 2:36), and that incarnational Christology developed later (Dunn, 1989; Ehrman, 2014). See [[jesus-claimed-god]].` },
    { h: "Good moral teaching doesn't certify metaphysical claims", t: `Lewis assumes a great moral teacher couldn't be wrong about his own nature. But moral insight and factual accuracy are separate. Socrates thought he had a daimon guiding him; Newton spent years on biblical prophecy and alchemy. People can be ethically admirable and wrong about the supernatural.` }
  ],
  replies: [
    { q: "The legend theory doesn't work. There wasn't enough time for legends to develop.", a: `Legends can develop in years, not centuries. The Lubavitcher Rebbe's followers reported sightings and messianic claims within weeks of his death in 1994. Miracle stories about Sabbatai Zevi spread across Europe within months. Forty years and a change of language and culture is plenty of time. See [[legendary-growth]].`, k: "legend not enough time legends develop decades too short" },
    { q: "Jesus' character and teaching are too sane and too good to be a lunatic or liar.", a: `Agreed, he probably wasn't either. That's why the trilemma fails: there are other options, chiefly that his followers developed claims about him after his death, or that he sincerely believed he had a special role in God's coming kingdom and was mistaken about its timing.`, k: "too good too sane character teaching not liar not lunatic" }
  ],

{
  id: "jesus-claimed-god",
  cat: "jesus",
  title: "Jesus Claimed to Be God",
  who: "John 8:58; 10:30; 20:28; Richard Bauckham, Jesus and the God of Israel (2008); Larry Hurtado, Lord Jesus Christ (2003); Michael Bird et al., How God Became Jesus (2014)",
  claim: `Jesus claimed divine prerogatives: he forgave sins (Mark 2:5–7), called himself the Son of Man who would come on the clouds (Mark 14:62, from Daniel 7), said "before Abraham was, I am" (John 8:58), and accepted worship. The earliest Christians worshipped Jesus as God within a few years of his death (Philippians 2:6–11), which shows a "high Christology" from the beginning (Hurtado, Bauckham).`,
  short: `The clearest claims come from John, written 60 or more years later, and are absent from the earlier Gospels, which would hardly have omitted them if Jesus had said them. In Mark, Jesus distinguishes himself from God ("No one is good but God alone") and is ignorant of the end. The titles "Son of God" and "Son of Man" didn't mean "God" in Jesus' world. Early Christians did venerate Jesus very early, but as an exalted agent whom God raised and gave a name above every name. That fits known patterns of exalted mediator figures in Second Temple Judaism, and the full divinity of the creeds took centuries to work out.`,
  points: [
    { h: "John is the outlier", t: `"I and the Father are one" (10:30), "Before Abraham was, I am" (8:58), "Whoever has seen me has seen the Father" (14:9). None of these appears in Matthew, Mark, or Luke. If Jesus had said them, the earlier authors would have had every reason to include them. John's Jesus speaks in long theological discourses in John's own style, which most scholars regard as the evangelist's composition.` },
    { h: "Mark's Jesus", t: `"Why do you call me good? No one is good but God alone" (Mark 10:18). Matthew found this awkward and changed it (19:17). "About that day or hour no one knows, neither the angels in heaven, nor the Son, but only the Father" (Mark 13:32). Jesus prays to God and cries out "My God, my God, why have you forsaken me?" (15:34). Mark's Jesus is God's chosen agent, not God himself.` },
    { h: "The titles didn't mean divinity", t: `"Son of God" in Jewish scripture referred to angels (Job 1:6), Israel (Exodus 4:22), the king (Psalm 2:7; 2 Samuel 7:14), and the righteous (Wisdom 2:18). The Roman emperor was *divi filius*, "son of a god." "Son of Man" in Daniel 7:13 is a figure who represents "the holy ones of the Most High" (7:18, 27). Forgiving sins: the Gospels don't say priests couldn't pronounce forgiveness on God's behalf, and Jesus gives the same authority to his disciples (Matthew 16:19; 18:18; John 20:23).` },
    { h: "Exaltation Christology", t: `Several early texts describe Jesus' status as given by God at his resurrection: "declared to be Son of God with power... by resurrection from the dead" (Romans 1:4); "God has made him both Lord and Messiah, this Jesus whom you crucified" (Acts 2:36); Psalm 2:7, "today I have begotten you," applied to the resurrection (Acts 13:33). Even the Philippians hymn (2:6–11), the strongest early text, says "*therefore* God highly exalted him and gave him the name above every name," exaltation as a reward.` },
    { h: "Exalted mediators were already a pattern", t: `Second Temple Jewish texts describe exalted figures who share God's throne or name: the Son of Man in the Similitudes of Enoch (1 Enoch 37–71) is pre-existent and enthroned to judge; Melchizedek in a Qumran text (11Q13) is called *elohim*; Moses is enthroned in Ezekiel the Tragedian; Philo calls the Logos a "second god." Daniel Boyarin (*The Jewish Gospels*, 2012) argues that these show the Jesus movement drew on existing Jewish ideas. Either way, early veneration of Jesus fits a known religious pattern.` },
    { h: "Centuries of dispute", t: `If Jesus had clearly taught that he was God, it would be strange that his followers needed 300 years of controversy to work out what they believed: adoptionists, Arians, modalists, and others each claimed scripture. Arius had wide support; the Council of Nicaea (325) didn't settle the matter, and Arian Christianity remained powerful for decades. See [[trinity]].` }
  ],
  replies: [
    { q: "Jesus applied 'I AM' to himself, the divine name from Exodus 3:14.", a: `Only in John (8:58). In the Synoptics, Jesus' "I am" (*ego eimi*) is ordinary speech (Mark 6:50, "It is I"; Mark 14:62 in answer to the high priest). The man born blind in John 9:9 also says *ego eimi*. John's theological use reflects his community's Christology near the end of the 1st century, not something the earlier Gospels record.`, k: "i am ego eimi exodus 3:14 divine name before abraham" },
    { q: "Thomas called Jesus 'my Lord and my God' (John 20:28), and Jesus accepted it.", a: `This is in John, the latest Gospel, in a scene composed as its theological climax. It tells us what John's community believed around 90–110 CE. It isn't evidence for what the historical Jesus said or accepted.`, k: "thomas my lord and my god john 20:28 accepted worship" },
    { q: "Early Christians worshipped Jesus within years of his death. That's an early high Christology.", a: `They venerated him very early, which Hurtado shows well. But veneration of an exalted agent of God, who God raised and seated at his right hand, isn't the Nicene doctrine that Jesus is co-eternal and of the same substance as the Father. Paul still distinguishes "one God, the Father" from "one Lord, Jesus Christ" (1 Corinthians 8:6) and has the Son subjected to the Father at the end (15:28).`, k: "early worship high christology hurtado bauckham years after death divine identity" }
  ],

{
  id: "virgin-birth",
  cat: "jesus",
  title: "The Virgin Birth",
  who: "Matthew 1:18–25; Luke 1:26–38; the Apostles' Creed; J. Gresham Machen, The Virgin Birth of Christ (1930)",
  claim: `Jesus was conceived by the Holy Spirit and born of the Virgin Mary, as Matthew and Luke independently report, fulfilling Isaiah 7:14. The virgin birth shows that Jesus was uniquely the Son of God and sinless, free from the inherited corruption of Adam's line.`,
  short: `Only two of the 27 New Testament books mention it, in birth stories that contradict each other on almost every other detail. Mark, John, and Paul show no knowledge of it, and Paul's language assumes an ordinary birth "of the seed of David according to the flesh." The story fits a well-known Greco-Roman pattern of great men born of gods. Its proof-text is a mistranslation (see [[isaiah-7-14]]). Biologically, a human conceived without a father would lack a Y chromosome and would therefore be female.`,
  points: [
    { h: "Silence in the earliest sources", t: `Paul, writing the earliest Christian texts, says Jesus was "born of a woman, born under the law" (Galatians 4:4), which is the ordinary way of saying "human," and "descended from David according to the flesh" (Romans 1:3). Mark, the earliest Gospel, begins with the adult Jesus, and in Mark 3:21, 31 his family thinks he's "out of his mind," which is odd if his mother had been told by an angel who he was. John calls Jesus "son of Joseph" without correction (1:45; 6:42).` },
    { h: "Davidic descent through Joseph", t: `Both Matthew's and Luke's genealogies trace Jesus' descent from David through *Joseph* (Matthew 1:16; Luke 3:23). If Joseph weren't Jesus' father, the genealogies wouldn't establish Davidic descent. This suggests the genealogies come from an earlier tradition in which Joseph was the father, and the virgin birth was added later.` },
    { h: "A familiar type of story", t: `Greek and Roman biographies often attributed divine paternity to great men. Plato was said to be the son of Apollo (Diogenes Laertius 3.2). Alexander's mother Olympias was said to have conceived by Zeus (Plutarch, *Alexander* 2–3). Augustus's mother Atia was said to have conceived him by Apollo in the form of a serpent (Suetonius, *Augustus* 94.4). Romulus and Remus were born to a Vestal virgin by Mars. Justin Martyr (*First Apology* 21–22) argued that Christians claimed "nothing new" compared with the sons of Zeus. The details differ (no sexual union in the Gospels), but the type of claim was common.` },
    { h: "The biology", t: `Mammals can't reproduce by parthenogenesis because of genomic imprinting: some genes are expressed only from the father's copy, and embryos with only maternal genomes fail to develop (Surani, Barton & Norris, *Nature*, 1984; McGrath & Solter, *Cell*, 1984). Researchers produced viable bimaternal mice only by engineering imprinting regions (Kono et al., *Nature*, 2004). A child produced from Mary's genome alone would have two X chromosomes and no Y. For Jesus to be male, God would have to create a Y chromosome from nothing, which is a new miracle, not a virgin birth.` },
    { h: "The theological motivation", t: `The idea that sinlessness requires avoiding a human father reflects Augustine's later theory that original sin is transmitted through sexual reproduction. That theory isn't in Matthew or Luke. Catholic theology later needed the Immaculate Conception (Mary herself conceived without original sin, defined 1854) to keep the logic consistent, which illustrates how doctrines get added to resolve problems created by earlier ones.` }
  ],
  replies: [
    { q: "Matthew and Luke are two independent witnesses to the virgin birth.", a: `They agree on very little apart from the names, Bethlehem, and the virgin conception. On the census, the flight to Egypt, the home town, the visitors, and the genealogy, they conflict (see [[nativity]]). Two incompatible stories agreeing on one theological point is better explained by a shared belief circulating in the late 1st century than by two accurate reports.`, k: "matthew luke two independent witnesses virgin birth" },
    { q: "God can do anything, including creating a Y chromosome.", a: `Sure, if he exists and does miracles. But then the virgin birth isn't evidence for anything. It's an extra miracle assumed on the authority of two late, conflicting texts. The biology shows that the story requires more miracles than its tellers realized, not that it couldn't happen given an omnipotent God.`, k: "god can do anything y chromosome miracle create" }
  ],
  sources: [
    "Brown, R. E. (1993). The Birth of the Messiah, rev. ed. Doubleday.",
    "Lincoln, A. (2013). Born of a Virgin? Reconceiving Jesus in the Bible, Tradition, and Theology. Eerdmans.",
    "Surani, M., Barton, S. & Norris, M. (1984). 'Development of reconstituted mouse eggs suggests imprinting of the genome during gametogenesis.' Nature 308: 548–550.",
    "McGrath, J. & Solter, D. (1984). 'Completion of mouse embryogenesis requires both the maternal and paternal genomes.' Cell 37(1): 179–183.",

{
  id: "nativity",
  cat: "jesus",
  title: "The Christmas Story Is Historical",
  who: "Traditional reading; Ben Witherington; apologetic harmonizations of the census",
  claim: `Jesus was born in Bethlehem during the reign of Herod the Great, when Augustus ordered a census that required Joseph to travel to his ancestral town. Wise men followed a star, shepherds heard angels, Herod massacred the infants, and the family fled to Egypt. Matthew and Luke give complementary accounts of the same events.`,
  short: `Matthew's and Luke's birth stories can't both be true. Luke dates the birth to the census of Quirinius (6 CE); Matthew dates it to before Herod's death (4 BCE), a gap of about ten years. No empire-wide census required people to travel to ancestral towns. Luke's family returns to Nazareth after 40 days, leaving no time for Matthew's flight to Egypt. No other source records Herod's massacre of infants. Even conservative scholars like Raymond Brown (a Catholic priest) concluded that the infancy narratives are largely theological compositions.`,
  points: [
    { h: "The census and the date", t: `Luke 2:1–2: "a decree went out from Caesar Augustus that all the world should be registered. This was the first registration, when Quirinius was governor of Syria." Josephus (*Antiquities* 17.355; 18.1–2) dates Quirinius's census to 6 CE, when Judea came under direct Roman rule after Archelaus was deposed. Matthew 2:1 and Luke 1:5 place Jesus' birth "in the days of Herod," who died in 4 BCE. Apologists propose an earlier term for Quirinius as governor or translate *protē* as "before," but there's no evidence of the first and the second is strained.` },
    { h: "No such census practice", t: `There's no record of an empire-wide census under Augustus. Roman provincial censuses registered people and property where they lived, for tax purposes, not in the towns of ancestors from a thousand years earlier. Joseph's ancestor David lived about a millennium earlier. A census of Judea in 6 CE wouldn't have applied to Galilee, which was ruled by Herod Antipas.` },
    { h: "Two incompatible itineraries", t: `In Matthew, Joseph and Mary live in Bethlehem (the magi visit them in a "house," 2:11). After returning from Egypt, Joseph is afraid to go back to Judea and settles in Nazareth "so that what had been spoken through the prophets might be fulfilled" (2:22–23), as if moving there for the first time. In Luke, they live in Nazareth, travel to Bethlehem for the census, present the baby at the Temple in Jerusalem after 40 days of purification (2:22), and then "returned to Galilee, to their own town of Nazareth" (2:39). There's no room for the flight to Egypt.` },
    { h: "The massacre and the star", t: `Josephus records Herod's many atrocities in detail, including the murder of his own sons, but says nothing about a massacre of infants in Bethlehem. Matthew's story parallels Pharaoh's killing of Hebrew boys and the later Jewish legend, recorded by Josephus (*Antiquities* 2.205–209), in which a sacred scribe predicts Moses' birth and Pharaoh orders the killing. Matthew presents Jesus as a new Moses. A star that moves ahead of travelers and stops over a specific house (2:9) isn't an astronomical object.` },
    { h: "What scholars conclude", t: `Raymond Brown's *The Birth of the Messiah* (1977; 1993), the standard study, concludes that the two narratives are largely independent theological compositions that agree on very little historical detail. They aim to show Jesus' identity (Davidic, born in Bethlehem, new Moses, Son of God) rather than to record events. Most scholars think Jesus was born in Nazareth.` }
  ],
  replies: [
    { q: "Quirinius may have been governor twice, or the census was 'before' Quirinius's.", a: `There's no evidence for an earlier governorship of Syria by Quirinius in 6–4 BCE. The known governors of Syria in that period were Sentius Saturninus and Quinctilius Varus. Reading *protē* as "before" is grammatically possible but unnatural, and it would make Luke date the census by reference to a different one, which is odd. These solutions exist because the plain reading conflicts with Matthew.`, k: "quirinius governor twice census before protē" }

{
  id: "jesus-miracles",
  cat: "jesus",
  title: "Jesus' Miracles Prove He Was Divine",
  who: "John 20:30–31; Craig Keener, Miracles (2011); Graham Twelftree, Jesus the Miracle Worker (1999)",
  claim: `Jesus healed the blind, the lame, and lepers, cast out demons, calmed storms, walked on water, fed thousands, and raised the dead. Even his enemies didn't deny his miracles; they attributed them to Beelzebul (Mark 3:22). The Talmud says he practiced "sorcery." These works prove his divine authority.`,
  short: `The historical Jesus was probably regarded as a healer and exorcist, as were others of his time. That doesn't distinguish him from contemporaries such as Honi the Circle-Drawer, Hanina ben Dosa, or Apollonius of Tyana, or from Vespasian, credited with healing a blind man with spittle. The healings and exorcisms are explicable as psychosomatic cures and culturally shaped possession states. The nature miracles closely mirror Old Testament stories of Elijah, Elisha, and Moses, and look like literary constructions. Enemies attributing miracles to sorcery shows only that they shared a worldview in which such claims were normal.`,
  points: [
    { h: "Other wonder-workers", t: `Honi the Circle-Drawer (1st century BCE) was famous for making rain (Josephus, *Antiquities* 14.22; Mishnah Ta'anit 3:8). Hanina ben Dosa reportedly healed at a distance, as Jesus heals the centurion's servant (Babylonian Talmud, Berakhot 34b). Apollonius of Tyana, according to Philostratus, raised a dead girl in Rome, cast out demons, and appeared to a skeptic after his death. Tacitus (*Histories* 4.81) and Suetonius (*Vespasian* 7) say the emperor Vespasian healed a blind man with his spittle in Alexandria (compare Mark 8:23). Jesus himself acknowledges other exorcists: "by whom do your own exorcists cast them out?" (Matthew 12:27).` },
    { h: "Healings and exorcisms", t: `Many conditions in the Gospels have psychosomatic components or fluctuate naturally. Conversion disorders (functional neurological disorder) can produce blindness, paralysis, and loss of speech that resolve with suggestion. Possession states are culturally shaped dissociative experiences found across many societies. Mark notes that Jesus "could do no deed of power" in Nazareth, where people lacked faith (6:5), which fits healing that depends on expectation. The boy in Mark 9:17–27 shows classic signs of epilepsy (Matthew 17:15 calls him "moonstruck," *selēniazetai*).` },
    { h: "Nature miracles are modeled on scripture", t: `Elisha feeds 100 men with 20 loaves, with some left over (2 Kings 4:42–44); Jesus feeds 5,000 with five loaves, with twelve baskets left over. Elijah raises a widow's son (1 Kings 17:17–24); Jesus raises a widow's son at Nain (Luke 7:11–17), near Shunem, where Elisha raised a boy (2 Kings 4). God "trampled the waves of the sea" (Job 9:8) and stilled storms (Psalm 107:28–29); Jesus walks on water and stills a storm, as Jonah slept through one. The pattern is literary: Jesus is presented as greater than Elijah, Elisha, and Moses.` },
    { h: "Lazarus: the miracle only John knows", t: `The raising of Lazarus, dead four days, in front of a crowd near Jerusalem, is the most spectacular miracle in the Gospels and, according to John, the direct cause of the plot to kill Jesus (11:45–53). Matthew, Mark, and Luke never mention it. That's hard to explain if it happened, and easy to explain if it's a Johannine composition.` },
    { h: "Miracle claims are cheap in any era", t: `Modern figures like Sathya Sai Baba were credited by millions, including educated eyewitnesses, with materializations and healings, many of which video evidence shows to be sleight of hand. Faith healers today report thousands of cures that don't survive medical follow-up (see [[modern-miracles]]). The existence of miracle reports, even early ones, is weak evidence for miracles.` }
  ],
  replies: [
    { q: "Even his enemies admitted he did miracles. They said he did them by Beelzebul or sorcery.", a: `In a world where everyone believed in spirits and wonder-working, opponents argued about the *source* of reported wonders, not their existence. Christians similarly accepted pagan miracles but attributed them to demons. The Talmud's references to Jesus' sorcery are late (3rd–6th century), confused, and responding to Christian claims. They show what people believed, not what happened.`, k: "enemies admitted miracles beelzebul sorcery talmud didn't deny" }

{
  id: "extrabiblical",
  cat: "jesus",
  title: "Non-Christian Sources Confirm the Gospels",
  who: "Gary Habermas, The Historical Jesus (1996); Josh McDowell; Lee Strobel, The Case for Christ (1998)",
  claim: `Josephus, Tacitus, Pliny the Younger, Suetonius, Thallus, and the Talmud all confirm details of Jesus' life: that he lived, performed wonders, was crucified under Pilate, and that his followers worshipped him and believed he rose from the dead. Even hostile sources confirm the Gospel story.`,
  short: `These sources confirm that Jesus existed, was executed under Pilate, and had followers who worshipped him, which no serious historian disputes. They confirm nothing supernatural. The famous passage in Josephus was expanded by Christian copyists. Tacitus, writing around 116 CE, reports what Christians believed and calls it a "deadly superstition." No contemporary writer mentions the darkness at noon, the earthquake, or the dead saints walking into Jerusalem, events Matthew says were public and spectacular.`,
  points: [
    { h: "Josephus", t: `*Antiquities* 18.63–64 (the Testimonium Flavianum, c. 93 CE) as it stands says Jesus was "the Christ," that it might not be right to call him a man, and that he appeared alive on the third day. A Jewish writer who remained a non-Christian wouldn't write this. Most scholars think it's an authentic core with Christian additions. *Antiquities* 20.200, which mentions "James, the brother of Jesus who was called Christ," is widely accepted. Josephus confirms Jesus' existence, his reputation as a wonder-worker and teacher, and his execution under Pilate.` },
    { h: "Tacitus", t: `*Annals* 15.44 (c. 116 CE): Christians took their name from Christus, "who suffered the extreme penalty during the reign of Tiberius at the hands of one of our procurators, Pontius Pilatus," and their "deadly superstition" (*exitiabilis superstitio*) broke out again. Tacitus confirms the crucifixion. He was reporting what was known about Christians 85 years later, and he regarded their beliefs as a superstition.` },
    { h: "Pliny and Suetonius", t: `Pliny the Younger (*Letters* 10.96, c. 112 CE) reports that Christians in Bithynia sang hymns "to Christ as to a god." That's evidence of Christian worship, not of Jesus' divinity. Suetonius (*Claudius* 25.4) says Claudius expelled Jews from Rome because of disturbances "at the instigation of Chrestus," which may refer to Christ or to someone else.` },
    { h: "What's missing", t: `Mark 15:33 says darkness covered the whole land for three hours at the crucifixion. Matthew 27:51–53 adds an earthquake, rocks splitting, tombs opening, and many dead saints rising and appearing to many in Jerusalem. Seneca and Pliny the Elder, both of whom wrote about unusual natural phenomena, eclipses, and earthquakes, say nothing about it. Josephus, who wrote about Jerusalem in detail, says nothing either. Thallus is known only through a 3rd-century Christian (Julius Africanus) reporting that he explained a darkness as an eclipse, and we don't know what darkness Thallus meant or when he wrote.` }

  replies: [

{

  cat: "jesus",
  title: "Jesus Was the Greatest Moral Teacher",
  who: "Widespread view (including among non-Christians); John Stuart Mill praised his ethics; apologists argue his teaching proves his unique status",
  claim: `Jesus' teaching, the Sermon on the Mount, love of enemies, the Golden Rule, the parable of the Good Samaritan, care for the poor and outcast, is morally unsurpassed and revolutionary. No other teacher in history has matched it. Such wisdom points to his divine origin.`,
  short: `Much of Jesus' ethical teaching is admirable, and much of it had clear precedents: the Golden Rule in Confucius, Hillel, and Tobit; love of neighbor in Leviticus; non-retaliation in Buddhism and Stoicism. Other parts of his teaching are troubling: eternal punishment in fire, hating one's family, no word against slavery, and a Gentile woman compared to a dog. Moral insight, however great, isn't evidence of divinity; it would make Confucius or the Buddha divine too.`,
  points: [
    { h: "Precedents", t: `"What you do not wish for yourself, do not do to others" (Confucius, *Analects* 15.24, c. 500 BCE). "What is hateful to you, do not do to your neighbor; that is the whole Torah" (Hillel, Babylonian Talmud, Shabbat 31a, 1st century BCE). "What you hate, do not do to anyone" (Tobit 4:15). "You shall love your neighbor as yourself" (Leviticus 19:18) and the foreigner as yourself (19:34). "Hatred does not cease by hatred, but only by love" (Dhammapada 5). Seneca and Epictetus taught forgiveness and kindness toward enemies.` },
    { h: "Troubling teachings", t: `Jesus speaks more about hell than anyone else in the Bible: "it is better for you to enter life maimed than to have two hands and go to hell, to the unquenchable fire" (Mark 9:43). "Whoever comes to me and does not hate father and mother, wife and children, brothers and sisters... cannot be my disciple" (Luke 14:26). "I have not come to bring peace, but a sword" (Matthew 10:34). He calls a Gentile woman seeking help for her daughter a dog (Mark 7:27). He cites the Torah's death penalty for those who curse their parents approvingly (Mark 7:10). He curses a fig tree for not bearing fruit out of season (Mark 11:13–14).` },
    { h: "Silence on slavery", t: `Slavery was everywhere in Jesus' world, and his parables use it freely without criticism: "That slave who knew what his master wanted but did not prepare himself... will receive a severe beating" (Luke 12:47). The master in the parable of the talents punishes the slave who failed to profit (Matthew 25:30). There's no word against the institution. See [[slavery]].` },
    { h: "Impractical as a general ethic", t: `"Do not worry about tomorrow" (Matthew 6:34), "sell your possessions" (Luke 12:33), "if anyone wants to sue you and take your coat, give your cloak as well" (Matthew 5:40), "make yourselves eunuchs for the kingdom" (Matthew 19:12). These make sense from someone expecting the world to end imminently (see [[failed-return]]), less so as a lasting ethic for families and societies. Most Christians, in practice, don't follow them.` }

    { q: "Love your enemies was radically new. No one taught that before Jesus.", a: `Proverbs 25:21 says "if your enemies are hungry, give them bread to eat." The Buddha taught overcoming hatred with love five centuries earlier. Stoics taught that wronged people should seek the good of those who wrong them. Jesus' formulation is powerful, but it builds on earlier traditions rather than appearing from nowhere.`, k: "love your enemies radically new no one taught before unique" }

{
  id: "christianity-growth",
  cat: "jesus",
  title: "Christianity's Spread Is Inexplicable Without the Resurrection",
  who: "Popular apologetics ('twelve uneducated men changed the world'); William Lane Craig; Gamaliel's counsel (Acts 5:38–39)",
  claim: `A small group of frightened, uneducated Jewish followers of a crucified criminal transformed the Roman Empire within three centuries, without force, while being persecuted. If the movement were false, it would have died out, as Gamaliel said (Acts 5:38–39). Only the truth of the resurrection explains it.`,
  short: `Sociologist Rodney Stark (a sympathizer of Christianity) showed that Christian growth from about 1,000 believers in 40 CE to about 6 million by 300 CE requires a steady growth rate of about 40% per decade, comparable to the growth of the Latter-day Saints in the 20th century. It's explained by ordinary social factors. After Constantine, the spread was backed by state power and the suppression of rivals. Islam spread faster; Mormonism and other new movements have grown despite persecution. Success doesn't show truth.`,
  points: [
    { h: "The growth rate was ordinary", t: `Rodney Stark (*The Rise of Christianity*, 1996) estimated that Christian numbers grew from roughly 1,000 in 40 CE to about 6 million (around 10% of the empire) by 300 CE. That requires about 40% growth per decade, close to the Latter-day Saints' growth rate in the 20th century. Keith Hopkins (1998) reached similar conclusions. Neither growth is miraculous.` },
    { h: "Ordinary social causes", t: `Stark identifies factors such as recruitment through social networks, a community that cared for its own members during epidemics (which raised survival rates), the higher status of women in the community, higher fertility, and the appeal of a strong community in crowded, anonymous cities. These are the mechanisms by which successful new religious movements grow today.` },
    { h: "Then came the emperors", t: `Constantine's patronage after 312 made Christianity advantageous for careers. Theodosius made Nicene Christianity the official religion in 380. Pagan sacrifice was banned (391–392), temples were closed or destroyed, and heretics were persecuted. The Christianization of the empire after 312 was driven largely by imperial power (MacMullen, *Christianizing the Roman Empire*, 1984). Later, Christianity spread by conquest and colonization.` },
    { h: "Gamaliel's test fails other religions too", t: `By Gamaliel's reasoning, Islam (which reached from Spain to India in a century), Buddhism, Mormonism (founded 1830, now about 17 million members), and Manichaeism (which spread from Rome to China before declining) would all be from God. A religion that survives and spreads may be well adapted to human needs. That's different from being true.` },
    { h: "Persecution was sporadic", t: `Before 250 CE, persecution of Christians was mostly local and occasional. Empire-wide persecution occurred under Decius (250), Valerian (257–260), and the Great Persecution of Diocletian (303–311). Persecution doesn't stop movements and can strengthen them. Many groups grow under persecution, from early Mormons to Jehovah's Witnesses in the Soviet Union and Falun Gong in China.` }

{
  id: "minimal-facts",
  cat: "resurrection",
  title: "The Minimal Facts Argument",
  who: "Gary Habermas & Michael Licona, The Case for the Resurrection of Jesus (2004); Habermas's surveys of scholarship; William Lane Craig's 'four facts'",
  claim: `Arguing only from facts that are granted by the vast majority of scholars, including skeptics: (1) Jesus died by crucifixion; (2) his disciples sincerely believed he appeared to them risen; (3) Paul, a persecutor of the church, converted after an experience he believed was an appearance; (4) James, Jesus' skeptical brother, converted; (5) the tomb was found empty (accepted by about 75% of scholars). No naturalistic theory explains all these facts. Swoon, theft, wrong tomb, and hallucination each fail. The best explanation is that God raised Jesus from the dead.`,
  short: `The facts that are actually agreed on are much thinner than the argument needs. Scholars agree that followers *had experiences they interpreted* as appearances of the risen Jesus, not that Jesus appeared. That is just what bereavement visions, which are very common, plus religious interpretation would produce. The empty tomb is genuinely disputed, and even its defenders like Dale Allison (a Christian) concede it can't establish a resurrection. The "consensus" is a count of publications in a field dominated by Christian scholars, with an unpublished methodology. And the argument compares "God raised Jesus" against single natural theories one at a time instead of against the natural explanation that combines them.`,
  points: [
    { h: "What is actually agreed", t: `Most critical scholars agree that Jesus was crucified, and that some of his followers came to believe soon afterward that he had been raised and had appeared to them. That's a fact about *beliefs* and *experiences*. Ehrman, Sanders, Lüdemann, and others accept it while explaining the experiences as visions. The minimal facts approach turns "the disciples had experiences they believed were appearances" into "the appearances need a supernatural explanation," which is the conclusion, not a fact.` },
    { h: "The 'consensus' is shaky", t: `Habermas's figures come from his own survey of publications on the resurrection, the details of which have not been published for scrutiny. Most of the literature on the resurrection is written by Christian scholars, many of them at confessional institutions, so the sample is not neutral. And historians' agreement that the disciples *believed* something is compatible with naturalistic explanations; many of the scholars counted hold exactly those explanations.` },
    { h: "Bereavement visions are common", t: `Studies of bereaved people consistently find that a large proportion, around 30–60% depending on the study, report sensing, seeing, hearing, or even being touched by the dead person (Rees, *BMJ*, 1971; Castelnovo et al., 2015). These experiences can be vivid and life-changing. A group of grieving followers who had expected their leader to bring God's kingdom, in a culture that already believed in resurrection and visions, is exactly where such experiences would be expected and interpreted as divine (see [[appearances]]).` },
    { h: "Divide and conquer", t: `Apologists refute natural theories one at a time ("hallucinations don't explain the empty tomb," "theft doesn't explain the appearances"). Historical explanations combine. Grief visions to Peter and others, interpreted through Jewish martyr-vindication beliefs and scriptures like Hosea 6:2, spread by social contagion; the tomb story arose or grew later; Paul had his own vision; and James, a family member, took a leading role. Each element uses well-attested human processes. The resurrection hypothesis requires a miracle with no independent support.` },
    { h: "The prior probability is decisive", t: `Billions of people have died; no case of resurrection after three days is independently documented. Reports of resurrections, apparitions of the dead, and miracles are, by comparison, extremely common in every culture. Even a very good historical record would face this prior. A record consisting of anonymous texts written decades later, by believers, with legendary growth, doesn't come close to overcoming it (see [[bayes-resurrection]]).` },
    { h: "Even Christian historians are cautious", t: `Dale Allison, a leading New Testament scholar and a believing Christian, concludes in *The Resurrection of Jesus: Apologetics, Polemics, History* (2021) that the evidence is consistent with both Christian and naturalistic interpretations, and that historical method alone can't settle the matter in favor of the resurrection. He leans slightly toward the empty tomb being historical, but documents many parallels to the appearance reports in visions of the dead, including collective ones.` }
  ],
  replies: [
    { q: "Hallucinations can't explain group appearances. Groups don't share the same hallucination.", a: `Group experiences of apparitions are well documented, from Marian apparitions witnessed by crowds to collective sightings of the recently dead, which Allison catalogs. They don't require identical private images. They involve shared expectation, one person's report shaping others', and a group that reinterprets ambiguous experiences together. And our only "group appearance" reports come from secondhand creedal lists and later Gospels, which don't describe what anyone actually saw.`, k: "groups don't hallucinate group hallucination collective impossible same hallucination" },
    { q: "Even skeptical scholars accept these facts.", a: `They accept that Jesus died and that his followers had experiences they believed were appearances. They don't accept that he appeared. Using their agreement on the first to support a conclusion they reject is misleading. Ehrman, Lüdemann, Crossan, and Allison all accept the "minimal facts" in some form and still don't conclude that a resurrection happened.`, k: "even skeptical scholars accept facts ehrman agrees consensus" },
    { q: "What's your explanation then? You need a better theory.", a: `Grief-driven visions (starting with Peter), spread through a close-knit group, interpreted with existing Jewish beliefs about the vindication of martyrs, and followed by the development of an empty-tomb narrative. Every element is attested in human experience. And even if I had no specific explanation, "we don't know exactly what happened 2,000 years ago" is far more probable than "a man rose from the dead." Not knowing how a magician did a trick isn't evidence of real magic.`, k: "what's your explanation better theory alternative naturalistic explain facts" }
  ],
  sources: [
    "Habermas, G. & Licona, M. (2004). The Case for the Resurrection of Jesus. Kregel.",
    "Allison, D. C. (2021). The Resurrection of Jesus: Apologetics, Polemics, History. T&T Clark.",

    "Castelnovo, A. et al. (2015). 'Post-bereavement hallucinatory experiences: A critical overview of population and clinical studies.' Journal of Affective Disorders 186: 266–274.",
    "Komarnitsky, K. (2014). Doubting Jesus' Resurrection: What Happened in the Black Box?, 2nd ed. Stone Arrow."
  ],
  keys: "minimal facts resurrection habermas licona historical facts scholars agree crucifixion appearances empty tomb paul james best explanation evidence for resurrection",

{
  id: "empty-tomb",
  cat: "resurrection",
  title: "The Tomb Was Empty",
  who: "William Lane Craig; N. T. Wright, The Resurrection of the Son of God (2003); Habermas & Licona",
  claim: `Jesus was buried by Joseph of Arimathea in a known tomb, and the tomb was found empty on Sunday morning by women. The disciples couldn't have preached the resurrection in Jerusalem if the body were still in the tomb; the authorities would simply have produced it. The Jewish authorities' own response, that the disciples stole the body (Matthew 28:11–15), admits the tomb was empty.`,
  short: `Our earliest source, Paul, never mentions an empty tomb. The story first appears in Mark, around 40 years later, and Mark ends with the women telling no one, which would explain why no one had heard of it. Romans often left crucified victims unburied or in common graves. The "stolen body" polemic is known only from Matthew's own apologetic account, written around 80–90. Even if the tomb was empty, ordinary explanations (the body moved, reburied, or stolen; a wrong tomb) are vastly more probable than resurrection. By the time the disciples preached in Jerusalem (Acts 2 says 50 days later), a body would be unrecognizable.`,
  points: [
    { h: "Paul's silence", t: `Paul's letters, written in the 50s, are the earliest Christian documents. He discusses the resurrection at length in 1 Corinthians 15, against people who doubted resurrection, and never mentions an empty tomb, the women, or a burial place. The creed he quotes says Jesus "was buried" and "was raised," which a Jew would affirm without having seen an empty tomb. His theology of a "spiritual body" (15:44) and "flesh and blood cannot inherit the kingdom of God" (15:50) doesn't require the corpse to have left.` },
    { h: "Mark's ending", t: `Mark, the first Gospel to mention the tomb, ends at 16:8: the women "went out and fled from the tomb, for terror and amazement had seized them; and they said nothing to anyone, for they were afraid." Many scholars read this as Mark's explanation for why the story was not widely known before his Gospel. The later endings (16:9–20) were added by scribes.` },
    { h: "Roman crucifixion practice", t: `Crucifixion was designed to humiliate, and leaving bodies to decay or be eaten by animals was part of the punishment. Ancient writers refer to this (Horace, *Epistles* 1.16.48; Petronius, *Satyricon* 111–112; Juvenal 14.77). Bodies were sometimes released to families as a favor (Philo, *Flaccus* 83, on holidays), and Jewish law required burial before sunset (Deuteronomy 21:22–23; Josephus, *Jewish War* 4.317). The heel bone of a crucified man named Jehohanan, found in a family ossuary in 1968, shows that at least one crucified man was buried. So burial is possible, but it isn't guaranteed, and many scholars (Crossan; Ehrman, 2014; Cook, 2014) doubt it for a man condemned for sedition.` },
    { h: "Joseph of Arimathea and the guard", t: `Mark says Joseph was a member of the council (15:43), the same council of which Mark said "all of them condemned him" (14:64). Later Gospels resolve the tension by making Joseph a secret disciple (Matthew 27:57; John 19:38). The guard at the tomb appears only in Matthew. It's placed there the day *after* the burial (27:62), leaving a night unguarded, and serves to answer the charge that the disciples stole the body, which suggests it was created as an apologetic response.` },
    { h: "Disappearing bodies were a literary type", t: `Richard C. Miller (*Resurrection and Reception in Early Christianity*, 2015) shows that Greek and Roman literature has a common "translation fable" pattern, in which a hero's body vanishes and he's taken up to the gods: Romulus (Livy 1.16; Plutarch, *Romulus* 27–28), Heracles, Aristeas (Herodotus 4.14–15), and Alcmene, whose body was replaced by a stone in her coffin. Audiences recognized a missing body as a sign of divine status. Mark's empty tomb fits this pattern.` },
    { h: "If it was empty, so what?", t: `Empty tombs have ordinary explanations: the body was moved (by Joseph to a permanent grave, or by authorities), stolen (tomb robbery was common enough that an imperial edict of the period, the so-called Nazareth Inscription, threatened death for it), or the women went to the wrong tomb. Each of these is improbable but has a known precedent. Resurrection has none. The disciples' claim 50 days later couldn't have been refuted by a body in the advanced decomposition of a Jerusalem spring. And the earliest preaching emphasized appearances, not a tomb.` }
  ],
  replies: [
    { q: "The authorities would have produced the body to stop the preaching.", a: `According to Acts 2, public preaching began at Pentecost, seven weeks after the crucifixion. A body by then would be decomposed beyond recognition. The authorities had little reason to care about a small sect in its first weeks. If the body was in a common grave, it couldn't be identified at all. And the disciples' message, as the earliest sources show, was about appearances, not a tomb. People who believe in a "spiritual body" wouldn't be dissuaded by a corpse.`, k: "authorities produce body stop preaching jerusalem disprove" },
    { q: "The Jewish leaders said the disciples stole the body, so they admitted the tomb was empty.", a: `That "admission" is reported only by Matthew, a Christian writing around 80–90 CE, decades later, in a story invented to rebut a later Jewish argument. It tells us what Matthew's opponents said in Matthew's time, in response to Christian claims. It isn't independent evidence from 30 CE.`, k: "jewish leaders stole the body admitted empty tomb matthew 28 guard" }
  ],
  sources: [

    "Cook, J. G. (2014). Crucifixion in the Mediterranean World. Mohr Siebeck.",
    "Crossan, J. D. (1994). Jesus: A Revolutionary Biography. HarperSanFrancisco, ch. 6.",

  keys: "empty tomb tomb was empty joseph of arimathea women found tomb empty body stolen guards authorities produce body burial roman crucifixion",

{
  id: "appearances",
  cat: "resurrection",
  title: "The Resurrection Appearances Can't Be Explained Naturally",
  who: "William Lane Craig; Gary Habermas; N. T. Wright",
  claim: `Jesus appeared to many people, on many occasions, individually and in groups, to believers and skeptics, indoors and outdoors. He was touched, ate food, and talked at length. Hallucinations are private, rare, and don't transform people. Something objective happened.`,
  short: `The earliest evidence, Paul's list in 1 Corinthians 15, uses the same word ("he appeared," *ōphthē*) for the other appearances as for Paul's own, which was a vision. It gives no physical details. The physical, touchable Jesus who eats fish appears only in the later Gospels (Luke and John), in scenes that answer skeptics' doubts. Visions of the dead are among the most common human experiences, especially in grief. Collective visions are documented. And visions have transformed people in every religion.`,
  points: [
    { h: "Paul's list is the earliest evidence", t: `"He appeared (*ōphthē*) to Cephas, then to the twelve. Then he appeared to more than five hundred... Then he appeared to James, then to all the apostles. Last of all... he appeared also to me" (1 Corinthians 15:5–8). Paul puts his own experience in the same series, with the same verb. Paul's experience was a vision: Acts describes a light and a voice, with his companions seeing no one (9:7) and Paul calling it a "heavenly vision" (26:19). Paul says God "revealed his Son *in me*" (Galatians 1:16).` },
    { h: "The appearances get more physical over time", t: `In Mark (c. 70), there are no appearances, only the promise of one in Galilee. In Matthew (c. 80–90), Jesus appears briefly, and "some doubted" (28:17). In Luke (c. 85–95), he insists "a ghost does not have flesh and bones as you see that I have" and eats broiled fish (24:39–43). In John (c. 90–110), Thomas is invited to put his finger in the wounds (20:27). The movement from vision to touchable body follows the needs of later apologetics against skeptics and docetists (who said Jesus only seemed to have a body).` },
    { h: "Grief visions are common and convincing", t: `Studies of bereavement find that many people, roughly 30–60% depending on the study, experience the presence of the dead: seeing them, hearing them, feeling their touch, or having conversations (Rees, 1971; Castelnovo et al., 2015). People typically find these experiences real and comforting. Peter, who had denied Jesus, and the other disciples, who had fled, would have been in intense grief and guilt, a setting where such experiences are especially likely.` },
    { h: "Collective experiences happen", t: `Dale Allison (2005, 2021) documents reports of collective apparitions of the dead and of religious figures. Crowds have reported seeing the Virgin Mary (Knock, Ireland, 1879; Zeitoun, Egypt, 1968–70; Medjugorje, from 1981), and at Fatima in 1917 tens of thousands reported the sun dancing (see [[fatima]]). Group experiences arise through shared expectation, suggestion, and one person interpreting an ambiguous perception for the others. They don't need a real object.` },
    { h: "Visions transform people everywhere", t: `Muhammad's visions of Gabriel founded Islam. Joseph Smith's visions founded Mormonism, and his witnesses never recanted. Visions and conversions are common in Hindu, Buddhist, and shamanic traditions. That transformative experiences occurred tells us about human psychology, not about which religion is true.` }
  ],
  replies: [
    { q: "Hallucinations are private. 500 people can't share the same one.", a: `The "500" is a single unsupported line in Paul (see [[five-hundred]]). Collective visionary experiences, where a group reports seeing something no outside observer could detect, are well documented, from Marian apparitions to Fatima. They don't require identical private images; social influence and reinterpretation do the work. We also have no first-hand account from any member of a group appearance.`, k: "hallucinations private 500 share same hallucination group" },
    { q: "Jesus ate fish and was touched. A vision can't do that.", a: `Those details appear only in Luke and John, written 50 to 70 years later, in scenes that answer doubts about whether Jesus was a ghost. They're the end point of a development, not the earliest testimony. Paul, the only eyewitness to an appearance who wrote anything, describes a vision and a "spiritual body."`, k: "ate fish touched wounds physical body thomas flesh and bones" }

  keys: "resurrection appearances appeared hallucination visions grief bereavement group appearances physical body ate fish touched wounds thomas ophthe",

},
{
  id: "five-hundred",
  cat: "resurrection",
  title: "Jesus Appeared to Five Hundred Witnesses",
  who: "1 Corinthians 15:6; popular apologetics",
  claim: `Paul says Jesus "appeared to more than five hundred brothers and sisters at one time, most of whom are still alive" (1 Corinthians 15:6). Paul is inviting his readers to check with the living witnesses. No one would make such a claim if it could be easily refuted.`,
  short: `This is one sentence in one source, with no names, no place, no time, and no description. No other early Christian writing mentions it, not even Acts, which loves crowd scenes, or any Gospel. The Corinthians, hundreds of miles away in Greece, had no way to find and question unnamed witnesses in Palestine. It's a claim *about* witnesses, not testimony *from* them.`,
  points: [
    { h: "No details", t: `Paul doesn't say where, when, or what the 500 saw. He doesn't name any of them. For an event that would be the most powerful evidence in the whole case, the silence of every other source is striking. The Gospels describe appearances to small groups; none mentions 500 people.` },
    { h: "Not checkable", t: `"Most of whom are still alive" sounds like an invitation to verify, but without names or places, verification was impossible for Corinthian readers in the 50s. There's no evidence that anyone did check, and no record of any of the 500 telling their story.` },
    { h: "Possibly a Pentecost tradition", t: `Some scholars suggest that the 500 tradition reflects an ecstatic group experience like the one Acts 2 describes at Pentecost (tongues of fire, speaking in tongues), later counted as a resurrection appearance. If so, it was a collective religious experience of the kind seen in charismatic revivals, not a visual meeting with a resurrected body.` },

{
