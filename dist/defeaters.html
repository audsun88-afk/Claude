  replies: [
    { q: "It's a mystery. Our finite minds can't comprehend an infinite God.", a: `Incomprehensibility is not the problem; contradiction is. A doctrine can be beyond full understanding without being inconsistent. But "one God, three distinct persons each of whom is that God" is not a statement we fail to understand. We understand it well enough to see that, read literally, it entails a contradiction. Appealing to mystery at exactly the point where the logic fails is a way of declining to defend the claim. And if contradictions are acceptable in theology, no argument against Christianity *or for it* can be evaluated.`, k: "mystery finite minds can't comprehend infinite god beyond understanding trinity mystery" },
    { q: "One what, three whos: one being, three persons. There's no contradiction.", a: `That formula works only if each "who" is not itself a "what" that is God. But the creeds say each Person *is* God. If the Father is a divine being and the Son is a divine being, and they are not the same, there are two divine beings. Saying "one being" then means the three share a nature, as three humans share humanity, which is tritheism. Or it means they are aspects of one being, which is modalism.`, k: "one what three whos one being three persons ousia hypostasis essence person" }

  title: "Jesus Was Fully God and Fully Man",
  who: "Council of Chalcedon (451); Thomas Morris, The Logic of God Incarnate (1986); kenotic Christologists (Stephen Evans); Oliver Crisp",
  claim: `Jesus Christ is one person with two complete natures, divine and human, "without confusion, without change, without division, without separation" (Chalcedon, 451). He was omniscient as God and limited as man, impassible as God and suffering as man. Morris's "two minds" model and kenotic models, in which the Son voluntarily set aside some divine attributes, show this is coherent.`,
  short: `Being divine requires properties (omniscience, impassibility, immortality, necessity) whose negations are essential to being human (limited knowledge, the capacity to suffer, mortality, contingency). One person cannot have both a property and its negation. "Two natures" doesn't solve this, because properties belong to the *person*: it was one and the same subject who supposedly knew everything and did not know the day of the end (Mark 13:32). Each model either splits Christ into two persons (Nestorianism) or diminishes one of the natures.`,
  points: [
    { h: "Contradictory attributes in one subject", t: `God is omniscient; Jesus did not know the day or the hour (Mark 13:32) and "increased in wisdom" (Luke 2:52). God cannot be tempted (James 1:13); Jesus "was tempted in every way" (Hebrews 4:15). God cannot die; Jesus died. The "qua" strategy (Jesus *qua* God knows, *qua* man doesn't) attributes both to the same subject: "Jesus knows X" and "Jesus doesn't know X." Adding "qua" relocates the contradiction without explaining how one subject can bear both properties (Cross, 2009; Hick, *The Myth of God Incarnate*, 1977).` },
    { h: "Two minds means two persons", t: `Morris's two-minds model: the divine mind contains the human mind, but not vice versa, as a dreamer's waking mind contains the dream. Critics note that a person is commonly defined by a distinct center of consciousness. If the Son has two such centers, it is hard to see why there are not two persons, which is Nestorianism, condemned at Ephesus (431). If the divine mind is fully aware of everything the human mind knows, the human mind's ignorance and temptation look like a performance.` },
    { h: "Kenosis gives up divinity", t: `Kenotic models, after Philippians 2:7 ("he emptied himself"), say the Son temporarily gave up omniscience and omnipotence. But if these properties are *essential* to God, then something that lacks them is not God. If they are not essential, then "God" is not a being with necessary perfections, contrary to classical theism. Either way, the incarnate Jesus was not fully God in the classical sense.` },
    { h: "Was Jesus able to sin?", t: `If Jesus could not sin (non posse peccare), his temptation was not real, and Hebrews 4:15 is empty. If he could sin, then God could sin, contrary to divine perfection. Theologians have debated this ("impeccability") for centuries without resolution (see Crisp, *God Incarnate*, 2009).` },
    { h: "A doctrine forged in controversy", t: `Chalcedon's formula was a political compromise that split Christianity. The Oriental Orthodox churches (Coptic, Ethiopian, Armenian, Syriac), which hold that Christ has one united nature (miaphysitism), rejected it. The Church of the East was associated with Nestorius. These schisms persist after 1,500 years. Each side accused the other of heresy. That is what we would expect if the formula papered over an incoherence rather than resolved it.` }

  claim: `God is spirit (John 4:24), a personal being with knowledge, will, and love, but no body, brain, or physical location. There is nothing incoherent in the idea of a mind that does not depend on matter. Swinburne argues that we can imagine being disembodied, so it is possible.`,
  short: `Every mind we have evidence of is the activity of a nervous system, and its features (memory, attention, emotion, reasoning) are traceable to specific neural mechanisms. That gives inductive evidence that minds depend on brains, which counts against the existence of any disembodied mind, God included. The idea that we can "imagine being disembodied" shows only that we can imagine it, which is weak evidence that it's possible.`,
  points: [
    { h: "The argument from neural dependence", t: `Damage to specific brain regions removes specific mental capacities: Broca's area (speech production), the hippocampus (forming new memories), the fusiform face area (recognizing faces), the ventromedial prefrontal cortex (moral and social judgment, as in the case of Phineas Gage). General anesthesia removes consciousness; drugs alter it predictably. This is massive inductive evidence that mental functions are brain functions (Augustine, "The Dependence of Consciousness on the Brain," in *The Myth of an Afterlife*, 2015). A mind with no brain would be the one exception to everything we know about minds.` },
    { h: "Knowledge and action need mechanisms", t: `Our knowledge comes through causal contact (perception) and is stored in physical structures (synapses). How does a non-physical, non-spatial mind know where and when anything is, or act on matter at particular places? The interaction problem, which Princess Elisabeth of Bohemia pressed against Descartes in 1643, has never been solved. For God it is the same problem in its most extreme form.` },

  claim: `God is perfectly free, under no external constraint, choosing to create out of love. He is also perfectly good, unable to do evil. These are compatible: true freedom is the freedom to do the good, and God's inability to sin is a perfection, not a limitation.`,
  short: `William Rowe (*Can God Be Free?*, 2004) argued that a perfectly good God would be obligated to create the best world, if there is one. If there is no best world, then for any world God creates, there's a better one he could have created, so a morally perfect being could not settle on any of them. If God has no real alternatives, he is not free in the libertarian sense that the free will defense needs. Either way the classical package becomes unstable.`,
  points: [
    { h: "Rowe's dilemma", t: `If there is a best possible world, perfect goodness requires God to create it, so God had no real choice. If there is no best world (for any world, a better one exists), then whatever God creates, he could have done better. A perfectly good being cannot be outdone even by its own other options. So, Rowe argues, either God is not free or no perfectly good being can exist. Responses (Adams' "grace" view; Kraay's "theistic multiverse") are debated, and none has become standard.` },

  title: "Evil Doesn't Disprove God",
  who: "Alvin Plantinga, God, Freedom, and Evil (1974); Peter van Inwagen, The Problem of Evil (2006); Eleonore Stump, Wandering in Darkness (2010)",
  claim: `The logical problem of evil, the claim that God and evil are strictly contradictory, was refuted by Plantinga's free will defense. Most philosophers, including atheists, accept this. God may have morally sufficient reasons for allowing evil that we cannot see. Without God, there is no objective "evil" to complain about anyway. So the existence of suffering is no argument against God.`,
  short: `The *logical* problem may be answered, and honest skeptics should concede that. But the problem that matters today is *evidential*: the amount, kind, and distribution of suffering is far more probable if there is no all-good, all-powerful God than if there is. William Rowe's and Paul Draper's arguments remain central in the literature. The "without God there's no evil" reply misunderstands the argument, which is internal: it uses the theist's own concept of a good God and asks whether the world fits it.`,
  points: [
    { h: "Grant the logical problem, press the evidential one", t: `Plantinga showed it is not strictly *impossible* for God and some evil to coexist. The evidential argument (Rowe, 1979) is different. There appear to be instances of intense suffering that an omnipotent, omniscient being could have prevented without losing a greater good or permitting a worse evil. Rowe's example: a fawn trapped in a forest fire, burned, suffering for days before dying, unseen by anyone. Probably at least some such suffering is pointless. A perfectly good God would prevent pointless suffering. So probably no such God exists.` },
    { h: "Draper's Hypothesis of Indifference", t: `Paul Draper (*Noûs*, 1989) compares theism with the "Hypothesis of Indifference": the nature and condition of sentient beings is not the result of benevolent or malevolent actions by non-human persons. The observed facts about pain and pleasure (pain that is biologically useful, pain that is useless, and both distributed without regard to moral desert) are much more probable on the Hypothesis of Indifference than on theism. That favors indifference over theism, even before considering anything else.` },
    { h: "The scale is staggering", t: `Volk and Atkinson (2013) estimate that across hunter-gatherer and historical societies, about 27% of infants died in their first year and about 46% of children died before puberty. For most of human history, nearly half of all children died, often painfully, of infection, starvation, and parasites. Smallpox alone killed an estimated 300 million people in the 20th century. Any theodicy must account for this, not for a stubbed toe or a single tragedy.` },
    { h: "'Without God there's no evil' misreads the argument", t: `The problem of evil is a *reductio*: it takes the theist's premises (God is perfectly good and powerful; suffering is bad) and shows they don't fit the world. The skeptic doesn't need to believe in objective evil any more than someone who points out an inconsistency in a novel's plot needs to believe the novel is true. And secular moral realists have their own grounds for calling suffering bad (see [[moral-argument]]).` },
    { h: "The theodicies each cover a fraction of the evidence", t: `Free will covers moral evil, not earthquakes, cancers, and parasites ([[natural-evil]]). Soul-making doesn't cover infants and animals ([[soul-making]]). The Fall doesn't cover hundreds of millions of years of animal suffering before humans ([[animal-suffering]]). Skeptical theism undermines moral knowledge generally ([[skeptical-theism]]). The overall structure is a patchwork, with a fallback to "God's ways are mysterious" wherever the patches don't reach.` }

  replies: [
    { q: "God has morally sufficient reasons we can't see.", a: `Possibly, but the question is what's probable. If we have no idea what God's reasons could be, we also have no basis for expecting the world to look as it does under theism, and theism makes no predictions. If we do have some idea of what a good being would do, the world looks very different from what we'd expect. See [[skeptical-theism]] for why this move undermines too much.`, k: "morally sufficient reasons can't see god's reasons mysterious ways higher plan" },
    { q: "Plantinga refuted the problem of evil. Even atheist philosophers admit it.", a: `Plantinga answered the *logical* version: the claim that God and any evil at all are strictly contradictory. Philosophers widely accept that. The *evidential* version, that suffering makes God improbable, was not addressed by the free will defense and is very much alive in the literature (Rowe, Draper, Oppy, Schellenberg, Sterba). Even the free will defense covers only suffering caused by free choices.`, k: "plantinga refuted problem of evil atheists admit logical problem solved" },

{

  cat: "evil",
  title: "The Free Will Defense",
  who: "Augustine; Alvin Plantinga, The Nature of Necessity (1974); Richard Swinburne, Providence and the Problem of Evil (1998)",
  claim: `God created beings with genuine free will because a world with free creatures capable of love and moral goodness is better than a world of robots. Free will requires the real possibility of choosing evil. Much suffering results from human choices. God cannot force free creatures to choose good without destroying their freedom. Plantinga adds that it is possible every free creature God could create would go wrong at least once ("transworld depravity").`,
  short: `The defense explains, at most, suffering caused by free choices. It doesn't explain disease, natural disasters, or animal suffering. Even for moral evil, it fails to explain why God doesn't restrain the *consequences* of evil choices (we restrain murderers without destroying their freedom), why victims' freedom counts for nothing, and why heaven can contain free beings who never sin. If God could create such beings there, he could have created them here.`,
  points: [
    { h: "Freedom of will versus freedom of action", t: `A person can choose to murder and be stopped. Their free will was exercised; the harm was prevented. We think that police, parents, and bystanders *should* prevent atrocities, and no one says that stopping a rapist violates his free will in any troubling way. A God who never intervenes, at Auschwitz or in a child's abuse, is behaving in a way we would call grossly negligent in any human being with the power to help.` },
    { h: "The victim's freedom", t: `When one person murders another, the victim's freedom, including all their future choices, is destroyed. The free will defense values the murderer's freedom to kill above the victim's freedom to live. A God concerned with freedom as such would protect the free choices of the many against the destructive choices of the few.` },
    { h: "The heaven problem", t: `Christian doctrine holds that the redeemed in heaven are free and yet never sin (Revelation 21:4, 27). If free beings who never sin are possible, God could have created them from the start. If heaven's inhabitants cannot sin, then freedom to sin is not necessary for the highest good, and the defense loses its premise. See [[heaven-free-will]].` },
    { h: "Mackie's challenge: free beings who always choose right", t: `If it is possible for a free being to choose good on one occasion, it is possible for it to choose good on every occasion. So an omnipotent God could have created a world of free beings who always freely do right (Mackie, 1955). Plantinga's answer relies on "transworld depravity": every possible free creature would go wrong in some circumstance God could actualize. That is logically possible, but there is no reason to think it is *true*. And it presupposes Molinist middle knowledge, which has its own problems (see [[foreknowledge]]).` },
    { h: "The scale of moral evil versus what freedom requires", t: `Meaningful free choices would be possible in a world with much less room for catastrophe: where people could still choose cruelty, but where a single person couldn't order a genocide or a single choice couldn't destroy a child's entire life. Freedom doesn't require that the range of possible harms be unlimited.` }

  claim: `Disease, natural disasters, and death entered the world through human sin (Genesis 3; Romans 5:12; Romans 8:20–22). Creation was originally "very good," and the curse on the ground affected all of nature. Alternatively, natural evil may be caused by fallen angels (Plantinga), or a world with stable natural laws, which is necessary for free action, inevitably produces natural disasters.`,
  short: `Natural evil predates humans by hundreds of millions of years: disease, predation, parasitism, and mass extinctions are all in the fossil record long before *Homo sapiens*. There is no historical Fall from a paradise (see [[adam-eve]]). The "fallen angels cause earthquakes" suggestion is a logical possibility with no evidence. And stable laws do not require tectonic plates that kill 230,000 people in a single tsunami, or a gene-copying system that produces childhood cancers.`,
  points: [
    { h: "Death before the Fall", t: `Fossil evidence of disease, injury, parasitism, and predation goes back to the Cambrian, more than 500 million years ago. Dinosaurs had tumors (osteosarcoma in a *Centrosaurus* fibula, Ekhtiari et al., *Lancet Oncology*, 2020). At least five mass extinctions wiped out most species living at the time, including the end-Permian extinction (~252 million years ago), which eliminated about 90% of marine species. No human choice could have caused any of this.` },
    { h: "No paradise to fall from", t: `Population genetics shows the human population never went through a bottleneck of two individuals (see [[adam-eve]]). Genesis 2–3 is an etiological story, explaining why snakes crawl, why childbirth hurts, and why farming is hard, comparable to other ancient Near Eastern stories (Adapa, Gilgamesh's lost plant of immortality). Without a historical Fall, the theological explanation of natural evil disappears.` },
    { h: "Fallen angels: an unfalsifiable rescue", t: `Plantinga proposed that natural evil *could* be the free action of non-human persons. That is enough to answer a logical argument, but as an explanation of what actually happens it has no evidence. We know what causes earthquakes (plate tectonics) and cancer (mutation). It also requires God to allow demons to torture children with disease, which reopens the original problem.` },

  claim: `Animals may not suffer as we do; they may lack self-awareness and so the capacity for real suffering. Or animal pain is the necessary price of a world with evolving, law-governed life. Animal suffering may be redeemed in an afterlife for animals (Dougherty), or caused by the Fall or by demons.`,
  short: `For more than 500 million years, sentient creatures have been eaten alive, parasitized, starved, and frozen. Most animals born die soon after birth. All of this happened before any human sin and with no possible moral or spiritual benefit to the animals. This "Darwinian problem of evil" is widely regarded, including by Christian scholars, as among the hardest problems for theism. Denying that animals suffer contradicts the neuroscience.`,
  points: [
    { h: "Animals do feel pain", t: `The Cambridge Declaration on Consciousness (2012) states that non-human animals, including all mammals and birds and many other creatures such as octopuses, possess the neurological substrates of conscious experience. The 2024 New York Declaration on Animal Consciousness extends a realistic possibility of consciousness to all vertebrates and many invertebrates. Animals show pain behavior, opioid systems, and learned avoidance. Descartes' view that animals are machines has no scientific defenders.` },
    { h: "Suffering is built into the mechanism", t: `Many species are "r-selected": they produce huge numbers of offspring, almost all of whom die quickly. A cod can lay millions of eggs. Natural selection *works through* mass death, starvation, and predation. Darwin wrote to Asa Gray (1860): "I cannot persuade myself that a beneficent & omnipotent God would have designedly created the Ichneumonidae with the express intention of their feeding within the living bodies of caterpillars." A God who chose evolution as his creative method chose this suffering on purpose.` },
    { h: "No theodicy reaches it", t: `Animals cannot exercise moral free will, can't grow spiritually through suffering, and can't be morally warned. Their suffering precedes humans, so it isn't a consequence of the Fall. Christian philosopher John Schneider (*Animal Suffering and the Darwinian Problem of Evil*, Cambridge, 2020) concludes that the standard theodicies fail here and that theists must take a different approach entirely.` },
    { h: "An animal afterlife is ad hoc", t: `Some propose that animals will be compensated in heaven. Scripture gives no clear support, and it is unclear what it would mean for a trilobite or a mosquito larva to be compensated. The proposal is invented to rescue the theory, not suggested by any evidence.` }

{

  cat: "evil",
  title: "Skeptical Theism: We Can't Know God's Reasons",
  who: "Stephen Wykstra (CORNEA, 1984); Michael Bergmann (2001); Daniel Howard-Snyder; Isaiah 55:8–9; Job 38–41",
  claim: `Our inability to see a reason for some evil is not good evidence that there is no reason. The gap between God's knowledge and ours is like the gap between a parent's and an infant's. An infant cannot understand why it is getting a vaccination. We have no reason to think the goods, evils, and connections between them that we know of are representative of all there are. So "pointless-looking suffering" doesn't count against God.`,
  short: `If we really can't judge whether an evil is justified by goods beyond our understanding, then we can't judge anything about what God would do. That includes whether he would keep his promises, tell the truth in scripture, or reward the faithful. It also undermines our own moral decisions: should we prevent a child's suffering, if it might serve an unknown greater good? The cure destroys the patient, and makes theism compatible with any possible world.`,
  points: [
    { h: "The moral skepticism objection", t: `If I should not infer from "I see no justifying reason for this child's torture" to "there probably isn't one," then when I witness a child being tortured, I equally cannot judge that I should intervene: perhaps God allows it for unknown goods. Skeptical theism thus undermines everyday moral reasoning (Maitzen, 2013; Almeida & Oppy, 2003). Most skeptical theists act as if suffering should be prevented, which suggests they don't really accept the premise.` },
    { h: "It undermines revelation", t: `If God might have reasons we can't grasp for permitting horrendous evil, he might have reasons we can't grasp for deceiving us: for scripture to be false, for the resurrection appearances to be illusions, for heaven to be a lie. Erik Wielenberg ("Skeptical Theism and Divine Lies," *Religious Studies*, 2010) presses this point. The skeptical theist can't consistently trust any of God's promises.` },
    { h: "It makes theism predict nothing", t: `A hypothesis compatible with any world, whether full of suffering or free of it, is not confirmed by anything. If the theist can't say what God would do, they also can't argue that fine-tuning, consciousness, or morality are what God would produce. Skeptical theism cancels the arguments for God along with the argument against.` },
    { h: "The parent analogy cuts the other way", t: `A loving parent who has to hurt an infant (a vaccination) comforts the child, stays with it, and explains as soon as it can understand. The parent is *present*. People suffering horrendous evil frequently experience no comfort, no presence, and no explanation, ever, and many die without any. That is the opposite of what the analogy predicts (see [[hiddenness]]).` }
  ],
  replies: [
    { q: "God's ways are higher than our ways (Isaiah 55:9). Who are you to judge God?", a: `If his ways are so far above ours that we can't evaluate them, we also can't call them *good*, since "good" means what we understand by goodness. Using our moral judgment to praise God, but not to question him, is inconsistent. "Who are you to judge?" applies equally to the person concluding that God is good, wise, and loving.`, k: "god's ways higher than ours isaiah 55 who are you to judge god job mysterious ways" },
    { q: "An infant can't understand why it gets a vaccination, and we're like infants compared to God.", a: `A good parent stays with the infant, comforts it, and later explains. God, by contrast, is absent from much horrendous suffering and never explains. The analogy also implies that we can't know whether a given evil should be prevented, which would make us unable to act morally.`, k: "infant vaccination parent child understand analogy" }

{
  id: "soul-making",
  cat: "evil",
  title: "Soul-Making: Suffering Builds Character",
  who: "Irenaeus; John Hick, Evil and the God of Love (1966); Richard Swinburne",
  claim: `God's purpose is not to make a hedonistic paradise but to develop morally and spiritually mature persons. Courage, compassion, patience, and faith can only develop in a world with real challenges and suffering. A world without pain would be a world where nothing we do matters. Suffering is the "vale of soul-making" (Keats).`,
  short: `Much suffering does not build souls. It crushes them, or falls on beings who cannot benefit: infants who die of disease, animals, people destroyed by dementia, people driven to despair. The amount and distribution of suffering bears no relation to anyone's need for growth. Hick himself acknowledged this "dysteleological" suffering and appealed to mystery and an afterlife where soul-making continues. That concedes that the world as we see it doesn't fit the theodicy.`,
  points: [
    { h: "Dysteleological suffering", t: `Hick used this term for suffering that serves no soul-making purpose: a child dying of meningitis, a village buried in a mudslide, a person whose mind is erased by Alzheimer's. These don't develop anyone's virtue, least of all the victim's. Hick conceded that such evils remain a mystery under his theodicy (*Evil and the God of Love*, 1966, ch. 17).` },
    { h: "Infants and animals can't be 'made'", t: `About half of all children born in human history died before adulthood, many before they could form moral character at all (see [[problem-of-evil]]). Animals have no soul-making to do. Suffering that falls on beings who cannot grow from it can't be justified by growth.` },
    { h: "Suffering often degrades character", t: `Severe trauma frequently produces PTSD, depression, addiction, and cruelty, not virtue. Research on "post-traumatic growth" shows that some people report growth after adversity, but this is far from universal, and its measurement is debated (Jayawickreme & Blackie, 2014). A soul-making God would use a far less erratic tool.` },
    { h: "The proportion problem", t: `A world with real challenges, uncertainty, and consequences would develop character without the Holocaust, smallpox, or child abuse. A gym builds strength without breaking bones. The theodicy justifies *some* hardship, not the amount and kinds we observe.` }

  replies: [

{
  id: "evil-god",
  cat: "evil",
  title: "The Evil-God Challenge",
  who: "Stephen Law, 'The Evil-God Challenge' (Religious Studies, 2010); responses by Max Baker-Hytch, Edward Feser, and others",
  claim: `(This entry presents a skeptic's argument and the theist's replies.) Theists hold that the arguments for God and the theodicies make belief in a *good* God reasonable. But they would immediately reject an all-powerful, all-*evil* God, because the world contains too much good: love, beauty, laughter, charity.`,
  short: `Stephen Law points out that every theodicy has a mirror image, a "reverse theodicy" explaining good in an evil God's world. Free will: an evil God gave us freedom so our cruelty would be more terrible. Soul-making: he gave us beauty and love so we would suffer their loss. Skeptical theism: his reasons for allowing good are beyond us. If the theodicies don't rescue an evil God, and they clearly don't, they don't rescue a good God either, because the world is roughly equally poorly explained by both. The best explanation is no god at all.`,
  points: [
    { h: "The symmetry", t: `The cosmological, fine-tuning, and ontological arguments point to a powerful creator, not a *good* one. On goodness, the arguments are neutral. The evidence from suffering argues against a good God. The evidence from good things argues against an evil one. Most people find the evil god absurd, and Law's point is that the good god is absurd for parallel reasons.` },
    { h: "Reverse theodicies work just as well", t: `Why does the evil God allow good? *Free will*: to make our moral failures and betrayals possible, since only free beings can truly hate. *Character-destruction*: he lets us develop virtues so we will suffer from despair when they fail. *Contrast*: we can only feel the full horror of evil after experiencing good. *Skeptical anti-theism*: his malevolent reasons are beyond our understanding. If we reject these as silly, consistency requires similar doubt about the originals.` },
    { h: "Responses and their costs", t: `Classical theists reply that evil is a privation (absence) of good, so a maximally evil being is incoherent (Feser; others). But that only blocks a God of *maximal* evil, not a powerful creator who is malevolent, indifferent, or mixed. Others say goodness and power are linked (a perfect being must be good). That relies on the perfect-being theology and ontological reasoning discussed under [[ontological]] and [[perfect-freedom]].` }
  ],
  replies: [
    { q: "Evil is a privation of good, so a perfectly evil being is impossible.", a: `Even if so, the challenge can be restated with a powerful, malicious (not maximally evil) creator, or an indifferent one. The question is why the evidence supports "good creator" over "malicious" or "indifferent" creator. And on the evidence, an indifferent universe fits best of all.`, k: "evil privation of good perfectly evil god incoherent augustine" }

{
  id: "hiddenness",
  cat: "evil",
  title: "God Is Hidden So That Faith Can Be Free",
  who: "Pascal ('a hidden God,' Pensées); Michael Murray; Daniel Howard-Snyder & Paul Moser (eds.), Divine Hiddenness (2002); Isaiah 45:15",
  claim: `God doesn't make his existence overwhelmingly obvious because that would coerce belief and leave no room for a free, loving response. He gives enough evidence for those who seek him and enough obscurity for those who don't (Pascal). Anyone who truly seeks God will find him (Jeremiah 29:13; Matthew 7:7). Nonbelievers are not really seeking.`,
  short: `John Schellenberg's hiddenness argument: a perfectly loving God would always be open to a personal relationship with every capable creature, so he would ensure that no one who is not resisting is left unable to believe he exists. But there are non-resistant nonbelievers: sincere seekers who lose their faith despite wanting it, people raised in other religions who never encountered the Christian God, and most of the humans who ever lived. So there is no perfectly loving God. Knowing that God exists doesn't coerce love any more than knowing your parents exist does.`,
  points: [
    { h: "Schellenberg's argument", t: `(1) If a perfectly loving God exists, he would always be open to relationship with every finite person capable of it. (2) If so, then no such person would be non-resistantly unaware of God's existence, since belief that God exists is a precondition for relationship. (3) There exist non-resistant nonbelievers. (4) So no perfectly loving God exists. (*Divine Hiddenness and Human Reason*, 1993; *The Hiddenness Argument*, 2015.) This is now one of the most discussed arguments in philosophy of religion.` },
    { h: "Belief is not coercion", t: `Satan and the demons in Christian tradition know God exists and still rebel (James 2:19). The disciples saw miracles and still doubted and betrayed. Adam and Eve walked with God and disobeyed. Knowing that someone exists does not force you to love or obey them. A child who knows her parents exist can still reject them. So making his existence clear would not destroy freedom.` },
    { h: "Non-resistant nonbelief is real", t: `There are many documented cases of people who prayed, studied, and begged for faith, yet lost it. Many former pastors and missionaries are among them (see Dennett & LaScola, "Preachers Who Are Not Believers," 2010). The claim that every nonbeliever is secretly resisting is unfalsifiable, insulting, and contradicted by these testimonies.` },
    { h: "Most humans never had a chance", t: `*Homo sapiens* has existed for roughly 300,000 years. Christianity began 2,000 years ago and reached most of the Americas, Africa, and East Asia only in the last 500. The Population Reference Bureau estimates that around 117 billion humans have ever been born. The large majority lived and died without ever hearing of the Christian God. Their nonbelief can't have been resistance to him (see [[demographics]]).` },
    { h: "The Bible's God was not hidden", t: `In the biblical narratives God speaks audibly, appears in fire, parts seas, and shows himself directly to Moses, Abraham, Paul, and others. If revealing himself doesn't violate freedom then, it doesn't now. The current hiddenness is what we'd expect if those stories are legends and there is no God to reveal himself.` }
  ],
  replies: [
    { q: "Anyone who truly seeks God will find him. You're not seeking hard enough.", a: `That claim can't be tested: whenever a sincere seeker doesn't find God, you conclude they weren't sincere. Many former believers, including pastors and missionaries, prayed for years and lost their faith anyway. And billions of seekers found Allah, Krishna, or the Buddha instead, which is what you'd expect if the "finding" is shaped by culture rather than by God.`, k: "seek and you will find truly seek not seeking hard enough heart closed jeremiah 29 matthew 7" },
    { q: "If God revealed himself clearly, it would force people to believe and take away free will.", a: `Knowing something exists doesn't force anyone to love it. In Christian theology, Satan knows God exists and rebels anyway. The disciples saw miracles daily and still deserted Jesus. Knowledge is the *precondition* of a free relationship, not the end of it.`, k: "reveal himself force belief take away free will coerce faith overwhelming" },
    { q: "There's enough evidence for those who want to believe (Pascal).", a: `That makes belief depend on *wanting* to believe, which is a recipe for believing whatever you prefer. A God who rewards people for wanting to believe on insufficient evidence rewards wishful thinking. And people of every religion say the same thing about theirs.`, k: "enough evidence want to believe pascal enough light enough darkness" }
  ],
  sources: [

{

  cat: "evil",
  title: "The Geography of Belief",
  who: "(Skeptic argument.) Stephen Maitzen, 'Divine Hiddenness and the Demographics of Theism' (Religious Studies, 2006); Philip Kitcher, Life After Faith (2014)",
  claim: `(Apologetic response being challenged:) The distribution of belief reflects human choices, missionary history, and God's mysterious providence. God judges people by the light they had. Geography affects access to the gospel, not the truth of the gospel.`,
  short: `Religious belief is distributed almost entirely by geography and family. A child born in Saudi Arabia will almost certainly become a Muslim, one in Thailand a Buddhist, one in Mississippi a Protestant. If a loving God wanted all people to know him, belief would track sincerity or virtue, not birthplace. The pattern is exactly what we'd expect if religion is a cultural inheritance, and very surprising if one religion is a revelation from a God who wants to be known by everyone.`,
  points: [
    { h: "Maitzen's demographic argument", t: `Theistic belief is extremely unevenly distributed. In Saudi Arabia nearly everyone is a theist; in Thailand, about 95% are Buddhist and non-theistic. If God wanted a relationship with every person, why would whether you believe in him depend so strongly on where you were born? Naturalism predicts this distribution (religion spreads by culture and politics). Theism does not (Maitzen, *Religious Studies* 42, 2006).` },
    { h: "The symmetry of testimony", t: `Philip Kitcher argues that religious believers worldwide have the *same kind* of grounds for their faiths: upbringing, community, and personal experience. These grounds produce incompatible beliefs, so they can't be reliable guides to truth. A Christian who believes because of their upbringing has no epistemic advantage over a Hindu who believes because of theirs (*Life After Faith*, 2014).` },
    { h: "Conversion follows power, not evidence", t: `The map of Christianity follows the Roman Empire, then European colonial empires. The map of Islam follows the Arab conquests and trade routes. Mass conversions in history were often decided by rulers (Constantine; Clovis; Vladimir of Kiev in 988; Charlemagne's forced baptism of the Saxons). A revelation spreading by the routes of political power is what we'd expect from human institutions.` }

{
  id: "hell",
  cat: "evil",
  title: "Hell Is Just",
  who: "Augustine, City of God XXI; Aquinas; Jonathan Edwards; C. S. Lewis, The Great Divorce (1945); Jonathan Kvanvig, The Problem of Hell (1993)",
  claim: `Sin against an infinitely holy God deserves infinite punishment (Anselm, Edwards). Hell is not God's cruelty but the natural consequence of people choosing to reject him: "the doors of hell are locked on the inside" (Lewis). God respects human choice even when people choose separation from him. Jesus himself taught about hell more than anyone else in the Bible.`,
  short: `Eternal conscious torment for finite wrongs committed in a few decades, often by people with no clear knowledge of God, violates any recognizable principle of justice: proportionality, rehabilitation, or mercy. The "infinite offense" principle (the severity of a wrong depends on the status of the one wronged) is rejected in every other context. And the "locked from the inside" view contradicts the biblical texts, which describe people thrown in against their will. Many Christian scholars now reject eternal torment, which shows the doctrine is not even secure within Christianity.`,
  points: [
    { h: "The proportionality problem", t: `No finite set of acts, committed in a finite life, deserves infinite suffering. Stephen Kershnar (2005) and Marilyn McCord Adams (1993) argue that eternal punishment is disproportionate on any plausible theory of desert. Under the doctrine as traditionally taught, a decent person who did not accept Christ suffers for eternity while a murderer who converted on his deathbed enjoys heaven. Justice is not merely strained there; it is reversed.` },
    { h: "The status principle is not a moral principle", t: `Anselm and Edwards argued that sins against an infinite being are infinitely bad. But we don't think that insulting a king is worse than insulting a peasant in any morally relevant sense; that is a feudal intuition. And by this logic, every sin, however small, would deserve infinite punishment, which collapses all moral distinctions among wrongs.` },
    { h: "The biblical texts describe punishment, not choice", t: `The "locked from the inside" picture (Lewis) is not what the New Testament describes. People are *cast* into the outer darkness (Matthew 22:13), *thrown* into the fire (Matthew 13:42, 50), sent away to "eternal punishment" (Matthew 25:46). In Revelation 14:10–11 the damned are "tormented with fire and sulfur in the presence of the holy angels and in the presence of the Lamb," and "the smoke of their torment goes up forever and ever." In Luke 16:24 the rich man pleads for relief and is refused.` },
    { h: "The doctrine has a human history", t: `The Hebrew Bible has no hell: the dead go to Sheol, a shadowy underworld for good and bad alike (Ecclesiastes 9:5, 10; Psalm 6:5). Ideas of post-mortem punishment entered Judaism in the Hellenistic period (1 Enoch; Daniel 12:2, c. 165 BCE), influenced by Persian and Greek ideas. "Gehenna" was the Valley of Hinnom outside Jerusalem, associated with earlier child sacrifice (Jeremiah 7:31). 2 Peter 2:4 even uses the Greek word *Tartarus*. Bart Ehrman's *Heaven and Hell* (2020) traces this development. See [[afterlife-origins]].` },
    { h: "Christians can't agree", t: `Origen and Gregory of Nyssa taught universal reconciliation. Today, annihilationism (the wicked are destroyed, not tormented) is held by evangelicals such as John Stott and Edward Fudge, and universalism has been argued by Orthodox theologian David Bentley Hart (*That All Shall Be Saved*, 2019). Hart argues that eternal torment is incompatible with God's goodness. When a doctrine's own adherents can't agree on whether the punishment is eternal torture, annihilation, or temporary purification, its basis in revelation is weak.` }
  ],
  replies: [
    { q: "People choose hell. God simply respects their choice to be separated from him.", a: `Who would knowingly choose eternal torment? If people "choose" it, they do so under ignorance, doubt, or deception, which makes their choice uninformed and so not fully free. A loving parent doesn't respect a child's choice to walk into a fire. And the New Testament texts describe the damned being *thrown* into fire and *pleading* for relief, not choosing to stay.`, k: "people choose hell respect choice separation locked from inside lewis" },
    { q: "Sin against an infinite God deserves infinite punishment.", a: `The seriousness of a wrong depends on the harm done and the wrongdoer's culpability, not on the rank of the victim. We reject "the higher the status, the worse the crime" for humans. And if every sin deserves infinite punishment, a child's lie and genocide deserve the same, which destroys moral proportion entirely.`, k: "infinite god infinite punishment sin against infinite holy deserve" }
  ],
  sources: [

  claim: `"All Scripture is breathed out by God" (2 Timothy 3:16). The Bible, written by about 40 authors over 1,500 years, has a remarkable unity of message. It is without error in everything it affirms, including history and science. Apparent contradictions dissolve on careful study. Its preservation, prophetic accuracy, and transforming power show it is no ordinary book.`,
  short: `Inerrancy fails on the evidence. The texts contradict each other on matters of fact (genealogies, chronologies, the resurrection accounts). They make claims archaeology and science refute (a global flood, the Exodus, the order of creation). They were edited, combined from sources, and altered by scribes. The Chicago Statement restricts inerrancy to the original manuscripts, which no one has, so the doctrine applies to a text that cannot be checked. "2 Timothy 3:16 says scripture is inspired" is itself a circular argument, from a letter most scholars regard as not written by Paul.`,
  points: [
    { h: "Inerrancy applies only to texts nobody has", t: `Article X of the Chicago Statement (1978) affirms that "inspiration, strictly speaking, applies only to the autographic text of Scripture." No autograph survives. What survives are copies that differ from one another in hundreds of thousands of places (see [[textual-variants]]). Textual critics now aim to reconstruct the "initial text" from which the surviving tradition descends, not the autograph itself (see [[textual-variants]]). A doctrine of perfection that applies only to documents we can't examine can't be confirmed or refuted by evidence.` },
    { h: "Unity is overstated", t: `The Bible's books disagree about core questions. Is there an afterlife (Ecclesiastes 9:5 versus Daniel 12:2)? Is the Law permanent (Matthew 5:18) or obsolete (Hebrews 8:13; Romans 10:4)? Are we justified by faith apart from works (Romans 3:28) or "not by faith alone" (James 2:24)? Does God punish children for their parents' sins (Exodus 20:5) or not (Ezekiel 18:20)? Was Jesus divine from the beginning (John 1:1) or adopted at his baptism or resurrection (Mark 1:11; Romans 1:4; Acts 13:33)? Unity was largely imposed by later readers who harmonized these texts.` },
    { h: "Composite authorship", t: `The Pentateuch combines multiple sources (classically J, E, D, and P), which shows in duplicate stories, doublets, and changing divine names (see [[genesis-creation]] and [[flood]]). Isaiah is the work of at least two, probably three authors across two centuries (chapters 1–39, 40–55, 56–66). Daniel was written in the 160s BCE, not the 6th century (see [[daniel]]). Several New Testament letters are pseudonymous (see [[pseudepigrapha]]). These are mainstream conclusions of critical scholarship, including among many Christian scholars.` },
    { h: "Self-attestation is circular", t: `"The Bible says it is inspired" is evidence of nothing; the Quran and the Book of Mormon make the same claim about themselves. 2 Timothy 3:16 referred to Jewish scriptures, not the New Testament, which didn't exist as a collection yet. And 2 Timothy is widely regarded as pseudonymous, so a letter falsely claiming to be by Paul is being used to establish the truthfulness of scripture.` },
    { h: "Even evangelical scholars are abandoning strict inerrancy", t: `Peter Enns (*Inspiration and Incarnation*, 2005; *The Bible Tells Me So*, 2014), Kenton Sparks (*God's Word in Human Words*, 2008), and Christian Smith (*The Bible Made Impossible*, 2011) are Christian scholars who reject inerrancy because of the evidence. The doctrine as formulated in Chicago is a late-19th to 20th century American evangelical development (Warfield and Hodge at Princeton), not the historical consensus of the church.` }

{
  id: "contradictions",
  cat: "bible",
  title: "There Are No Real Contradictions in the Bible",
  who: "Gleason Archer, Encyclopedia of Bible Difficulties (1982); Norman Geisler & Thomas Howe, When Critics Ask (1992); Mike Licona",
  claim: `Alleged contradictions are misreadings. Differences between accounts reflect different perspectives, emphases, and audiences, as with eyewitness testimonies in court. Differences even show the witnesses didn't collude. Every apparent contradiction has a plausible harmonization.`,
  short: `Some differences are minor and harmonizable. Many are not, unless one adds events the texts don't mention. Two incompatible genealogies, two incompatible birth narratives, different days for the crucifixion, two incompatible deaths for Judas, and resurrection accounts that disagree about who went to the tomb, what they saw, and where Jesus appeared. Evangelical scholar Mike Licona (*Why Are There Differences in the Gospels?*, 2017) concludes that the evangelists sometimes deliberately changed details, which is a concession that the texts are not straightforward reports.`,
  points: [
    { h: "Two genealogies of Jesus", t: `Matthew 1 traces Jesus through Solomon, with Joseph's father named Jacob. Luke 3 goes through Nathan, with Joseph's father named Heli. Between David and Jesus, Matthew has 28 generations; Luke has 41 or so. Matthew's neat "three sets of fourteen" (1:17) requires skipping four kings who appear in 1 Chronicles 3:11–12 (Ahaziah, Joash, Amaziah, and Jehoiakim). The common harmonization, that Luke gives Mary's genealogy, has no support in the text: Luke 3:23 explicitly names Joseph. It was proposed by Annius of Viterbo around 1490. Earlier harmonizers (Julius Africanus, c. 220) proposed a theory of levirate marriages.` },
    { h: "When was Jesus crucified?", t: `In Mark (14:12–17), Jesus eats the Passover meal with his disciples and is crucified the next day. In John (19:14), he is crucified on "the day of Preparation for the Passover," at noon, before the Passover meal, at the time the Passover lambs were slaughtered. That fits John's theology (Jesus as the Lamb of God, 1:29; no bone broken, 19:36). Licona argues John deliberately changed the day for theological reasons. Either way, both cannot be literally right.` },
    { h: "The death of Judas", t: `Matthew 27:3–8: Judas returns the silver, the priests buy the potter's field, and Judas hangs himself. Acts 1:18: Judas himself buys a field with the money, falls headlong, bursts open, and his bowels gush out. The harmonization (he hanged himself, the rope broke, he fell and burst) requires inventing details, and it still doesn't explain who bought the field.` },
    { h: "The resurrection accounts", t: `Who went to the tomb: Mary Magdalene alone (John 20:1); two Marys (Matthew 28:1); two Marys and Salome (Mark 16:1); or the Marys, Joanna, and "the other women" (Luke 24:10)? Was the stone already rolled away (Mark, Luke, John), or did an angel roll it back in an earthquake as they watched (Matthew)? One young man (Mark), one angel (Matthew), two men (Luke), or two angels (John)? Did the women tell no one (Mark 16:8) or run to tell the disciples (Matthew 28:8)? Did Jesus appear first in Galilee (Matthew 28:16; Mark 16:7) or in and around Jerusalem, with the disciples told to stay in the city (Luke 24:49; Acts 1:4)? See [[legendary-growth]].` },
    { h: "Hebrew Bible examples", t: `Who incited David's census: God (2 Samuel 24:1) or Satan (1 Chronicles 21:1)? How many stalls for horses did Solomon have: 40,000 (1 Kings 4:26) or 4,000 (2 Chronicles 9:25)? How old was Ahaziah when he became king: 22 (2 Kings 8:26) or 42 (2 Chronicles 22:2), which would make him two years older than his father? Who killed Goliath: David (1 Samuel 17) or Elhanan (2 Samuel 21:19)? The Chronicler "fixed" the last one by making Elhanan kill Goliath's brother (1 Chronicles 20:5).` },
    { h: "The 'independent witnesses' argument backfires", t: `Apologists say minor differences show independence. But Matthew and Luke are *not* independent of Mark. They copy him, often word for word in Greek (see [[synoptic-dependence]]). Their differences from Mark are deliberate editorial changes, not independent memories. Redaction criticism shows the changes follow each author's theological interests: Matthew adds fulfillment formulas, Luke centers Jerusalem, John heightens Jesus' divinity.` }
  ],
  replies: [
    { q: "Luke's genealogy is Mary's line, so there's no contradiction.", a: `Luke 3:23 says Jesus was "the son (as was supposed) of Joseph, the son of Heli." The text names Joseph, not Mary, and Jewish genealogies traced paternal lines. The Mary theory first appears around 1490 (Annius of Viterbo). Earlier church fathers tried a completely different solution (Africanus's levirate marriages), which shows they also saw the conflict and that no tradition of a "Mary's line" existed.`, k: "genealogy mary's line luke heli joseph father in law" },
    { q: "Different perspectives are natural. Eyewitnesses always differ in details.", a: `Differences in perspective don't produce incompatible facts: Galilee versus Jerusalem, before Passover versus after, hanging versus bursting open. And these authors aren't independent eyewitnesses. Matthew and Luke copy Mark's Greek wording, then change it. The changes are editorial decisions, which is what redaction critics study.`, k: "different perspectives eyewitness differ details court testimony" }

  cat: "bible",
  title: "The New Testament Is the Best-Attested Ancient Text",
  who: "Josh McDowell, Evidence That Demands a Verdict (1972; 2017 ed.); F. F. Bruce; Daniel Wallace; Wes Huff",
  claim: `There are over 5,800 Greek manuscripts of the New Testament, plus over 10,000 Latin and thousands in other languages, many more than for any other ancient text. We have only a handful of copies of Caesar's Gallic Wars or Tacitus, made centuries after the originals. The earliest NT fragment (P52) is within decades of the original. If we trust classical texts, we must trust the New Testament even more.`,
  short: `Manuscript abundance tells us something about how well we can reconstruct *what was written*, not about whether what was written is *true*. Nobody believes Tacitus's report that Vespasian healed a blind man, however good Tacitus's manuscripts are. And the comparison is overstated: most NT manuscripts are medieval (after the 9th century); the papyri before 300 CE are mostly fragments; P52's dating is less certain than often claimed; and the first 150 years of transmission, when changes were most likely, are almost entirely undocumented.`,
  points: [
    { h: "Copies don't validate content", t: `Thousands of manuscripts show only that Christians copied their scriptures widely. They can't tell us whether the events described occurred. The Quran and the Book of Mormon are also well preserved. Tacitus's *Histories* (4.81) and Suetonius (*Vespasian* 7) report that Vespasian healed a blind man with his spittle and a lame man in Alexandria, with good manuscript support, and no one accepts the miracles. A text accurately preserved can still be legend.` },
    { h: "Most manuscripts are late", t: `Of the 5,800 or so catalogued Greek manuscripts, the large majority date from the 9th century or later. The number from before 300 CE is small (a few dozen papyri), mostly fragments. The earliest complete New Testament, Codex Sinaiticus, dates to the mid-4th century. The impressive total mostly reflects medieval Byzantine copying, which is late and largely descends from a standardized text.` },
    { h: "P52 is a tiny scrap of uncertain date", t: `P52 (Rylands Papyrus 457) is the size of a credit card and contains parts of a few verses of John 18. Its frequently cited date of c. 125 CE is based only on handwriting comparison. Papyrologist Brent Nongbri (*Harvard Theological Review*, 2005; *New Testament Studies*, 2020) showed that the comparable handwriting samples span from the late 1st to the early 3rd century, so P52 cannot be dated more precisely than that range. Nongbri has argued that dates for P66 and P75 are also likely later than often claimed.` },
    { h: "The 'dark period' is the critical one", t: `The decades between the originals (c. 50–110 CE) and the earliest substantial manuscripts (c. 200 and later) are the period with the least evidence and the most freedom in copying, before texts were standardized. Helmut Koester and David Parker (*The Living Text of the Gospels*, 1997) argue that the Gospels were especially fluid in this period. The abundance of later manuscripts can't show what happened before them.` },
    { h: "The classical comparison is misleading", t: `Classical historians don't claim their texts are inerrant or that they report miracles accurately. They read them critically, weighing bias and legend, and often doubt them. Applying that same standard to the New Testament, which is what critical scholars do, is fully consistent. Demanding *more* trust in the NT because it has more copies inverts the reasoning.` }

{

  cat: "bible",
  title: "Textual Variants Don't Affect Any Doctrine",
  who: "Daniel Wallace; Bruce Metzger; Peter Williams; Dan Wallace vs. Bart Ehrman debates (2008, 2011)",
  claim: `Yes, there are many textual variants, but over 99% are trivial: spelling, word order, obvious slips. Textual critics can reconstruct the original text with high confidence, and no doctrine of the Christian faith depends on a disputed reading.`,
  short: `The number of variants (an estimated 500,000, more than the number of words in the New Testament) matters less than their location. Several significant passages were added or changed: the ending of Mark, the woman caught in adultery, the only explicit Trinity verse, Jesus sweating blood. These show that scribes changed the text for theological reasons. More fundamentally, the goal of modern textual criticism is now explicitly the "initial text" from which surviving manuscripts descend, which is not necessarily the original. The claim to have "the original text" overstates what the discipline itself claims.`,
  points: [
    { h: "How many?", t: `Peter Gurry (*New Testament Studies*, 2016) estimated about 500,000 non-spelling variants in Greek manuscripts, more than earlier estimates. The Greek New Testament has about 138,000 words. Most variants are trivial. But a large number of trivial variants does not cancel the significance of the important ones.` },
    { h: "Additions that matter", t: `**Mark 16:9–20** (the resurrection appearances, snake-handling, and the Great Commission in Mark) is absent from the two oldest complete manuscripts, Sinaiticus and Vaticanus. Mark originally ended at 16:8, with the women fleeing and telling no one. **John 7:53–8:11** (the woman caught in adultery, "let him who is without sin cast the first stone") is absent from the earliest manuscripts and appears in different places in later ones, even after Luke 21:38. **1 John 5:7–8**, the Johannine Comma and the only explicit statement of the Trinity, is a Latin addition absent from Greek manuscripts before the 2nd millennium. **Luke 22:43–44** (sweating blood) is absent from several early manuscripts. These are now marked or bracketed in modern Bibles.` },
    { h: "Theologically motivated changes", t: `Bart Ehrman (*The Orthodox Corruption of Scripture*, 1993; 2nd ed. 2011) documents changes made to strengthen orthodox Christology against adoptionists and others. Examples: Luke 3:22, where some early witnesses read "You are my son; today I have begotten you" (quoting Psalm 2:7, which suggests adoption at baptism); John 1:18, "the only-begotten God" versus "the only-begotten Son"; 1 Timothy 3:16, "God was manifested in the flesh" versus "who was manifested"; and Matthew 24:36, where some manuscripts omit that even "the Son" doesn't know the hour. Mark 1:41 may originally have said Jesus was "angry" rather than "moved with compassion."` },
    { h: "From 'original text' to 'initial text'", t: `The leading project in the field, the *Editio Critica Maior* using the Coherence-Based Genealogical Method, aims at the *Ausgangstext* or "initial text": the hypothetical text from which the surviving tradition derives. It explicitly does not claim this is the authorial original (Holmes, 2013; Epp, 1999, "The Multivalence of the Term 'Original Text'"). If there were changes before the earliest common ancestor of the surviving manuscripts, we have no way to detect them.` },
    { h: "Why this matters for inerrancy", t: `If God inspired an inerrant text but didn't preserve it, why inspire it at all? The surviving text does not need to be wildly corrupt for this to be a problem. It needs only to be uncertain in places, which it demonstrably is, for the claim of a perfectly preserved revelation to fail.` }
  ],
  replies: [
    { q: "99% of variants are spelling errors and don't matter.", a: `That's true of most variants, and textual critics agree. But "most variants are trivial" isn't the issue. Several of the remaining ones affect whole passages: Mark's resurrection appearances, the adulterous woman story, the Johannine Comma. And they reveal scribes willing to change the text for theological reasons, which is significant for how we understand the early history of the text.`, k: "99% variants spelling trivial insignificant don't matter no doctrine affected" },
    { q: "We can reconstruct the original text with near certainty.", a: `Leading textual critics no longer claim that. The *Editio Critica Maior* aims at the "initial text," the text behind the surviving tradition, not necessarily what the author wrote. Eldon Epp and Michael Holmes explain why the "original text" is a problematic target. Changes before the earliest surviving ancestor are undetectable.`, k: "reconstruct original text near certainty autographs we know what they wrote" }

  cat: "bible",
  title: "The Canon Was Recognized, Not Invented",
  who: "Michael Kruger, Canon Revisited (2012); F. F. Bruce, The Canon of Scripture (1988)",
  claim: `The church didn't create the canon. It recognized books that were self-evidently inspired, apostolic, and widely used. The core of the New Testament, the four Gospels and Paul's letters, was accepted by the mid-2nd century. The Holy Spirit guided the church to recognize the right books.`,
  short: `The canon's boundaries were disputed for centuries. Several books now included were long doubted (Hebrews, James, 2 Peter, 2–3 John, Jude, Revelation), and books now excluded were read as scripture in many churches (the Shepherd of Hermas, the Epistle of Barnabas, 1 Clement). The first list matching our 27 books exactly is Athanasius's in 367 CE. Christians still don't agree: Protestant, Catholic, Orthodox, and Ethiopian Bibles differ. A canon the Holy Spirit made "self-evident" should not have taken 300 years and still produced several versions.`,
  points: [
    { h: "Disputed books", t: `Eusebius (*Ecclesiastical History* 3.25, c. 325) classified James, Jude, 2 Peter, and 2–3 John as "disputed," and Revelation as either accepted or spurious depending on whom one asked. Hebrews was long doubted in the West because its authorship was unknown. In the 16th century, Luther called James "an epistle of straw" and placed Hebrews, James, Jude, and Revelation at the end of his Bible as of lesser status.` },
    { h: "Excluded books that were read as scripture", t: `Codex Sinaiticus (4th century) includes the Epistle of Barnabas and the Shepherd of Hermas after Revelation. Codex Alexandrinus (5th century) includes 1 and 2 Clement. The Muratorian Fragment lists the Wisdom of Solomon and the Apocalypse of Peter. Its date is disputed: traditionally late 2nd century, but argued by Sundberg (1973) and Hahneman (1992) to be 4th century. Irenaeus quoted the Shepherd as "scripture."` },
    { h: "Several canons, still", t: `The Protestant Old Testament has 39 books; the Catholic has 46, including the deuterocanonicals affirmed at Trent (1546); the Eastern Orthodox add others (1 Esdras, 3 Maccabees, Psalm 151). The Ethiopian Orthodox Tewahedo Church's broader canon includes 1 Enoch and Jubilees, which Jude 14–15 quotes as prophecy. If the Spirit guided recognition, he guided different churches to different results.` },
    { h: "Recognition criteria were human judgments", t: `The criteria used were apostolic authorship, orthodoxy, and widespread use. Apostolic authorship was often mistaken (the Gospels are anonymous, and several letters are pseudonymous; see [[pseudepigrapha]]). Orthodoxy is circular: books were accepted because they agreed with the theology that was winning. Widespread use reflects the influence of particular churches (Rome, Alexandria).` }

{
  id: "gospel-authorship",
  cat: "bible",
  title: "The Gospels Were Written by Eyewitnesses or Their Associates",
  who: "Papias (via Eusebius, c. 325); Irenaeus, Against Heresies 3.1.1 (c. 180); Craig Blomberg; Brant Pitre, The Case for Jesus (2016)",
  claim: `Early church tradition is unanimous: Matthew (the tax collector apostle), Mark (Peter's interpreter), Luke (Paul's physician companion), and John (the beloved disciple) wrote the Gospels. Papias, writing early in the 2nd century, says Mark recorded Peter's preaching. No anonymous Gospel manuscripts survive. Unanimous titles prove authorship was known from the start.`,
  short: `The Gospels are anonymous: none names its author, and three never claim eyewitness status. Names were attached by the late 2nd century, and Irenaeus (c. 180) is the first to name all four. Papias's testimony, the earliest, does not describe the texts we have: he says Matthew wrote "sayings" in Hebrew, while our Matthew is in Greek and copies Greek Mark. The authors wrote fluent Greek decades later, far from Galilee, while the disciples were Aramaic-speaking fishermen described in Acts as "unlettered." Most critical scholars date Mark around 70 CE and John around 90–110.`,
  points: [
    { h: "Anonymous texts", t: `The titles "According to Matthew," etc., are not part of the texts. They appear in manuscripts from around 200 (P66 and P75) and are standardized in a way that suggests they were added when the Gospels were collected together, to distinguish them. The texts never use "I" for the author except Luke's prologue (which says the author is *not* an eyewitness, but gathered traditions "handed down" by eyewitnesses; Luke 1:1–4) and John 21:24, an editorial note from a group ("we know that his testimony is true") about the beloved disciple.` },
    { h: "Papias does not describe our Gospels", t: `Papias (quoted in Eusebius, *Ecclesiastical History* 3.39) says Matthew "compiled the sayings (*logia*) in the Hebrew language, and each translated them as he was able." Our Matthew is not a collection of sayings, was composed in Greek, and incorporates nearly all of Greek Mark, often word for word. An eyewitness apostle would not need to copy a non-eyewitness's account of his own calling (Matthew 9:9, copied from Mark 2:14 with "Levi" changed to "Matthew"). Papias says Mark wrote Peter's teaching "not in order," but our Mark is carefully ordered. And Papias got his information secondhand from an "elder."` },
    { h: "Language, education, and distance", t: `The authors write in competent Greek. Luke's prologue is in polished literary Greek, and John's Greek is simple but fluent. Peter and John are described in Acts 4:13 as *agrammatoi*, "unlettered" or illiterate. Literacy in Roman Palestine is estimated at around 3% or less (Hezser, 2001; Bar-Ilan, 1992), and much lower among rural Galilean laborers. The Gospels also show unfamiliarity with Palestinian geography in places (Mark 7:31's odd route; Mark 5:1's Gerasa, about 50 km from the sea).` },
    { h: "Dates", t: `Mark describes the destruction of the Temple (13:2) in terms that reflect the events of 70 CE, and most scholars date it around 70. Matthew and Luke use Mark, so they're later, around 80–90. Luke 21:20 makes the siege of Jerusalem explicit ("when you see Jerusalem surrounded by armies"). John is usually dated 90–110. Some scholars (Pervo, 2006; Tyson) date Luke-Acts to the early 2nd century. That puts 40 to 70 years between Jesus and the Gospels, written in another language and in other places.` },
    { h: "Even conservative scholars hedge", t: `Many evangelical scholars now accept that Matthew was not written by the apostle in its present form, and that the Gospel of John went through stages of composition with a community behind its final form. The Catholic Church's New American Bible notes acknowledge the Gospels' anonymity and post-70 dating for most of them.` }
  ],
  replies: [
    { q: "There are no anonymous copies of the Gospels. All manuscripts carry the traditional titles.", a: `All our manuscripts with the beginnings preserved date from around 200 or later, when the four-Gospel collection already existed and needed titles to tell its books apart. That shows the titles were standard *by then*, not that the authors wrote them. Justin Martyr (c. 150) quotes the Gospels repeatedly but calls them "memoirs of the apostles," without naming any author, which suggests the names weren't yet firmly attached.`, k: "no anonymous copies titles all manuscripts unanimous attribution" },
    { q: "Why would the church attribute Gospels to minor figures like Mark and Luke if they were making it up?", a: `Because these attributions came with a story connecting them to apostles: Mark to Peter, Luke to Paul. Minor figures with apostolic connections explained how non-apostolic texts had apostolic authority. Plenty of forged texts were attributed to central figures (the Gospel of Peter, the Gospel of Thomas), so attribution patterns don't settle authorship either way.`, k: "why attribute to mark luke minor figures not apostles made up" }

  title: "The Gospels Are Four Independent Witnesses",
  who: "Popular apologetics; Simon Greenleaf, The Testimony of the Evangelists (1846); J. Warner Wallace, Cold-Case Christianity (2013)",
  claim: `We have four independent biographies of Jesus that agree on all the essentials. In a court, four independent witnesses agreeing on the main facts would be compelling evidence. The differences in detail show they didn't collude.`,
  short: `The first three Gospels are not independent. Matthew reproduces about 90% of Mark and Luke over half, often in identical Greek word order, which shows literary copying, not independent memory. Most scholars think John knew at least the Synoptic traditions, and some think he knew Mark or Luke directly. So the "four witnesses" reduce largely to one, Mark, which was edited and expanded by others with their own theological aims.`,
  points: [
    { h: "Verbatim Greek agreement", t: `Matthew uses about 600 of Mark's 661 verses. Long sequences agree word for word in Greek: compare Mark 2:10–11, Matthew 9:6, and Luke 5:24, where all three break off mid-sentence in the same way ("so that you may know that the Son of Man has authority on earth to forgive sins — he said to the paralytic"). That parenthetical aside could not come from independent memory of a spoken event. It's a written text being copied.` },
    { h: "Agreement in order", t: `Matthew and Luke follow Mark's order of episodes. Where they depart from it, they rarely agree with each other against Mark. This pattern is the main evidence for Markan priority, accepted by the large majority of scholars.` },
    { h: "Editorial changes reveal motives", t: `Mark 6:5: Jesus "could do no deed of power" in Nazareth. Matthew 13:58 changes it to "did not do many deeds of power." Mark 10:18: "Why do you call me good? No one is good but God alone." Matthew 19:17 changes it to "Why do you ask me about what is good?" Mark 4:38: the disciples ask "do you not care that we are perishing?" Matthew 8:25 softens it to "save us, Lord." These are not different memories. They are later authors correcting a source they found theologically awkward.` },
    { h: "The 'Q' material and the Farrer alternative", t: `Material shared by Matthew and Luke but absent from Mark is attributed to a lost source, "Q," or, on the Farrer hypothesis (Goodacre, 2002), to Luke's use of Matthew. Either way, it's more literary dependence. On neither hypothesis do we have four independent accounts.` }

{
  id: "eyewitnesses",
  cat: "bible",
  title: "Jesus and the Eyewitnesses (Bauckham)",
  who: "Richard Bauckham, Jesus and the Eyewitnesses (2006; 2nd ed. 2017)",
  claim: `The Gospels are close to eyewitness testimony. Personal names in the Gospels match the frequency of names in 1st-century Palestine (Tal Ilan's lexicon), suggesting accurate local knowledge. Named minor characters (Bartimaeus, Simon of Cyrene's sons Alexander and Rufus) were the eyewitness sources the evangelists cited. The "inclusio" literary device marks Peter as Mark's main source. Ancient historians valued eyewitness testimony, and the Gospels belong to that genre.`,
  short: `Bauckham's work is learned but its conclusions have not persuaded most specialists. Name frequencies show only that the traditions arose in Palestine, which no one disputes. The named-characters-as-sources thesis is speculative. And the psychology of memory shows that even eyewitness testimony is reconstructive, vulnerable to suggestion, and conformed to group retellings, especially over decades. Eyewitness memory, even if present, would not guarantee accuracy about miracles.`,
  points: [
    { h: "Memory science", t: `Elizabeth Loftus's research shows that eyewitness memory is reconstructive and can incorporate false details from questioning, discussion, and expectation. Bartlett's classic "serial reproduction" studies (1932) showed stories changing to fit the retellers' cultural expectations. Judith Redman (*Journal of Biblical Literature*, 2010) applied this research directly to Bauckham's thesis and concluded that eyewitness origins would not secure accuracy. Bart Ehrman's *Jesus Before the Gospels* (2016) draws on memory studies to make the same point.` },
    { h: "Names show location, not accuracy", t: `That Gospel names match common Palestinian name frequencies shows the traditions circulated among people familiar with Palestinian naming. It doesn't distinguish accurate eyewitness memory from legends that developed in Palestine. Later apocryphal texts set in Palestine also use common names.` },
    { h: "Speculative identifications", t: `There's no evidence that Bartimaeus or Alexander and Rufus were sources. Mark doesn't say so. Bauckham infers it from the fact that they're named. Named characters in narratives are also a common literary device. The "inclusio" (Peter named first and last) is a pattern that can be found or not depending on how one counts.` },
    { h: "Even eyewitnesses misreport miracles", t: `Thousands of eyewitnesses at Fatima in 1917 reported the sun dancing, but no observatory recorded anything (see [[fatima]]). Eyewitness testimony to Sathya Sai Baba's materializations and to Marian apparitions is abundant. The problem with the Gospels isn't only that they're distant from eyewitnesses. Even direct eyewitness testimony to miracles is weak evidence, because people sincerely misperceive and misremember extraordinary events.` }
  ],
  replies: [
    { q: "In the ancient world, eyewitnesses were still alive to correct false stories.", a: `There's no evidence that anyone checked the Gospels against eyewitnesses, and much against it: Mark was written about 40 years later, around 70 CE, after the Jewish War, probably outside Palestine, for Greek-speaking audiences who had no way to consult Galilean witnesses. Living eyewitnesses also didn't stop legends from forming around Sabbatai Zevi, the Lubavitcher Rebbe, or many 20th-century saints and gurus.`, k: "eyewitnesses still alive correct false stories hostile witnesses" }

  id: "undesigned-coincidences",
  cat: "bible",
  title: "Undesigned Coincidences Prove the Gospels Are Reliable",
  who: "J. J. Blunt, Undesigned Coincidences (1847); Lydia McGrew, Hidden in Plain View (2017); Tim McGrew",
  claim: `The Gospels interlock in ways no forger would design. In John 6:5, Jesus asks *Philip* where to buy bread. Why Philip? John 1:44 says Philip came from Bethsaida, and Luke 9:10 places the feeding near Bethsaida. These incidental fits between accounts show they draw on real events known in detail by truthful reporters.`,
  short: `Some interlocks are interesting, but the method has serious problems. Texts that share oral traditions and literary sources will fit together in places for that reason alone. Coincidences are found by searching large texts for fits while ignoring the many mismatches (see [[contradictions]]). And the same method would "authenticate" other ancient narratives that contain fantastic elements. Even within evangelical scholarship, Lydia McGrew's "reportage model" is sharply criticized, for example by Mike Licona, who holds that the evangelists used compositional devices that changed details.`,
  points: [
    { h: "Shared traditions explain shared details", t: `If John knew the traditions behind Luke, or Luke's Gospel itself, the "Bethsaida" connection is unsurprising. Most scholars think John had some knowledge of Synoptic traditions. An undesigned coincidence shows that two texts share background information, not that either is historically accurate.` },
    { h: "Selection bias", t: `Gospels with thousands of details will produce some unplanned fits by chance. Collecting them while setting aside the many discrepancies is cherry-picking. A fair test would compare the rate of fits to the rate of conflicts, and the conflicts are many and serious.` },
    { h: "It proves too much", t: `Ancient texts with miraculous content, such as Philostratus's *Life of Apollonius* or the hagiographies of saints, contain similar internal fits. Even if the method shows that a narrative is rooted in real people and places, it doesn't show that the miraculous claims are true. The question was never whether Jesus, Philip, and Bethsaida existed.` },
    { h: "Evangelicals disagree with it", t: `McGrew's book *The Mirror or the Mask* (2019) criticizes Licona and other evangelical scholars for accepting that the Gospel writers altered facts. That this dispute exists within conservative scholarship shows how contested the "straightforward reportage" view is.` }
  ],
  replies: [
    { q: "A forger wouldn't plant such subtle connections, so these must be true memories.", a: `No one is proposing forgers. The view of most scholars is that the Gospels are products of communities passing on and developing traditions. Such traditions naturally carry shared details about places and people. The coincidences fit that model as well as yours, and the contradictions fit only that model.`, k: "forger wouldn't plant subtle connections true memories undesigned" }
