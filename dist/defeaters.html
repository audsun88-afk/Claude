{
  id: "consciousness",
  cat: "god",
  title: "The Argument from Consciousness",
  who: "J. P. Moreland, Consciousness and the Existence of God (2008); Richard Swinburne, The Evolution of the Soul (1986); Robert Adams",
  claim: `Conscious experience, the felt quality of seeing red or feeling pain, cannot be explained by matter in motion. Physical science describes structure and dynamics, but consciousness is something over and above these. The emergence of consciousness from unconscious matter is inexplicable on naturalism and expected on theism, since the ultimate reality is itself a conscious mind. So consciousness is evidence for God.`,
  short: `The hard problem of consciousness is real, but an unsolved problem is not evidence for a particular supernatural answer. Theism does not explain consciousness either: "a mind created minds" restates the mystery. Meanwhile, the overwhelming evidence that consciousness depends on brains (lesions, anesthesia, neurochemistry, development, decline) counts *against* minds that exist without brains. That is exactly the kind of mind God is supposed to be.`,
  points: [
    { h: "A gap is not a God", t: `Neither the theist nor the naturalist has a *mechanistic* account of why some physical processes are experienced. Every historical "only God can explain X" (lightning, disease, the variety of life, the motions of the planets) has been replaced by natural explanations. Theism does not offer a mechanism either. "God made it so" is not an explanation of *how* experience arises from anything, physical or otherwise.` },
    { h: "Mind depends on brain", t: `Every change in consciousness we can measure is correlated with a change in the brain: anesthetics switch it off, strokes remove specific capacities (language, face recognition, moral judgment), psychedelics alter it, dementia dismantles personality, and development builds it up gradually. The most economical inference is that consciousness is something brains do. That makes a disembodied, omniscient, eternal consciousness, God, the most unlike anything in our evidence (see [[disembodied-mind]] and Augustine & Martin, *The Myth of an Afterlife*, 2015).` },
    { h: "Naturalism has real options", t: `Philosophy of mind offers physicalist identity theories, functionalism, illusionism (Frankish, Dennett), and Russellian monism or panpsychism (Strawson, Goff). The last two treat experience as a fundamental feature of matter, which removes the "emergence from nothing" problem without any God. The hard problem is a research problem, not a dead end.` },
    { h: "Even dualism wouldn't get you to God", t: `If consciousness were a non-physical property, that would show that reality contains more than physics describes. It would not show that there is a personal Creator. Dualism is compatible with atheism (many Buddhists and Jains are dualist atheists), and property dualism is compatible with naturalism (Chalmers' "naturalistic dualism").` },
    { h: "Theism makes the wrong predictions", t: `If consciousness came from a divine mind, why does it appear only late, only in complex nervous systems, only after long evolutionary development, and only in a gradient (from nematodes to mammals) that tracks neural complexity? This is what we'd expect if consciousness is a biological phenomenon. It is surprising if it is a gift from a pre-existing mind who could have given it to anything.` }
  ],
  replies: [
    { q: "Science will never explain qualia. It's a category error.", a: `Perhaps, though "never" has a poor track record. But even a permanent explanatory gap only shows the limits of our understanding. It doesn't give us positive evidence that a personal God exists. Panpsychism and Russellian monism, for instance, take qualia as fundamental without any God at all.`, k: "qualia never explain category error what it is like hard problem chalmers" },
    { q: "Near-death experiences prove consciousness survives without the brain.", a: `The best prospective tests of that claim, the AWARE studies, found no verified case of "seeing" hidden targets during cardiac arrest. See [[nde]].`, k: "near death experience out of body consciousness survives brain death" }
  ],
  sources: [
    "Moreland, J. P. (2008). Consciousness and the Existence of God. Routledge.",

  ],

},
{
  id: "argument-from-reason",
  cat: "god",
  title: "The Argument from Reason and Plantinga's EAAN",
  who: "C. S. Lewis, Miracles (1947, rev. 1960); Victor Reppert, C. S. Lewis's Dangerous Idea (2003); Alvin Plantinga, Warrant and Proper Function (1993), Where the Conflict Really Lies (2011)",
  claim: `If naturalism and evolution are both true, our cognitive faculties were shaped for survival, not truth. Evolution cares about adaptive behavior, not true belief. So the probability that our faculties are reliable, given naturalism and evolution, is low or inscrutable. Anyone who accepts naturalism and evolution therefore has a defeater for all their beliefs, including naturalism itself. Naturalism is self-defeating. Lewis's version: if thoughts are just the product of non-rational causes, we have no reason to trust them.`,
  form: ["P(our faculties are reliable | naturalism & evolution) is low or inscrutable.", "Anyone who accepts N&E and sees this has a defeater for the belief that their faculties are reliable.", "That defeater spreads to every belief, including N&E itself.", "So N&E is self-defeating and cannot rationally be accepted."],
  short: `True beliefs are, on the whole, more useful than false ones for an organism that has to find food, avoid predators, and navigate a social world. So selection favors reliable belief-forming faculties within the domains that matter for survival. Plantinga's argument works only if belief *content* has no effect on behavior, which is semantic epiphenomenalism, and most naturalists reject it. Fitelson and Sober (1998) found technical problems in the probability reasoning. And we actually do find our faculties unreliable exactly where evolution predicts they would be: in abstract, statistical, and long-range reasoning.`,
  points: [
    { h: "Truth tracks fitness", t: `An animal that believes "there is a lion" when there is a lion, and acts accordingly, does better than one whose beliefs are disconnected from its surroundings. Plantinga's examples, such as a hominid who wants to be eaten but believes running away is the way to get eaten, need fantastically gerrymandered combinations of beliefs and desires. Simple, general, reliable belief formation is cheaper for an organism than vast compensating systems of error (Ramsey, 2002; Draper, 2002; Law, 2012).` },
    { h: "The argument assumes content doesn't cause behavior", t: `If the *content* of a belief, what it is about, is causally relevant to behavior, as teleosemantic theories of content hold (Millikan, Papineau), then selection acts on content and true content is favored. Plantinga's argument needs semantic epiphenomenalism, or a reductive materialism in which content "floats free" of the physical properties that cause behavior. Naturalists can reject both.` },
    { h: "Probability problems", t: `Fitelson and Sober (1998) showed that Plantinga's formal reasoning mixes up the probability of reliability given N&E in general with the probability given our total evidence. They also showed that "inscrutable" probabilities do not generate defeaters the way he claims. Once we condition on what we know about our own success (predicting eclipses, building aircraft), the reliability of our faculties is very well confirmed.` },
    { h: "We have exactly the reliability evolution predicts", t: `Our perception and everyday reasoning are good. Our intuitive statistics (base-rate neglect), probability (gambler's fallacy), physics (impetus intuitions), and agency detection (seeing faces in clouds, gods in storms) are systematically bad, as Kahneman and Tversky's research program documents. That pattern fits evolution, which built faculties for medium-sized survival problems. It fits poorly with faculties designed by an omniscient God for truth.` },
    { h: "It defeats theism too", t: `If we cannot trust our faculties without first knowing they were designed, the theist has to rely on those same faculties to arrive at "God designed my faculties." That is circular. Any skeptical argument strong enough to defeat naturalism also defeats the theist's reasoning toward God. Descartes faced this problem in the "Cartesian circle."` }
  ],
  replies: [
    { q: "If your brain is just chemicals, why trust it to reason correctly?", a: `Because the chemicals are organized into a system that was shaped by billions of selection events in which tracking reality mattered, and because we can *check* it: our predictions about eclipses, bridges, and vaccines succeed. Being made of chemicals is not a strike against a calculator either. What matters is how a system is organized, not what it is made of.`, k: "brain just chemicals neurons trust reason atoms fizzing molecules" },
    { q: "Lewis showed that if thought is caused by non-rational processes, it can't be rational.", a: `That confuses causes with reasons. A computer's outputs are physically caused, yet it computes valid proofs, because its physical states are organized to mirror logical relations. Rational inference can be implemented in a physical mechanism; that is what computation is. Anscombe pressed Lewis on exactly this in their 1948 Socratic Club debate, and Lewis substantially revised the chapter in the second edition of *Miracles*.`, k: "lewis irrational causes non-rational process reasons causes anscombe" }
  ],
  sources: [
    "Plantinga, A. (1993). Warrant and Proper Function. Oxford University Press, ch. 12.",
    "Plantinga, A. (2011). Where the Conflict Really Lies. Oxford University Press.",
    "Beilby, J. (ed.) (2002). Naturalism Defeated? Essays on Plantinga's Evolutionary Argument Against Naturalism. Cornell University Press.",
    "Fitelson, B. & Sober, E. (1998). 'Plantinga's Probability Arguments Against Evolutionary Naturalism.' Pacific Philosophical Quarterly 79: 115–129.",
    "Ramsey, W. (2002). 'Naturalism Defended.' In Beilby (ed.), Naturalism Defeated?",
    "Law, S. (2012). 'Naturalism, Evolution and True Belief.' Analysis 72(1): 41–48.",
    "Lewis, C. S. (1960). Miracles, 2nd ed., ch. 3; on the Anscombe exchange see Reppert (2003).",
    "Kahneman, D. (2011). Thinking, Fast and Slow. Farrar, Straus & Giroux."
  ],
  keys: "argument from reason plantinga eaan evolutionary argument against naturalism self-defeating can't trust brain reason lewis naturalism undermines itself reliable faculties",
  rel: ["consciousness", "math-and-logic", "transcendental"]
},
{
  id: "irreducible-complexity",
  cat: "god",
  title: "Irreducible Complexity",
  who: "Michael Behe, Darwin's Black Box (1996); The Edge of Evolution (2007); Darwin Devolves (2019); the Discovery Institute",
  claim: `Some biological systems, such as the bacterial flagellum, the blood-clotting cascade, and the immune system, are irreducibly complex. They consist of several interacting parts, and removing any one stops the system working. Such systems could not be built gradually by natural selection, since precursors missing a part would have no function to select. They must have been designed.`,
  short: `Irreducible complexity was tested in court and in the lab and failed. The precursors to the systems Behe named have been identified: parts were co-opted from other functions (exaptation), and scaffolding was later removed. In *Kitzmiller v. Dover* (2005), Behe conceded under oath that his definition of science would include astrology. The judge concluded that intelligent design is not science. Biologists such as Kenneth Miller, a practicing Catholic, led the refutation.`,
  points: [
    { h: "Exaptation: parts get borrowed", t: `Evolution does not build a flagellum from scratch for the purpose of swimming. Its components evolved for other functions and were combined. A subset of flagellar proteins forms the Type III secretion system, a functioning molecular syringe that bacteria use to inject toxins. So a "part" of the flagellum works in its own right. Studies by Pallen and Matzke (2006, *Nature Reviews Microbiology*) and Liu and Ochman (2007) trace flagellar proteins to homologues used elsewhere in the cell.` },
    { h: "Scaffolding and gradual interdependence", t: `H. J. Muller described as early as 1918 how evolution produces "interlocking complexity": a part that is first merely helpful becomes essential once other parts adapt to it. Systems that are irreducible *now* can have reducible *histories*. An arch of stones is irreducible (remove any stone and it falls), yet it can be built with a scaffold of rubble that is later removed.` },
    { h: "The clotting cascade and the immune system", t: `Russell Doolittle's work traces the blood-clotting cascade through gene duplication and divergence. Puffer fish lack several factors humans need, and dolphins lack Factor XII, so the cascade is not irreducible across species. At the Dover trial, Behe claimed there were no evolutionary explanations of the immune system and was presented with 58 peer-reviewed publications and several textbooks on its evolution, which he said were "not good enough." The adaptive immune system's origin through the RAG transposon has since been well documented (Huang et al., *Cell*, 2016).` },
    { h: "Kitzmiller v. Dover", t: `In 2005, a Pennsylvania school board required intelligent design to be presented in biology classes. After a six-week trial, Judge John E. Jones III, a George W. Bush appointee and a churchgoer, ruled that ID "is not science" and "cannot uncouple itself from its creationist, and thus religious, antecedents." He found that its claims of irreducible complexity had been "refuted in peer-reviewed research papers." Evidence at trial showed that the ID textbook *Of Pandas and People* had been edited by replacing "creationists" with "design proponents," producing the transitional form "cdesign proponentsists."` },
    { h: "Even success wouldn't reach God", t: `A failure of evolutionary explanation for some system would be a gap. It would not identify a designer, still less an omnipotent, good one. ID proponents conspicuously decline to say who the designer is, what it did, when, or how. That is why ID produces no research program or predictions, and why Behe's own *Edge of Evolution* was criticized in *Science* and *Nature* reviews for errors in population genetics.` }
  ],
  replies: [
    { q: "Half a flagellum is useless, so it couldn't be selected for.", a: `The parts were not "half a flagellum." They were complete tools for other jobs. The Type III secretion system uses a subset of the flagellar proteins as an injection needle. Evolution works by borrowing working parts, not by building toward a goal.`, k: "half a flagellum useless half an eye intermediate stages no function" },
    { q: "The chance of a protein forming by chance is 1 in 10^77 (Douglas Axe).", a: `Axe's estimate concerns a specific fold of one enzyme arising from a random sequence in a single step. Evolution does not search sequence space at random; it modifies existing functional proteins. Studies of random sequence libraries (Keefe & Szostak, 2001, *Nature*) found ATP-binding function at a frequency of roughly 1 in 10^11, far more common than Axe's calculation implies. Proteins also tolerate a great deal of variation.`, k: "protein chance 10^77 axe random sequence improbable fold" }
  ],
  sources: [
    "Behe, M. (1996). Darwin's Black Box. Free Press.",
    "Kitzmiller v. Dover Area School District, 400 F. Supp. 2d 707 (M.D. Pa. 2005).",
    "Miller, K. R. (1999). Finding Darwin's God. HarperCollins; (2008) Only a Theory. Viking.",
    "Pallen, M. & Matzke, N. (2006). 'From The Origin of Species to the origin of bacterial flagella.' Nature Reviews Microbiology 4: 784–790.",
    "Doolittle, R. F. (2009). 'Step-by-step evolution of vertebrate blood coagulation.' Cold Spring Harbor Symposia on Quantitative Biology 74: 35–40.",
    "Huang, S. et al. (2016). 'Discovery of an Active RAG Transposon Illuminates the Origins of V(D)J Recombination.' Cell 166(1): 102–114.",
    "Keefe, A. & Szostak, J. (2001). 'Functional proteins from a random-sequence library.' Nature 410: 715–718.",
    "Forrest, B. & Gross, P. (2004). Creationism's Trojan Horse. Oxford University Press."
  ],
  keys: "irreducible complexity behe flagellum bacterial motor blood clotting immune system intelligent design id mousetrap discovery institute",
  rel: ["evolution", "dna-information", "design-intuition", "origin-of-life"]
},
{
  id: "dna-information",
  cat: "god",
  title: "DNA, Information, and Specified Complexity",
  who: "Stephen Meyer, Signature in the Cell (2009); William Dembski, The Design Inference (1998), No Free Lunch (2002)",
  claim: `DNA is a code, a digital information storage system. In all our experience, codes and information come only from minds. "Specified complexity," a pattern that is both improbable and conforms to an independent specification, is a reliable marker of design, and living systems are full of it. Natural processes cannot generate new information. So the information in DNA points to an intelligent cause.`,
  short: `"DNA is a code" is an analogy, not a discovery that DNA was written. Natural processes generate information all the time in every technical sense: Shannon information rises with mutation, and selection increases functional information in experiments we can watch. Dembski's "specified complexity" has never been successfully calculated for any real biological system. Mathematicians (Elsberry & Shallit, 2011; Wolpert, the author of the No Free Lunch theorems) have shown that his formal claims fail.`,
  points: [
    { h: "Information arises naturally, and we can watch it happen", t: `Gene duplication followed by divergence creates new genes with new functions. This is observed (e.g., the antifreeze glycoproteins in Antarctic fish, evolved from non-coding and pancreatic DNA; Chen et al., 1997). Richard Lenski's long-term *E. coli* experiment documented the evolution of aerobic citrate use after more than 30,000 generations, with the mutations involved identified (Blount et al., 2008, 2012). Nylon-digesting bacteria evolved enzymes for a substance that did not exist before 1935.` },
    { h: "Specified complexity has never been calculated", t: `To apply Dembski's criterion, you must calculate the probability of a structure arising by *all* relevant natural processes, including selection. Dembski calculates only the probability of the structure arising by pure chance in one step, which nobody proposes. Elsberry and Shallit (*Synthese*, 2011) showed the concept is ill-defined and inconsistently applied. David Wolpert, co-author of the No Free Lunch theorems, called Dembski's use of them "written in jello," because the theorems concern averages over all possible fitness landscapes, not the structured landscapes of real biology.` },
    { h: "'All codes come from minds' begs the question", t: `Every code we know was made by a mind *except the genetic code*, which is the case in dispute. Inferring from "all human codes have human authors" to "the genetic code has an author" assumes the conclusion. The genetic code's structure also bears the marks of history, not design: it is near-universal with known variant codes (mitochondria, some ciliates), its assignments reflect stereochemical and coevolutionary origins (Koonin & Novozhilov, 2009), and it is "frozen" in a way consistent with an accident of early history.` },
    { h: "The genome looks unedited", t: `If DNA were engineered text, we would not expect most of the human genome to be transposable elements and their decayed remnants (about 45%), broken copies of genes (pseudogenes such as GULO, the vitamin C gene we share in a broken state with other primates), and endogenous retroviruses at the same locations as in chimpanzees. The onion genome is about five times larger than ours. A "signature in the cell" is a strange name for so much evident copying error.` }
  ],
  replies: [
    { q: "Mutations only destroy information. They never create it.", a: `Duplication plus mutation creates new genes. Observed examples include antifreeze proteins, nylonase, citrate metabolism in Lenski's *E. coli*, and the many gene families that arose by duplication (globins, opsins, olfactory receptors). Under any formal measure, Shannon or Kolmogorov, a duplication followed by divergence increases information.`, k: "mutations destroy information never create new information loss degrade" },
    { q: "Bill Gates said DNA is like a software program, but far more advanced.", a: `An analogy from a software executive is not an argument. DNA is like code in some respects (discrete symbols, translation rules) and unlike it in others (massive redundancy, no modular design, legacy junk, error-prone copying). What matters is the evidence about where the sequences came from, and that evidence (phylogeny, shared errors, observed evolution) points to descent with modification.`, k: "bill gates dna software program code computer language" }
  ],
  sources: [
    "Meyer, S. (2009). Signature in the Cell. HarperOne.",
    "Dembski, W. (1998). The Design Inference. Cambridge University Press.",
    "Elsberry, W. & Shallit, J. (2011). 'Information Theory, Evolutionary Computation, and Dembski's Complex Specified Information.' Synthese 178(2): 237–270.",
    "Wolpert, D. (2003). 'William Dembski's Treatment of the No Free Lunch Theorems Is Written in Jello.' Review essay.",
    "Blount, Z., Borland, C. & Lenski, R. (2008). 'Historical contingency and the evolution of a key innovation in an experimental population of E. coli.' PNAS 105(23): 7899–7906.",
    "Chen, L., DeVries, A. & Cheng, C. (1997). 'Evolution of antifreeze glycoprotein gene from a trypsinogen gene in Antarctic notothenioid fish.' PNAS 94(8): 3811–3816.",
    "Koonin, E. & Novozhilov, A. (2009). 'Origin and evolution of the genetic code: the universal enigma.' IUBMB Life 61(2): 99–111."
  ],
  keys: "dna code information specified complexity meyer dembski signature in the cell genetic code language software information only from mind",
  rel: ["irreducible-complexity", "origin-of-life", "evolution"]
},
{
  id: "origin-of-life",
  cat: "god",
  title: "The Origin of Life Is Impossible Without God",
  who: "James Tour (Rice University); Stephen Meyer; Fred Hoyle's 'tornado in a junkyard' (1981)",
  claim: `Even the simplest cell is fantastically complex. The chance assembly of a functional cell from chemicals is like a tornado assembling a Boeing 747 from a junkyard (Hoyle). Origin-of-life research has failed for seventy years, and chemists like James Tour say researchers are "clueless." Life coming from non-life (abiogenesis) has never been observed. A designer is the only reasonable explanation.`,
  short: `Nobody proposes that a modern cell assembled by chance. Origin-of-life research studies stepwise chemical pathways, and has made real progress: prebiotic synthesis of nucleotides, self-replicating and evolving RNA, and self-assembling protocells. The field has open problems, and its researchers say so openly. But "we don't yet know how" is a gap. It is not evidence for a designer, still less for a specific God.`,
  points: [
    { h: "The 747 analogy attacks a position no one holds", t: `Hoyle's analogy assumes that life must appear all at once, fully formed. Every origin-of-life model is incremental: simple self-replicating molecules, then selection among replicators, then encapsulation, then metabolism, with each stage building on the last. Probability calculations for random one-step assembly are irrelevant to processes that involve selection and chemistry, which is not random.` },
    { h: "Real progress", t: `Powner, Gerland and Sutherland (*Nature*, 2009) achieved prebiotic synthesis of activated pyrimidine ribonucleotides under plausible early-Earth conditions, solving a problem long considered intractable. Patel et al. (2015) showed that precursors of nucleotides, amino acids, and lipids can arise from a common cyanosulfidic chemistry. In 2024, Papastavrou, Horning and Joyce (*PNAS*) reported an RNA polymerase ribozyme that replicated another functional RNA with enough fidelity for Darwinian evolution, and new, more easily replicated variants emerged during the experiment. Szostak's lab has shown that fatty-acid vesicles grow and divide spontaneously.` },
    { h: "Tour's criticism is about the state of the field, not about God", t: `James Tour is a synthetic chemist who emphasizes, with some justice, that the field has unsolved problems and that popular reports overstate results. But the conclusion that follows from "we don't yet know how life began" is "we don't yet know how life began," not "therefore God." Many researchers in the field publicly dispute his characterizations, and his critiques do not include an alternative research program.` },
    { h: "God-of-the-gaps has a bad track record", t: `The origin of species, the formation of the Solar System, the growth of embryos, the cause of disease, and the source of lightning were all once treated as places where only God could explain the facts. Each gap closed with a natural explanation. The probability that this particular gap is different, and different in a way that points to the Christian God, is low by simple induction on the history of science.` },
    { h: "Life's chemistry looks unplanned", t: `Life uses the most cosmically abundant elements (H, C, N, O), common prebiotic molecules, and chirality that probably arose from an early symmetry-breaking event. Its core metabolism (the reverse Krebs cycle and acetyl-CoA pathway) resembles geochemistry at hydrothermal vents (Martin & Russell; Lane). That pattern suggests life emerged from Earth's chemistry, not that it was imported from a mind.` }
  ],
  replies: [
    { q: "Life has never been created in a lab, so abiogenesis is just faith.", a: `Plate tectonics has never been reproduced in a lab either. Historical sciences infer past processes from present evidence and partial experiments. Each step of the proposed pathways is being tested experimentally, with documented successes. The alternative, "a mind did it in an unspecified way," has made no experimental predictions at all.`, k: "never created in lab abiogenesis faith never observed life from non-life pasteur" },
    { q: "Pasteur proved life only comes from life.", a: `Pasteur showed that microbes do not spontaneously arise *in modern broth within days*. That says nothing about chemistry on an early Earth with no oxygen, no competing life eating the precursors, and hundreds of millions of years available.`, k: "pasteur spontaneous generation life only from life law of biogenesis" }
  ],
  sources: [
    "Powner, M., Gerland, B. & Sutherland, J. (2009). 'Synthesis of activated pyrimidine ribonucleotides in prebiotically plausible conditions.' Nature 459: 239–242.",
    "Patel, B. et al. (2015). 'Common origins of RNA, protein and lipid precursors in a cyanosulfidic protometabolism.' Nature Chemistry 7: 301–307.",
    "Papastavrou, N., Horning, D. & Joyce, G. (2024). 'RNA-catalyzed evolution of catalytic RNA.' PNAS 121(11): e2321592121.",
    "Szostak, J. (2017). 'The Narrow Road to the Deep Past: In Search of the Chemistry of the Origin of Life.' Angewandte Chemie 56(37): 11037–11043.",
    "Lane, N. (2015). The Vital Question. Norton.",
    "Hoyle, F. (1981). 'Hoyle on Evolution.' Nature 294: 105."
  ],

},
{
  id: "design-intuition",
  cat: "god",
  title: "Paley's Watch and the Intuition of Design",
  who: "William Paley, Natural Theology (1802); popular apologetics ('a painting needs a painter'; 'look at the trees')",
  claim: `If you found a watch on a heath, you would infer a watchmaker from its intricate arrangement of parts for a purpose. Living things and the universe are far more intricate than any watch. A painting needs a painter, a building needs a builder, and creation needs a Creator. Just look at the beauty and order of nature.`,
  short: `Paley's argument was a reasonable inference in 1802. Darwin gave a natural mechanism for the appearance of design: variation plus selection, accumulated over deep time. We recognize human artifacts as designed because we know what humans make and how, and because artifacts contrast with nature. The intuition that living things are designed is a well-studied cognitive bias ("promiscuous teleology"), not a reliable perception.`,
  points: [
    { h: "Darwin answered Paley", t: `Natural selection is a mechanism that produces adaptation without foresight. Darwin had studied Paley at Cambridge and admired him, and wrote that Paley's argument "fails, now that the law of natural selection has been discovered" (*Autobiography*). The appearance of design in organisms is real. Its cause is cumulative selection, which can be observed in the lab, in the field (Darwin's finches; Grant & Grant), and in computer simulations.` },
    { h: "We infer watchmakers from knowledge of watchmakers", t: `We know the watch was made because we know who makes watches, how, and why. We have seen watch factories. Hume's point: the design inference is an argument from analogy, and analogies are only as strong as our experience of the cause. We have no experience of universe-makers. And the watch stands out on the heath precisely *because* the heath (nature) is not like it.` },
    { h: "Design looks like history, not engineering", t: `Real biological "design" carries the marks of tinkering. The recurrent laryngeal nerve loops down around the aorta and back up, which makes it about 4.5 meters long in a giraffe, a relic of our fish ancestry. The vertebrate retina is wired backwards, creating a blind spot. The human birth canal passes through a pelvis built for walking, and the male urethra passes through the prostate. These are not choices an omniscient engineer would make. They are compromises a historical process would leave behind.` },
    { h: "We are built to see design", t: `Developmental psychologist Deborah Kelemen found that children (and adults under time pressure) attribute purpose to natural objects, saying that rocks are "pointy so animals can scratch on them." She calls this "promiscuous teleology." Agency detection is biased toward false positives because, in evolutionary terms, mistaking wind for a predator costs little while the reverse can be fatal (see [[csr]]). An intuition we know to be systematically over-sensitive is weak evidence.` },
    { h: "Whose design?", t: `Even if design were granted, nothing would follow about the number, goodness, or identity of designers. Hume asked why not a committee of gods, an infant deity's first botched attempt, or an aged deity's last (*Dialogues*, V). The parasitic wasps that eat caterpillars alive from the inside, which troubled Darwin, are also "designs." See [[animal-suffering]].` }
  ],
  replies: [
    { q: "A painting needs a painter and a building needs a builder. Creation needs a Creator.", a: `That assumes the conclusion by calling the universe "creation." Paintings and buildings are known to be made by humans. Snowflakes, crystals, and river deltas are intricate and patterned, but come from natural processes. The question is which category living things and the universe belong to, and the evidence (fossils, genetics, observed selection) puts life in the snowflake category, not the painting one.`, k: "painting needs painter building builder creation creator look around trees" },
    { q: "Just look at the trees, the stars, a newborn baby. How can you not see God?", a: `Beauty and complexity are real, and they are moving. But the same nature includes malaria, childhood cancer, and parasites that blind children (*Onchocerca volvulus*, river blindness). If the beautiful parts are evidence of a good designer, the horrific parts are evidence too. Natural processes explain both without anyone choosing them.`, k: "look at trees nature beauty stars baby how can you not see god creation obvious romans 1" }
  ],

{
  id: "desire",
  cat: "god",
  title: "The Argument from Desire",
  who: "C. S. Lewis, Mere Christianity III.10 (1952); Augustine ('our heart is restless until it rests in you'); Peter Kreeft",
  claim: `Every natural, innate desire corresponds to a real object that can satisfy it: hunger to food, thirst to water, sexual desire to sex. Humans have a desire that nothing in this world can satisfy, a longing for transcendence and joy (Lewis's *Sehnsucht*). "If I find in myself a desire which no experience in this world can satisfy, the most probable explanation is that I was made for another world." There is a "God-shaped hole" in every heart.`,
  short: `The premise is false in general: people desire immortality, perfect justice, and unlimited knowledge, and their wanting these does not make them exist. Natural desires correspond to *types* of things, not guaranteed objects (the thirsty desert traveler dies). Restless, open-ended desire is exactly what evolution would produce in an organism that must keep striving. And the "God-shaped hole" is not universal: highly secular societies show no epidemic of unmet longing.`,
  points: [
    { h: "Desires don't guarantee their objects", t: `Lewis restricts the premise to "natural" desires. But the distinction is drawn after the fact: a desire for heaven gets counted as natural because the theist believes heaven exists. People desire to fly unaided, to live forever, and to see the dead again. That a desire exists explains why we search, not that the object is real.` },
    { h: "Insatiability is an evolutionary design feature", t: `An organism that became permanently satisfied would stop seeking food, mates, status, and security, and would be outcompeted. "Hedonic adaptation" (returning to a baseline after gains) is a robust finding in psychology (Brickman & Campbell, 1971; Frederick & Loewenstein, 1999). Endless longing is what we'd predict from natural selection, not a clue about another world.` },
    { h: "The 'God-shaped hole' isn't universal", t: `In Denmark, Sweden, Japan, and the Czech Republic, large majorities live without religious belief. They rank at or near the top of world happiness surveys and do not report a gap where God should be (Zuckerman, *Society without God*, 2008). The longing Lewis describes is real for many people but culturally shaped, not a fixed feature of human nature.` }
  ],
  replies: [
    { q: "Nothing in this world has ever satisfied me. Only God fills that hole.", a: `That's a sincere report of your experience, and many people share it. But people of every religion and none report finding meaning and peace in their own way: Buddhists through practice, secular people through relationships and work. The feeling of fulfillment is evidence about human psychology, which responds to commitment, community, and ritual whatever their content.`, k: "god shaped hole nothing satisfies emptiness restless heart fulfilled only god" }

{
  id: "math-and-logic",
  cat: "god",
  title: "The Laws of Logic, Mathematics, and the Order of Nature",
  who: "Presuppositional and classical apologists; Eugene Wigner's 'unreasonable effectiveness of mathematics' (1960) used as evidence by apologists; Alister McGrath; John Lennox",
  claim: `The universe is orderly, governed by precise mathematical laws, and intelligible to human minds. The laws of logic are universal, immaterial, and unchanging, so they must exist in a universal, immaterial, unchanging mind. Mathematics, a free creation of human minds, describes physical reality with uncanny precision. This "unreasonable effectiveness" is just what we'd expect if the universe and our minds came from the same rational Creator.`,
  short: `Laws of logic are not things that need a location. They are the most general constraints on any coherent description, and they would hold in any world. Making them depend on God's mind creates a new Euthyphro: could God have made contradictions true? Mathematics fits physics partly because we select and build the mathematics that fits, and partly because physics, in the relevant regimes, really is simple and regular. That calls for explanation, but a mind is not a better explanation of regularity than regularity itself.`,
  points: [
    { h: "Logic doesn't need a lawgiver", t: `"Laws" of logic are not commands that need someone to issue them. They describe what is coherent. The law of non-contradiction says no proposition is both true and false. A world in which it "failed" isn't a world we can even describe. If logic depended on God's mind, then God could presumably have thought otherwise, and contradictions could have been true. If God *couldn't* have, logic constrains God, and logic is independent of him. This is the Euthyphro dilemma again.` },
    { h: "Immaterial is not the same as mental", t: `The argument assumes that whatever is not physical must be a thought in some mind. But many philosophers who are realists about abstract objects (Frege, Gödel, contemporary platonists) hold that numbers and propositions exist independently of *any* mind. Others (nominalists, structuralists, fictionalists) hold they exist in no strong sense. None of these positions requires God.` },
    { h: "Wigner's puzzle has natural answers", t: `Mathematics is not arbitrary invention. Much of it was developed by abstracting from physical experience (counting, geometry, motion), so it fits the world because it came from the world. Mathematicians also generate vast amounts of structure, and physicists use the small part of it that fits. That is a selection effect. Hamming (1980) noted that much of physics is *not* mathematically tidy: turbulence, biology, and economics remain stubborn.` },
    { h: "Order is the default, not a miracle", t: `A universe where things behave consistently is, arguably, the minimal possibility. Disorder would also need description. On Humean views, "laws" are simply the most efficient summaries of regularities (Lewis's best-system account), so asking who enforces them is like asking who enforces the average height of Norwegians. On anti-Humean views, laws flow from the natures of physical things (Bird, Ellis). Neither requires an enforcer.` },
    { h: "Theism doesn't explain order better", t: `A God who acts in history, answers prayer, and performs miracles is a God whose world is *not* fully lawful. If the universe were less orderly, apologists could equally say this shows God's active hand. A hypothesis compatible with both order and disorder predicts neither.` }
  ],
  replies: [
    { q: "How do you account for the laws of logic in your worldview?", a: `The same way the theist does, at bottom: they are necessary, and necessary truths need no further cause. The theist says "they're grounded in God's nature," but that is just positing a necessary being whose nature happens to include logic. Saying "logic is necessary" is simpler and avoids the question of whether God could have made contradictions true. See [[transcendental]].`, k: "account for laws of logic worldview ground logic immaterial universal invariant" },
    { q: "If the universe weren't created by a rational mind, why would it be intelligible?", a: `Intelligibility is partly a fact about us. Brains evolved to model regularities, because regularities could be exploited to survive. We find the universe intelligible at our scale and remarkably *un*intuitive elsewhere (quantum mechanics, curved spacetime). The universe isn't designed to be understood. We are adapted to understand parts of it.`, k: "intelligible comprehensible rational universe understand why order science possible" }
  ],
  sources: [
    "Wigner, E. (1960). 'The Unreasonable Effectiveness of Mathematics in the Natural Sciences.' Communications on Pure and Applied Mathematics 13: 1–14.",
    "Hamming, R. W. (1980). 'The Unreasonable Effectiveness of Mathematics.' American Mathematical Monthly 87(2): 81–90.",

  rel: ["transcendental", "argument-from-reason", "fine-tuning"]
},
{
  id: "transcendental",
  cat: "god",
  title: "Presuppositionalism: The Transcendental Argument",
  who: "Cornelius Van Til; Greg Bahnsen (debate with Gordon Stein, 1985); Sye Ten Bruggencate; Jeff Durbin",
  claim: `Logic, science, and morality all presuppose the Christian God. The unbeliever cannot "account for" the laws of logic, the uniformity of nature, or moral absolutes within their own worldview. So every time they reason, they borrow from the Christian worldview. The proof of God is the impossibility of the contrary. Any attempt to argue against God uses tools only God provides. "How do you know your reasoning is valid? Could you be wrong about everything you know?"`,
  short: `Transcendental arguments need to show that *only* the Christian God could make logic, induction, and morality possible. That has never been done. Any being or necessary structure stipulated to "ground" these would do equally well (Martin's parody). The "how do you know" regress applies equally to the theist, whose claim to know God via revelation relies on their own reasoning to interpret that revelation. And "God revealed it so I can be certain" is circular by the presuppositionalist's own admission.`,
  points: [
    { h: "The 'impossibility of the contrary' is asserted, not shown", t: `To prove that God is the *necessary* precondition of logic, you would need to refute every alternative: logic as necessary in itself, as a feature of language, as a description of all possible worlds, or as grounded in a non-Christian deity. Presuppositionalists rarely consider these. They demand that the opponent "account for" logic, then declare victory. A Muslim, a Hindu, or a believer in a "logic-god" can run the identical argument.` },
    { h: "God doesn't ground logic either", t: `If logic is grounded in God's nature, why is God's nature logical? Either because it must be, in which case logic is prior, or because God is just that way, a brute fact the presuppositionalist says the atheist cannot have. Michael Martin's "Transcendental Argument for the Non-existence of God" (1996) argues that if God created logic, God could have made it otherwise, which undermines its necessity. So logic's necessity tells *against* a creator of logic.` },
    { h: "Circular by design", t: `Bahnsen accepted that his argument is circular, but called it "virtuously" circular because all ultimate commitments are. If circularity is acceptable at the foundations, then the naturalist can be equally "virtuously" circular about logic and the senses, and the argument proves nothing. The demand for absolute certainty also defeats itself: the believer must be certain that their interpretation of revelation is correct, using the same fallible mind.` },
    { h: "Induction is a problem for everyone", t: `Hume's problem of induction (why expect the future to resemble the past?) is unsolved for everyone. Saying "God promised nature would be uniform" (citing Genesis 8:22) relies on the past reliability of God's promises, which is itself an inductive inference. It also sits poorly with a God who performs miracles, which are by definition breaks in uniformity.` }
  ],
  replies: [
    { q: "Could you be wrong about everything you know? If so, how do you know anything?", a: `I could be wrong about any particular thing; that's what it means to be fallible. Knowledge doesn't require certainty. It requires reliable belief formation, which is open to checking. The question works equally on you: could you be wrong about God's revelation? If you say no, because God revealed it to you, you are using your own fallible mind to judge that he did. Infallibility is unavailable to anyone.`, k: "could you be wrong about everything know anything certainty how do you know presupp sye" },
    { q: "You're borrowing from the Christian worldview when you use logic.", a: `Logic was formalized by Aristotle three centuries before Christianity, and Indian (Nyāya) and Chinese (Mohist) logicians worked independently. It is used by people of every religion and none, all of whom would then be "borrowing" from their own worldviews. The claim is an assertion that the Christian God is the only possible ground of logic, which is the very thing that needed proof.`, k: "borrowing christian worldview using logic presuppose god account for" }
  ],
  sources: [
    "Bahnsen, G. vs. Stein, G. (1985). 'The Great Debate: Does God Exist?' University of California, Irvine.",
    "Van Til, C. (1955). The Defense of the Faith. Presbyterian & Reformed.",
    "Martin, M. (1996). 'The Transcendental Argument for the Nonexistence of God.' The Secular Web.",
    "Stroud, B. (1968). 'Transcendental Arguments.' Journal of Philosophy 65(9): 241–256.",
    "Hume, D. (1748). An Enquiry Concerning Human Understanding, §IV."
  ],
  keys: "presuppositionalism transcendental argument tag account for logic impossibility of the contrary bahnsen van til sye ten bruggencate how do you know borrowing worldview uniformity of nature",
  rel: ["math-and-logic", "argument-from-reason", "faith"]
},
{
  id: "pascal",
  cat: "god",
  title: "Pascal's Wager: What If You're Wrong?",
  who: "Blaise Pascal, Pensées §233 (1670); popular apologetics ('what have you got to lose?')",
  claim: `If you believe in God and he exists, you gain infinite reward. If you believe and he doesn't exist, you lose little. If you don't believe and he exists, you lose infinitely. If you don't believe and he doesn't exist, you gain little. Since even a small probability multiplied by an infinite payoff exceeds any finite payoff, the rational choice is to believe. "What if you're wrong?"`,
  short: `The wager works only if there is a single God to bet on. There are thousands of incompatible candidate gods, and also possible gods who reward honest unbelief and punish self-serving belief. With infinite payoffs available to every hypothesis, decision theory breaks down. Belief also cannot be adopted at will, and a God who rewards belief held for gain would be an odd object of worship.`,
  points: [
    { h: "The many-gods objection", t: `You might be wrong about Allah, who in the Quran condemns worship of Jesus as God (shirk, Q 5:72), or about one of the many gods whose rules contradict Christianity's. The wager gives no reason to choose Christianity over any other religion with an infinite threat. And for every possible god who rewards Christian belief, we can conceive one who rewards the opposite: a God who values evidence-proportioned belief and rewards honest skeptics (Martin's "perverse master," the "atheist's wager").` },
    { h: "Infinity breaks the math", t: `Alan Hájek ("Waging War on Pascal's Wager," *Philosophical Review*, 2003) showed that with infinite utilities, *any* strategy that gives a nonzero chance of ending up a believer, such as flipping a coin and believing on heads, has the same infinite expected value as wholehearted belief. So the wager cannot favor belief over almost anything else. Bounded utility theory, which most decision theorists prefer, removes the infinite payoff entirely.` },
    { h: "Belief is not a choice", t: `You cannot believe something by deciding to, any more than you can decide to believe the sky is green. Pascal knew this and advised taking holy water and attending Mass until belief came, which amounts to deliberately manipulating oneself into belief despite the evidence. That is a strategy of self-deception, not a reason to think a claim is true.` },
    { h: "A God who rewards strategic belief?", t: `A good and omniscient God would know that a wagered belief is held for self-interest, not love of truth. If the God of the wager can be fooled, or cares more about the belief than the honesty behind it, he is not the God Christianity describes. And the wager's own costs are not small: a lifetime committed to a false framework, money given, choices about family, sexuality, and medicine shaped by it.` },
    { h: "It's an argument from consequences", t: `Even a perfectly sound wager would give no evidence that God *exists*. It would only say that believing pays. Truth and payoff are different questions. You could make the same argument for any claim backed by a large enough threat.` }
  ],
  replies: [
    { q: "What if you're wrong and you end up in hell?", a: `What if *you're* wrong, and the true God is Allah, who condemns worship of Jesus? Or a God who values honest reasoning and rewards people who followed the evidence? Every religion with a threat can ask "what if you're wrong," and the threats can't all be avoided. The only consistent rule is to believe what the evidence supports.`, k: "what if you're wrong hell end up in hell risk lose nothing to lose" },
    { q: "Christianity is the most likely religion, so the wager favors it.", a: `Then the wager is doing no work: the argument depends on first showing that Christianity is more probable than its rivals, which is what the rest of the debate is about. And if Christianity is very unlikely on the evidence, the wager tells you nothing beyond what the evidence already did.`, k: "christianity most likely religion wager favors christianity probable" }
  ],
  sources: [
    "Pascal, B. (1670). Pensées §233 (Brunschvicg numbering) / §418 (Lafuma).",
    "Hájek, A. (2003). 'Waging War on Pascal's Wager.' Philosophical Review 112(1): 27–56.",

    "Mackie, J. L. (1982). The Miracle of Theism, ch. 11."

  keys: "pascal's wager what if you're wrong nothing to lose hell infinite reward bet gamble safe side better safe than sorry",
  rel: ["hell", "why-christianity", "consequences"]
},
{
  id: "cumulative-case",
  cat: "god",
  title: "The Cumulative Case and Inference to the Best Explanation",
  who: "Richard Swinburne, The Existence of God (2nd ed. 2004); Basil Mitchell; Tim & Lydia McGrew; William Lane Craig",
  claim: `No single argument has to prove God by itself. Taken together, the existence of the universe, its fine-tuning, its order, consciousness, moral awareness, religious experience, miracles, and the resurrection form a cumulative case. Theism explains all of them with a single simple hypothesis: one infinite, personal God. Swinburne argues by Bayesian reasoning that, on the total evidence, theism is more probable than not.`,
  short: `A cumulative case is only as strong as its parts, and adding weak pieces of evidence can lower the total. Swinburne's claim that God is "simple" (one being with infinite properties) is contested: an infinite mind with unlimited knowledge and power is not simpler than physics. And a fair Bayesian accounting must include the evidence that *counts against* theism: gratuitous suffering, divine hiddenness, the dependence of mind on brain, the scale and indifference of the cosmos, the evolutionary origin of religion, and the history of Christianity's texts. Weighed together, those make naturalism more probable.`,
  points: [
    { h: "Total evidence cuts both ways", t: `Inference to the best explanation requires that you consider *all* the evidence. That includes the vast amount of suffering that serves no visible purpose ([[problem-of-evil]]); the absence of God from most human history and lives ([[hiddenness]]); the complete dependence of minds on brains ([[disembodied-mind]]); the distribution of religion by geography ([[demographics]]); and the fact that the physical world shows no signs of being arranged around humans. Paul Draper argues that these together support a "Hypothesis of Indifference" over theism by a large factor (Draper, 1989; 2017).` },
    { h: "God is not a simple hypothesis", t: `Swinburne assigns theism a high prior because God is supposedly "simple": one substance with every property in infinite degree. But simplicity in a scientific sense concerns the number of entities, kinds, and adjustable parameters. A personal agent whose choices are not determined by anything is the opposite of a simple, predictive mechanism. Its behavior can be fitted to any data after the fact. Critics such as Oppy, Gwiazda, and Philipse (*God in the Age of Science?*, 2012) argue that Swinburne's priors are unjustified.` },
    { h: "Weak arguments don't add up to a strong one", t: `In Bayesian terms, a cumulative case adds up likelihood ratios. If each piece of evidence is equally well explained, or better explained, by naturalism (a likelihood ratio of 1 or less), then piling them together adds nothing or moves things the other way. "Ten leaky buckets don't hold water" is crude, but it captures the point: one needs to show that each piece *favors* theism, not just that it is compatible with it.` },
    { h: "Theism is too flexible to be the 'best' explanation", t: `A good explanation predicts specific outcomes and is at risk of being wrong. Theism, as usually stated, predicts no particular universe: God could have created anything for reasons we cannot know. Skeptical theism even says we should *not* expect to understand God's choices ([[skeptical-theism]]). An explanation that can fit any data at all earns no credit from the data it does fit.` },
    { h: "Even success would be generic theism", t: `A successful cumulative case would establish a generic creator. Getting from there to Christianity requires the historical case (resurrection, scripture), where the evidence is weakest. See [[minimal-facts]] and [[inerrancy]].` }
  ],
  replies: [
    { q: "God is the simplest explanation: one being explains everything.", a: `"One being" is cheap if that being has unlimited, unexplained capacities. By that standard "a single unexplained law of everything" is also one thing that explains everything, and it posits no mind. Simplicity in science means fewer adjustable parameters and sharper predictions. "An omnipotent person chose it" fits any possible observation, which is the opposite of explanatory power.`, k: "god simplest explanation one being explains everything occam parsimony swinburne" },
    { q: "Naturalism can't explain anything ultimate. Theism is the only complete worldview.", a: `No worldview explains its own foundations. Theism stops at God, unexplained. Naturalism stops at the fundamental physical reality, unexplained. "Complete" is a matter of where you stop, not of whether you stop, and stopping with fewer kinds of thing is better.`, k: "naturalism can't explain ultimate complete worldview best explanation everything" }
  ],
  sources: [
    "Swinburne, R. (2004). The Existence of God, 2nd ed. Oxford University Press.",
    "Draper, P. (1989). 'Pain and Pleasure: An Evidential Problem for Theists.' Noûs 23(3): 331–350.",
    "Draper, P. (2017). 'Atheism and Agnosticism.' Stanford Encyclopedia of Philosophy.",
    "Philipse, H. (2012). God in the Age of Science? A Critique of Religious Reason. Oxford University Press.",
    "Oppy, G. (2006). Arguing about Gods, ch. 8.",
    "Gwiazda, J. (2009). 'Richard Swinburne's Argument to the Simplicity of God via the Infinite.' Religious Studies 45(4): 487–493."
  ],
  keys: "cumulative case best explanation inference to best explanation swinburne bayesian all arguments together simplest explanation worldview",
  rel: ["problem-of-evil", "hiddenness", "fine-tuning", "minimal-facts"]
},
{
  id: "something-from-nothing",
  cat: "god",
  title: "Atheists Believe Everything Came from Nothing",
  who: "Popular apologetics (e.g., 'nothing created everything'); responses to Lawrence Krauss, A Universe from Nothing (2012)",
  claim: `Atheism says that nothing created everything, that the universe popped into being from nothing, uncaused. That is absurd. Even Krauss's "nothing" is really a quantum vacuum, which is something. Only an eternal Creator explains why there is something rather than nothing.`,
  short: `Atheism, as a position, says nothing about cosmic origins. It is just the absence of belief in gods. Most naturalist philosophers do *not* claim the universe came from absolute nothing. They hold that physical reality is eternal, or that its first state needs no cause, or that "why is there something rather than nothing?" may have no answer. The theist's own position is that God created matter from no pre-existing matter, so "something from nothing" is more accurately the Christian doctrine.`,
  points: [
    { h: "Nobody serious says 'nothing created everything'", t: `"Nothing created everything" is a straw man. Naturalist options include: an eternal universe or multiverse; a first physical state that exists necessarily or without cause; and the view that the question has no answer. Graham Oppy, the leading naturalist in philosophy of religion, defends a necessary initial physical state.` },
    { h: "Krauss's 'nothing' is a red herring on both sides", t: `Krauss's book used "nothing" loosely, to mean a state with no particles or no space, and the philosopher David Albert criticized it sharply in the *New York Times* (2012). Apologists then use Krauss's mistake to suggest that all naturalists are confused. But no part of the case against theism depends on Krauss's terminology.` },
    { h: "Theism has the same question", t: `"Why is there God rather than nothing?" If the answer is "God exists necessarily," the naturalist can give the same answer about the physical foundation. If "necessary existence" is meaningful at all, it is no more mysterious for a physical reality than for a mind. And positing an uncaused God, in order to avoid an uncaused universe, adds a second uncaused thing.` },
    { h: "Creatio ex nihilo is the 'something from nothing' view", t: `Christian doctrine (since Irenaeus and Theophilus of Antioch in the 2nd century; Genesis 1 itself begins with pre-existing waters) holds that God made the universe out of nothing. No mechanism is offered: God willed and matter appeared. This is the claim that physical stuff came into being with no physical precursor, which is what apologists find absurd when they attribute it to atheists.` }
  ],
  replies: [
    { q: "Where did the universe come from then?", a: `Honest answer: no one knows, and "I don't know" is better than an answer that has no evidence behind it. Physics has candidate models (eternal inflation, cyclic models, quantum cosmology). "God did it" is not an answer to "where did it come from?" so much as a renaming of the mystery, since you then have to ask where God came from, or accept that something can just exist without a cause, which is what the naturalist says about the universe.`, k: "where did universe come from origin of universe how did everything begin" }

  claim: `For centuries, atheists held that the universe was eternal. The Big Bang showed it had a beginning, just as Genesis 1:1 says: "In the beginning God created the heavens and the earth." Atheist scientists like Fred Hoyle resisted the Big Bang because of its theistic implications. The discovery of a cosmic beginning vindicates the Bible.`,

    { h: "Lemaître rejected the theological reading", t: `The Big Bang theory was proposed by Georges Lemaître, a Belgian priest and physicist. When Pius XII suggested in 1951 that the theory confirmed creation, Lemaître reportedly asked the Vatican to stop, insisting that his cosmology was neutral on metaphysics. He wrote that the theory "remains entirely outside any metaphysical or religious question."` },

  cat: "god",
  title: "God Doesn't Need a Cause (Who Made God?)",
  who: "Standard apologetic reply to 'Who made God?' (Craig, Feser, Lennox)",
  claim: `"Who made God?" is a confused question. God is by definition uncaused and eternal; only things that begin to exist need a cause. Asking who made God is like asking who the bachelor's wife is. Dawkins's "Ultimate Boeing 747" argument, that God would be even more complex than the universe, misunderstands classical theism, in which God is simple and necessary.`,
  short: `The reply is fair against a naive "everything has a cause" argument, but it shows that uncaused existence is possible, which the naturalist can claim for the universe or its foundation. The theist must then argue that a mind is a better candidate for uncaused existence than physical reality, and no good argument for that is available. Defining God as uncaused doesn't help: definitions can't settle what exists.`,
  points: [
    { h: "Special pleading, or a symmetric option", t: `If some things can exist without a cause, the question is which things. The theist says "only God." The naturalist says "the most fundamental physical reality." Without an independent reason to think that minds, rather than physical states, are the kind of thing that can be uncaused, the theist's exemption is special pleading.` },
    { h: "Definitions don't create existence", t: `"God is by definition uncaused" tells us what the word means. It does not tell us that anything answers to the definition. One could define a "Zog" as an uncaused cause of the universe that is impersonal and mindless, and the definition would work just as well.` },
    { h: "Simplicity is contested", t: `Classical theists answer Dawkins by saying God is metaphysically simple, without parts. But a being that knows every fact, holds every possible plan, and can bring about any possible world contains, in some sense, all that information. Divine simplicity also faces serious coherence objections (see [[divine-simplicity]]). An infinitely capable mind does not look like the kind of thing one should expect to exist without explanation.` }

  who: "Aquinas, Summa Theologiae I q.25; Plantinga; Wierenga, The Nature of God (1989); Flint & Freddoso (1983)",
  claim: `God is all-powerful. The "paradox of the stone" (can God make a stone too heavy for him to lift?) is a pseudo-problem, because omnipotence means the ability to do anything *logically possible*, and "a stone an omnipotent being can't lift" is a contradiction, like a square circle. Refined definitions in terms of bringing about states of affairs remove the paradoxes.`,
  short: `The "logically possible" qualifier saves omnipotence from the stone paradox, but at a price. Every refined definition faces counterexamples, and the qualifications multiply until "omnipotent" means little more than "able to do whatever God can do." More seriously, omnipotence combined with perfect goodness rules out tolerating evil that could be prevented, so the coherence of omnipotence makes the problem of evil sharper.`,
  points: [
    { h: "The definitions keep breaking", t: `Philosophers have offered dozens of definitions of omnipotence in terms of states of affairs, abilities, or powers. Each faces counterexamples. "McEar" is a being who can only scratch his ear: if omnipotence is "being able to do everything consistent with one's nature," McEar counts as omnipotent (Plantinga's example). Refinements by Flint and Freddoso (1983), Wierenga (1989), and others become so technical that it is unclear whether they still capture the idea of unlimited power. The SEP entry on omnipotence (Hoffman & Rosenkrantz) surveys the unresolved difficulties.` },
    { h: "Omnipotence versus other attributes", t: `Can God sin, lie, break a promise, or forget? If not, there are things that ordinary humans can do that God cannot, so God's power is constrained by his nature. Theists answer that these are "weaknesses," not powers. But that answer makes the definition of omnipotence depend on God's other attributes, which makes it partly circular. Hebrews 6:18 says it is "impossible for God to lie."` },

  cat: "coherence",
  title: "Divine Foreknowledge Is Compatible with Free Will",
  who: "Boethius; Augustine; William of Ockham; Molinists (Luis de Molina; Craig; Flint); open theists dissent (Hasker, Pinnock)",
  claim: `God knows everything, including what we will freely choose tomorrow. Knowing that something will happen does not cause it to happen. God knows our choices because we will make them, not the other way around. Boethius: God sees all of time at once from eternity, as an observer sees a man walking. Molinists add that God knows "middle knowledge": what any free creature would do in any circumstance.`,
  short: `"Knowledge doesn't cause events" misses the problem. If God *infallibly* believed yesterday that you will do X tomorrow, then you cannot do otherwise without making God's past belief false, and nobody can change the past. That is Nelson Pike's 1965 argument, and it is still discussed as a live problem. Each solution comes at a cost: Boethian timelessness makes God unable to act in time; Ockhamism relies on contested "soft facts"; Molinism faces the "grounding objection"; open theism gives up full foreknowledge, which contradicts biblical prophecy.`,
  points: [
    { h: "The fatalist argument", t: `Pike's argument (*Philosophical Review*, 1965), in brief: (1) Yesterday God believed you would do X today. (2) God's beliefs are infallible. (3) The past is fixed: you can't now make it the case that God didn't believe that. (4) So you can't refrain from X. The argument does not claim that God's knowledge *causes* your action. It is about the necessity of the past and infallibility. This is why Linda Zagzebski's SEP entry treats it as a genuine dilemma.` },
    { h: "The proposed escapes each cost something", t: `**Boethian timelessness**: if God is outside time, he has no "past belief." But then God cannot respond to prayer, remember, or act in history in sequence, which is inconsistent with the biblical portrait (see [[timeless-god]]). **Ockhamism**: God's past belief is a "soft fact" that depends on the future. Critics argue soft facts don't help, because God's believing, unlike a mere prediction, is a real past state. **Molinism**: God knows what you *would* freely do in every circumstance. The "grounding objection" (Adams, 1977; Hasker) asks what makes these counterfactuals true before you exist, if not your character, which would make them determined. **Open theism**: God doesn't know the free future. But that abandons the classical doctrine and makes predictive prophecy impossible.` },
    { h: "Calvinism dissolves the problem by giving up freedom", t: `Reformed theology (Calvin, Edwards) accepts that God foreordains everything, including human choices, and holds that this is compatible with freedom understood as acting on one's desires (compatibilism). But then the free will defense against the problem of evil collapses: God could have determined everyone to freely choose good. And God's decree would include every sin and every damnation.` },
    { h: "The theological tension is scriptural", t: `The Bible contains both pictures: God regrets having made humans (Genesis 6:6), changes his mind (Exodus 32:14, Jonah 3:10), and tests Abraham "to know" what he would do (Genesis 22:12). Elsewhere God declares "the end from the beginning" (Isaiah 46:10) and predestines (Romans 8:29–30, Ephesians 1:4–5). Christian traditions have split over this for 1,600 years: Augustine versus Pelagius, Calvinist versus Arminian. That pattern is more consistent with a human literature containing different views than with a single coherent revelation.` }
  ],

{
  id: "timeless-god",
  cat: "coherence",
  title: "God Is Timeless and Unchanging, Yet Personal",
  who: "Augustine, Confessions XI; Boethius; Aquinas; Anselm; Paul Helm; Brian Leftow",
  claim: `God exists outside of time, in an eternal present, and is immutable: he cannot change, since change would imply imperfection. Yet God is a personal agent who knows, loves, creates, responds to prayer, became incarnate, and acts in history. There is no contradiction: God's single eternal act has effects at different times.`,
  short: `A person who cannot change cannot deliberate, respond, remember, decide, or love in any sense we understand, because each of these is a process. "A single timeless act with temporally spread effects" either makes God's responses to prayer and history fixed regardless of what we do, or reintroduces change in God. Many contemporary Christian philosophers (Wolterstorff, Craig, Swinburne, Mullins) have given up divine timelessness for exactly these reasons.`,
  points: [
    { h: "Personhood requires time", t: `Thinking is a sequence: considering, then concluding. Responding means acting *after* and *because of* something. Love involves attending to someone in a changing relationship. None of these makes sense for a being whose existence is a single unchanging "now." R. T. Mullins (*The End of the Timeless God*, OUP 2016) argues that timelessness is incompatible with God's knowledge of temporal facts, with the Incarnation, and with divine responsiveness.` },
    { h: "Knowing what time it is", t: `A timeless God cannot know tensed facts like "it is now 2026" or "the Exodus is over," since for him nothing is past or present. Kretzmann ("Omniscience and Immutability," 1966) argued that an omniscient being must know what time it is, and so must change as time passes. Then he cannot be both omniscient and immutable.` },
    { h: "Even Christian philosophers have abandoned it", t: `Nicholas Wolterstorff ("God Everlasting," 1975), Richard Swinburne, Alan Padgett, and William Lane Craig all reject strict timelessness in some form. Craig holds that God is timeless "without creation" and temporal since creation, which requires God to change from timeless to temporal, a change classical theism says is impossible. Timelessness is not an optional detail: it was adopted in classical theology to secure God's perfection, simplicity, and immutability, so giving it up unravels those doctrines too.` },
    { h: "Scripture describes a temporal God", t: `The Hebrew Bible's God walks in the garden (Genesis 3:8), comes down to see the tower (Genesis 11:5), regrets (1 Samuel 15:11), is persuaded by Moses (Exodus 32:9–14), and waits (Isaiah 30:18). The timeless, immutable God is a later synthesis of biblical language with Greek philosophy (Plato's Form of the Good; Aristotle's unmoved mover; Philo of Alexandria), not a discovery from scripture.` }

{
  id: "divine-simplicity",
  cat: "coherence",
  title: "Divine Simplicity",
  who: "Augustine; Anselm; Aquinas, Summa Theologiae I q.3; Fourth Lateran Council (1215); Vatican I (1870); Edward Feser; James Dolezal",
  claim: `God has no parts of any kind: no physical parts, no distinction between his essence and existence, no distinction between his attributes. God's goodness is God's power is God's knowledge is God himself. Simplicity is required for God to be the ultimate, uncaused explanation, since anything composite depends on its parts. It is the official teaching of the Catholic Church and of classic Reformed confessions.`,
  short: `If all of God's properties are identical to each other and to God, then God's knowledge is his power, and God himself is a property. Plantinga argued that a property cannot love, create, or know anything ("Does God Have a Nature?", 1980). If God's act of creating is identical to his necessary essence, creation is necessary too, and modal collapse follows. Classical theists' answers involve distinctions that seem to reintroduce the complexity simplicity denies.`,
  points: [
    { h: "God becomes a property", t: `If God *is* his goodness, and his goodness *is* his power, then goodness = power, and God = a property. Properties are abstract; they cannot know or will anything. Plantinga's argument (*Does God Have a Nature?*, Marquette, 1980) is the classic statement. Responses (Stump & Kretzmann; Brower's truthmaker account) reinterpret the identity claims in ways critics regard as abandoning what the doctrine originally said.` },
    { h: "Modal collapse", t: `God's will to create this world is identical with God's essence. God's essence is necessary. So God's will to create this world is necessary, and so is everything it brings about. Nothing could have been different. This contradicts the doctrine that creation was free and contingent (Mullins, 2013; Schmid & Mullins, 2022). Classical theists reply with "extrinsic" accounts on which God's act is the same in every world but its *effects* differ. Then there is no fact in God that explains why this world exists rather than another, which leaves the existence of this world unexplained after all.` },
    { h: "The 'aloneness' problem", t: `If God is simple and immutable, God is intrinsically the same whether or not he creates. Schmid and Mullins (*Religious Studies*, 2022) argue that this makes it impossible for God to exist without creation in one world and with it in another, because there would be no intrinsic difference in God to account for the difference. Simplicity and divine freedom cannot both be held.` },
    { h: "Simplicity versus the Trinity", t: `A God with no distinctions of any kind is also a God of three Persons, really distinct from one another. Theologians answer that the Persons are distinguished by "relations of origin" that are identical with the divine essence. But if Father = essence and Son = essence, then Father = Son by transitivity, which is the heresy of modalism. See [[trinity]].` }
  ],
  replies: [
    { q: "You're treating God as a being among beings. God is Being itself (ipsum esse subsistens), beyond such categories.", a: `If God is beyond all categories, then nothing positive can be said about him: not that he is good, personal, loving, or the creator, since those are categories too. Saying "God is beyond our concepts" when an objection lands, while using those concepts freely when making the case for God, is having it both ways. And Being itself creating some things and not others still raises the question of what in Being itself explains the choice.`, k: "god is being itself ipsum esse subsistens not a being among beings beyond categories analogy" }
  ],
  sources: [

{
  id: "trinity",
  cat: "coherence",
  title: "The Trinity Is a Mystery, Not a Contradiction",
  who: "Council of Nicaea (325); Constantinople (381); the Athanasian Creed; Augustine, De Trinitate; Peter van Inwagen (relative identity); William Lane Craig & J. P. Moreland (social trinitarianism); Richard Swinburne",
  claim: `There is one God who exists eternally as three distinct Persons: Father, Son, and Holy Spirit. Each is fully God, yet there are not three gods but one. This is beyond human comprehension, but it is not a contradiction: God is one in *being* (ousia) and three in *person* (hypostasis). Analogies such as water as ice, liquid, and steam, or the mind, its self-knowledge, and its love (Augustine), point to how this can be.`,
  short: `Stated plainly, the doctrine is a logically inconsistent set: the Father is God, the Son is God, the Father is not the Son, and there is exactly one God. Every attempt to make it consistent drifts into a position the creeds condemn. "God" meaning a shared nature makes three gods (tritheism). Persons as modes of one God is modalism. Ranking the Son below the Father is subordinationism. Or the attempt uses logic of its own (relative identity) that critics regard as ad hoc. The doctrine was formulated over centuries of political conflict and is not stated in the New Testament.`,
  points: [
    { h: "The inconsistent tetrad", t: `(1) The Father is God. (2) The Son is God. (3) The Father is not the Son. (4) There is exactly one God. If "is God" in (1) and (2) means "is identical to God," then by transitivity Father = Son, contradicting (3). If it means "is divine" (has the divine nature), then there are three divine beings, contradicting (4) unless "one God" is redefined. Dale Tuggy's SEP entry on the Trinity lays out the logical options and their costs.` },
    { h: "Social trinitarianism leans toward tritheism", t: `Craig and Moreland model God as one "soul" with three centers of consciousness, or as a whole of which the three Persons are parts. Critics (Tuggy; Leftow, "Anti Social Trinitarianism," 1999) note that this makes the Persons less than fully God, since each is only a part of God. That contradicts the creeds. If each Person has its own mind and will, there are three agents, which is three gods in all but name.` },
    { h: "Latin and relative-identity models lean toward modalism", t: `Leftow's "Latin" model treats the Persons as one God living three "life streams," like a time traveler appearing three times in one scene. Critics say this is modalism, the view that Father, Son, and Spirit are three roles of one person, condemned since the 3rd century (Sabellius). Van Inwagen's relative identity approach says Father and Son are the "same God" but "different persons," with no absolute identity. That requires rejecting classical identity logic, which most philosophers regard as too high a price.` },
    { h: "Every popular analogy is a heresy", t: `Water as ice, liquid, and steam is modalism: one substance in three successive states. The sun, its light, and its heat is Arianism: creature-like emanations. The shamrock (three leaves, one plant) is partialism, since each leaf is only part of the plant. The egg (shell, white, yolk) is the same. When every analogy offered fails, the problem may be that there is nothing coherent to be analogous to.` },
    { h: "It isn't in the New Testament", t: `The word "Trinity" first appears with Theophilus of Antioch (c. 180) and Tertullian (c. 200). The one explicit trinitarian proof-text, the Johannine Comma (1 John 5:7–8, "the Father, the Word, and the Holy Ghost: and these three are one"), is a late Latin interpolation absent from all early Greek manuscripts. It entered Erasmus's third edition (1522) under pressure and so reached the King James Version. The New Testament typically distinguishes "God" (the Father) from Jesus the "Lord" (1 Corinthians 8:6; John 17:3; Mark 13:32). Pre-Nicene writers such as Justin Martyr called the Logos a "second God" subordinate to the Father, which later orthodoxy would reject. See [[jesus-claimed-god]].` },
    { h: "It was settled by councils and emperors", t: `Nicaea (325) was convened by Constantine and adopted *homoousios* (same substance), a term not found in scripture, previously associated with modalists, and contested for decades afterward. Arian and semi-Arian creeds held official favor under later emperors (Constantius II). The full doctrine of the Spirit's equal divinity came at Constantinople in 381, under Theodosius, who had made Nicene Christianity the state religion the year before. The *filioque* dispute over whether the Spirit proceeds from the Father "and the Son" split the Eastern and Western churches (1054) and remains unresolved. A doctrine revealed by God might be expected to be clearer.` }
